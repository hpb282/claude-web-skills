            ui.toast('Đã giao bài vần ' + van + ' cho ' + S.studentLabel(studentId) + '.');
            VV.app.refresh();
          };
        }
      }
    );
  }

  view.render = render;
  view.setCompare = function (on) { view.compare = on; };
  view.act = {
    detail: function (el) {
      var prof = el.closest('.compare-grid > div');
      if (prof && view.compare) {
        var idx = Array.prototype.indexOf.call(prof.parentNode.children, prof);
        if (idx === 1) { var tmp = view.selected; view.selected = view.second; detail(el.getAttribute('data-van')); view.selected = tmp; return; }
      }
      detail(el.getAttribute('data-van'));
    },
    assign: function (el) {
      var sid = el.getAttribute('data-student');
      S.commit(function (s) {
        s.assignments[sid] = { van: el.getAttribute('data-van'), level: el.getAttribute('data-level'), source: 'goi-y', date: Date.now(), reason: 'Giao theo gợi ý của bản đồ âm vần.' };
      });
      ui.toast('Đã giao bài vần ' + el.getAttribute('data-van') + ' cho ' + S.studentLabel(sid) + '.');
      VV.app.refresh();
    },
    change: function (el) { changeDialog(el.getAttribute('data-student')); },
    unassign: function (el) {
      var sid = el.getAttribute('data-student');
      S.commit(function (s) { delete s.assignments[sid]; });
      ui.toast('Đã bỏ giao bài cho ' + S.studentLabel(sid) + '.');
      VV.app.refresh();
    },
    compose: function (el) {
      var van = el.getAttribute('data-van'), err = el.getAttribute('data-error');
      VV.assistant.prefill('exercises', {
        vans: [van],
        errors: err ? [D.label(D.READ_ERRORS, err)] : [],
        objective: 'Đọc đúng các tiếng có vần ' + van + ' trong tiếng, từ và câu; phân biệt vần ' + van + ' với các vần gần giống.'
      });
    },
    preview: function (el) {
      VV.studentMode.open({ preview: true, van: el.getAttribute('data-van'), level: el.getAttribute('data-level') });
    }
  };
  // Nhớ giai đoạn giáo viên đã mở trên bản đồ khi màn hình vẽ lại.
  document.addEventListener('toggle', function (e) {
    var d = e.target;
    if (d && d.classList && d.classList.contains('map-stage')) view.openStages[d.getAttribute('data-stage')] = d.open;
  }, true);

  view.onchange = function (e) {
    var t = e.target;
    if (t.name === 'stuA') { view.selected = t.value; history.replaceState(null, '', '#/ban-do/' + t.value); VV.app.refresh(); }
    else if (t.name === 'stuB') { view.second = t.value; VV.app.refresh(); }
    else if (t.getAttribute('data-role') === 'compare') { view.compare = t.checked; VV.app.refresh(); }
  };

  VV.views['ban-do'] = view;
})(window.VV = window.VV || {});

</script>
<script>
/* js/games.js */
/* Trò chơi tương tác và Góc luyện tập (màn hình học sinh). */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store, V = VV.viet;

  var GAME_TYPES = [
    { id: 'nhan-dien', label: 'Nhận diện vần', desc: 'Nghe vần, chọn tiếng có vần đó.' },
    { id: 'ghep-tieng', label: 'Ghép tiếng', desc: 'Âm đầu, vần và dấu thanh ghép thành tiếng.' },
    { id: 'chon-tu', label: 'Chọn từ đúng', desc: 'Chọn từ viết đúng chính tả.' },
    { id: 'hoan-thanh-cau', label: 'Hoàn thành câu', desc: 'Chọn tiếng điền vào chỗ trống trong câu.' }
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function uniq(arr) { return arr.filter(function (x, i) { return arr.indexOf(x) === i; }); }

  // ---------- Sinh câu hỏi (dùng được cho cả bài âm và bài vần) ----------
  // Các âm, vần cùng nhóm và cùng loại (âm đầu với âm đầu, vần với vần).
  function siblings(van) {
    var g = D.groupOfVan(van);
    var cons = D.isConsonantUnit(van);
    return g.vans.filter(function (v) { return v !== van && D.isConsonantUnit(v) === cons; });
  }
  // Tiếng nhiễu: lấy từ các âm, vần khác trong nhóm nhưng không chứa âm, vần đang hỏi.
  function decoys(van, n) {
    var g = D.groupOfVan(van);
    var pool = [];
    g.vans.forEach(function (v) { if (v !== van) g.words[v].forEach(function (w) { if (!D.matches(w, van) && pool.indexOf(w) === -1) pool.push(w); }); });
    if (pool.length < n) {
      // Nhóm quá nhỏ: lấy thêm từ nhóm liền trước.
      var prev = D.GROUPS[g.id - 2];
      if (prev) prev.vans.forEach(function (v) { prev.words[v].forEach(function (w) { if (!D.matches(w, van) && pool.indexOf(w) === -1) pool.push(w); }); });
    }
    return shuffle(pool).slice(0, n);
  }
  // Phương án sai cho bài ghép tiếng: đổi dấu thanh (hợp luật), hoặc đổi sang vần gần giống.
  function ghepDecoys(w, van) {
    return V.toneDistractors(w, D.isConsonantUnit(van) ? [] : siblings(van));
  }

  function qNhanDien(van, level, used) {
    var g = D.groupOfVan(van);
    var words = g.words[van].filter(function (w) { return used.indexOf(w) === -1; });
    var w = pick(words.length ? words : g.words[van]);
    var ds = decoys(van, level === 'ho-tro' ? 1 : 2);
    return {
      type: 'nhan-dien', van: van, word: w,
      prompt: 'Chọn tiếng có ' + D.unitWord(van), focus: van, speakText: van,
      options: shuffle([w].concat(ds)), answer: w, showVan: level === 'ho-tro'
    };
  }

  function qGhep(van, level, used) {
    var g = D.groupOfVan(van);
    var words = g.words[van].filter(function (w) { return used.indexOf(w) === -1; });
    var w = pick(words.length ? words : g.words[van]);
    var p = V.parse(w);
    var ds = ghepDecoys(w, van).slice(0, level === 'ho-tro' ? 1 : 2);
    if (!ds.length) return qNhanDien(van, level, used);
    return {
      type: 'ghep-tieng', van: van, word: w,
      prompt: 'Ghép thành tiếng', parts: [p.initial || '', p.van, V.TONE_NAME[p.tone]], speakText: w,
      options: shuffle([w].concat(ds)), answer: w, showVan: level === 'ho-tro'
    };
  }

  function qChonTu(van, level) {
    var g = D.groupOfVan(van);
    var phrases = g.phrases.filter(function (ph) { return ph.split(' ').some(function (x) { return D.matches(x, van); }); });
    var sibs = siblings(van);
    if (!phrases.length || !sibs.length) return qNhanDien(van, level, []);
    var ph = pick(phrases);
    var parts = ph.split(' ');
    var idx = 0;
    parts.forEach(function (x, i) { if (D.matches(x, van)) idx = i; });
    var p = V.parse(parts[idx]);
    var cons = D.isConsonantUnit(van);
    // Viết sai: thay âm đầu (bài âm) hoặc thay vần (bài vần) bằng âm, vần gần giống trong nhóm.
    var wrong = sibs.filter(function (v) { return cons || V.validTones(v).indexOf(p.tone) !== -1; }).map(function (v) {
      var copy = parts.slice();
      var w = cons ? V.compose(v, p.van, p.tone) : V.compose(p.initial, v, p.tone);
      copy[idx] = parts[idx][0] === parts[idx][0].toUpperCase() ? w[0].toUpperCase() + w.slice(1) : w;
      return copy.join(' ');
    });
    var ds = uniq(wrong).filter(function (x) { return x !== ph; }).slice(0, level === 'ho-tro' ? 1 : 2);
    if (!ds.length) return qNhanDien(van, level, []);
    return {
      type: 'chon-tu', van: van, word: parts[idx],
      prompt: 'Từ nào viết đúng?', speakText: ph,
      options: shuffle([ph].concat(ds)), answer: ph, showVan: level === 'ho-tro'
    };
  }

  function qCau(van, level) {
    var g = D.groupOfVan(van);
    if (!g.fill.length) return qNhanDien(van, level, []);
    var fills = g.fill.filter(function (f) { return D.matches(f.answer, van); });
    var f = pick(fills.length ? fills : g.fill);
    var opts = level === 'ho-tro' ? [f.answer, f.options.filter(function (o) { return o !== f.answer; })[0]] : f.options;
    return {
      type: 'hoan-thanh-cau', van: D.unitOf(g, f.answer) || van, word: f.answer,
      prompt: 'Chọn tiếng điền vào chỗ trống', sentence: f.text, speakText: f.text.replace('___', f.answer),
      options: shuffle(opts), answer: f.answer, showVan: level === 'ho-tro'
    };
  }

  // Nhiệm vụ do giáo viên duyệt trong kho học liệu.
  function libraryQuestions(van, level) {
    var out = [];
    S.state.library.forEach(function (item) {
      if (item.kind !== 'bai-tap') return;
      (item.content.tasks || []).forEach(function (t) {
        if (!t.options || t.options.length < 2 || !t.answer) return;
        if (van && t.van !== van) return;
        if (level && t.level !== level) return;
        out.push({
          type: t.type, van: t.van || van, word: t.answer, fromLibrary: true,
          prompt: t.prompt || 'Chọn đáp án đúng', freeText: t.question, speakText: t.question.replace('___', t.answer),
          options: shuffle(t.options), answer: t.answer, showVan: t.level === 'ho-tro'
        });
      });
    });
    return out;
  }

  // Một lượt luyện 6 câu.
  function buildRound(cfg) {
    var count = 6;
    var qs = [];
    var used = [];
    var gen = { 'nhan-dien': qNhanDien, 'ghep-tieng': qGhep, 'chon-tu': qChonTu, 'hoan-thanh-cau': qCau };
    var vans = cfg.vans && cfg.vans.length ? cfg.vans : [cfg.van];
    if (!cfg.type) {
      var lib = shuffle(libraryQuestions(cfg.van, cfg.level)).slice(0, 2);
      qs = qs.concat(lib);
    }
    var mix = cfg.type ? [cfg.type] :
      cfg.level === 'ho-tro' ? ['nhan-dien', 'nhan-dien', 'ghep-tieng'] :
      cfg.level === 'van-dung' ? ['hoan-thanh-cau', 'chon-tu', 'ghep-tieng'] :
      ['nhan-dien', 'ghep-tieng', 'chon-tu', 'hoan-thanh-cau'];
    var guard = 0;
    while (qs.length < count && guard < 40) {
      guard++;
      var type = mix[qs.length % mix.length];
      var van = vans[qs.length % vans.length];
      var q = gen[type](van, cfg.level || 'tu-lam', used);
      var key = q.type + '|' + q.answer;
      if (used.indexOf(key) !== -1 && guard < 30) continue;
      used.push(key); used.push(q.word);
      qs.push(q);
    }
    return qs;
  }

  // ---------- Góc luyện tập ----------
  var sm = null; // trạng thái phiên
  var root = null;
  var advanceTimer = null;

  function open(cfg) {
    root = document.getElementById('student-mode');
    sm = { cfg: cfg || {}, step: 'who', studentId: cfg && cfg.studentId || null, idx: 0, results: [], answered: false };
    if (cfg && cfg.preview) { sm.step = 'intro'; sm.cfg.level = cfg.level || 'tu-lam'; }
    else if (cfg && cfg.studentId) sm.step = 'intro';
    else if (cfg && cfg.noStudent) sm.step = 'intro';
    root.classList.add('is-open');
    root.removeAttribute('hidden');
    document.body.classList.add('student-open');
    root.setAttribute('aria-hidden', 'false');
    document.getElementById('app').setAttribute('inert', '');
    draw(true);
  }

  function close() {
    clearTimeout(advanceTimer);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    root.classList.remove('is-open');
    root.setAttribute('hidden', '');
    root.innerHTML = '';
    document.body.classList.remove('student-open');
    document.getElementById('app').removeAttribute('inert');
    var card = sm && sm.step === 'card' ? sm.card : null;
    sm = null;
    // Mở từ mã QR: quay về bài học chứa thẻ thay vì mở lại thẻ.
    if (card && VV.app.route === 'the') { location.hash = '#/bai-hoc/' + (D.groupOfVan(card.van) || D.GROUPS[0]).id; return; }
    VV.app.refresh();
  }

  // ---------- Thẻ vần biết nói (mở từ mã QR hoặc trang bài học) ----------
  function openCard(word) {
    var found = D.findWord(word);
    var g = found && found.group;
    if (!g) { ui.toast('Không tìm thấy thẻ cho “' + word + '”.', 'error'); return; }
    open({ noStudent: true });
    sm.step = 'card';
    sm.card = { word: String(word).toLowerCase(), van: found.unit };
    draw(true);
  }
  function drawCard() {
    var c = sm.card, p = V.parse(c.word);
    var flat = V.compose(p.initial, p.van, 'ngang');
    var list = D.groupOfVan(c.van).words[c.van];
    var i = list.indexOf(c.word);
    return '<div class="sm-body sm-center">' +
      '<h1 class="sm-title" id="sm-title">Thẻ ' + ui.esc(D.unitLabel(c.van)) + '</h1>' +
      '<p class="sm-parts reading">' + (p.initial ? '<span class="part' + (D.isConsonantUnit(c.van) ? ' part-van' : '') + '">' + ui.esc(p.initial) + '</span><span class="plus">+</span>' : '') +
      '<span class="part' + (D.isConsonantUnit(c.van) ? '' : ' part-van') + '">' + ui.esc(p.van) + '</span></p>' +
      '<ol class="card-steps">' +
      '<li class="card-step"><p class="card-step-label">Đọc tiếng</p><p class="reading card-word">' + ui.esc(flat) + '</p>' + ui.speakBtn(flat, 'Nghe “' + flat + '”', 'sm-speak') + '</li>' +
      (p.tone !== 'ngang'
        ? '<li class="card-step"><p class="card-step-label">Thêm ' + ui.esc(V.TONE_NAME[p.tone]) + '</p><p class="reading card-word">' + ui.vanWord(c.word, c.van) + '</p>' + ui.speakBtn(c.word, 'Nghe “' + c.word + '”', 'sm-speak') + '</li>'
        : '') +
      '<li class="card-step"><p class="card-step-label">Viết vào vở ô li</p><p class="reading card-word card-write oli-paper">' + ui.esc(c.word) + '</p></li>' +
      '</ol>' +
      '<div class="btn-row sm-card-nav">' +
      (i > 0 ? '<button type="button" class="btn btn-lg" data-sm="card" data-word="' + ui.esc(list[i - 1]) + '">' + ui.icon('arrowLeft') + ui.esc(list[i - 1]) + '</button>' : '') +
      (i < list.length - 1 ? '<button type="button" class="btn btn-lg" data-sm="card" data-word="' + ui.esc(list[i + 1]) + '">' + ui.esc(list[i + 1]) + ui.icon('arrowRight') + '</button>' : '') +
      '<button type="button" class="btn btn-primary btn-lg" data-sm="card-practice">' + ui.icon('play') + 'Luyện ' + ui.esc(D.unitLabel(c.van)) + '</button>' +
      '</div></div>';
  }

  // Bài của em: giáo viên giao > gợi ý của bản đồ > cấu hình truyền vào.
  function resolvePlan() {
    var c = sm.cfg;
    if (c.van || c.vans) return { van: c.van || c.vans[0], vans: c.vans, level: c.level || 'tu-lam', type: c.type, source: c.preview ? 'xem-thu' : 'chon' };
    if (sm.studentId) {
      var a = S.assignment(sm.studentId);
      if (a) return { van: a.van, level: a.level, source: 'giao' };
      var s = S.suggest(sm.studentId);
      return { van: s.van, level: s.level, source: 'goi-y' };
    }
    var g = D.GROUPS[S.state.classInfo.progress - 1];
    return { van: g.vans[0], vans: g.vans, level: 'tu-lam', source: 'chon' };
  }

  function topbar() {
    var label = sm.step === 'card' ? 'Thẻ biết nói' : sm.cfg.preview ? 'Xem thử, không ghi kết quả' : (sm.studentId ? S.studentLabel(sm.studentId) : 'Chơi thử, không ghi kết quả');
    var prog = sm.step === 'play' ? '<div class="sm-progress" role="progressbar" aria-label="Tiến độ" aria-valuemin="0" aria-valuemax="' + sm.questions.length + '" aria-valuenow="' + sm.idx + '">' +
      sm.questions.map(function (q, i) {
        var r = sm.results[i];
        return '<span class="sm-step' + (i === sm.idx ? ' is-current' : '') + (r ? (r.correct ? ' is-ok' : ' is-miss') : '') + '"></span>';
      }).join('') + '</div>' : '<span></span>';
    return '<header class="sm-top"><button type="button" class="btn btn-ghost sm-exit" data-sm="exit" aria-label="Về trang giáo viên">' + ui.icon('home') + '<span aria-hidden="true">Về trang giáo viên</span></button>' +
      prog + '<span class="sm-who">' + ui.esc(label) + '</span></header>';
  }

  function drawWho() {
    var st = S.state.students;
    return '<div class="sm-body sm-center"><h1 class="sm-title" id="sm-title">Em là bạn nào?</h1>' +
      '<div class="sm-who-grid">' + st.map(function (s) {
        return '<button type="button" class="sm-who-btn" data-sm="who" data-id="' + s.id + '">' + ui.esc(s.code) + '</button>';
      }).join('') + '</div>' +
      '<button type="button" class="btn btn-ghost" data-sm="guest">Chơi thử, không ghi kết quả</button></div>';
  }

  function drawIntro() {
    var plan = resolvePlan();
    sm.plan = plan;
    var g = D.groupOfVan(plan.van);
    var examples = g.words[plan.van].slice(0, 3);
    var srcText = { giao: 'Bài cô giao cho em', 'goi-y': 'Bài gợi ý cho em', chon: 'Bài luyện', 'xem-thu': 'Xem thử bài luyện' }[plan.source];
    return '<div class="sm-body sm-center">' +
      '<p class="sm-kicker">' + ui.esc(srcText) + '</p>' +
      '<h1 class="sm-title" id="sm-title">Hôm nay em luyện ' + D.unitWord(plan.van) + '</h1>' +
      '<div class="sm-van-card"><span class="sm-van">' + ui.esc(plan.vans ? plan.vans.join(', ') : plan.van) + '</span>' +
      ui.speakBtn(plan.vans ? plan.vans.join(', ') : plan.van, 'Nghe vần', 'sm-speak') + '</div>' +
      '<p class="sm-examples">' + examples.map(function (w) { return '<span class="reading">' + ui.vanWord(w, plan.van) + '</span>'; }).join('') + '</p>' +
      '<button type="button" class="btn btn-primary btn-xl" data-sm="start" autofocus>Bắt đầu</button></div>';
  }

  function optionHTML(q, o, i) {
    var r = sm.results[sm.idx];
    var cls = '';
    if (sm.answered) {
      if (o === q.answer) cls = ' is-correct';
      else if (r && r.chosen === o) cls = ' is-wrong';
    }
    // Mức có hỗ trợ: tô vần ở mọi phương án để em so sánh, không chỉ tô đáp án đúng.
    var hl = D.isConsonantUnit(q.van) ? ((V.parse(o) || {}).initial || null) : null;
    var content = q.showVan && q.type !== 'chon-tu' ? ui.vanWord(o, hl) : ui.esc(o);
    if (q.type === 'chon-tu' && q.showVan) content = ui.vanText(o, [q.van].concat(siblings(q.van)));
    return '<button type="button" class="sm-option' + cls + '" data-sm="answer" data-value="' + ui.esc(o) + '"' + (sm.answered ? ' aria-disabled="true"' : '') + '>' +
      '<span class="reading">' + content + '</span></button>';
  }

  function drawPlay() {
    var q = sm.questions[sm.idx];
    var head = '';
    if (q.freeText) {
      head = '<p class="sm-prompt">' + ui.esc(q.prompt) + '</p><p class="sm-sentence reading">' + ui.esc(q.freeText).replace('___', '<span class="blank">___</span>') + '</p>';
    } else if (q.type === 'nhan-dien') {
      head = '<p class="sm-prompt">' + ui.esc(q.prompt) + '</p><div class="sm-van-card"><span class="sm-van">' + ui.esc(q.focus) + '</span>' + ui.speakBtn(q.focus, 'Nghe vần ' + q.focus, 'sm-speak') + '</div>';
    } else if (q.type === 'ghep-tieng') {
      head = '<p class="sm-prompt">' + ui.esc(q.prompt) + '</p><p class="sm-parts reading">' +
        (q.parts[0] ? '<span class="part">' + ui.esc(q.parts[0]) + '</span><span class="plus">+</span>' : '') +
        '<span class="part part-van">' + ui.esc(q.parts[1]) + '</span><span class="plus">+</span><span class="part part-tone">' + ui.esc(q.parts[2]) + '</span></p>';
    } else if (q.type === 'hoan-thanh-cau') {
      head = '<p class="sm-prompt">' + ui.esc(q.prompt) + '</p><p class="sm-sentence reading">' + ui.esc(q.sentence).replace('___', '<span class="blank">' + (sm.answered ? ui.esc(q.answer) : '___') + '</span>') + '</p>';
    } else {
      head = '<p class="sm-prompt">' + ui.esc(q.prompt) + '</p>';
    }
    var r = sm.results[sm.idx];
    var feedback = '';
    if (sm.answered && r) {
      feedback = r.correct
        ? '<p class="sm-feedback is-ok" role="status">' + ui.icon('check') + 'Đúng rồi!</p>'
        : '<p class="sm-feedback is-miss" role="status">Chưa đúng. Đáp án là <b class="reading">' + ui.esc(q.answer) + '</b></p>';
    }
    return '<div class="sm-body">' + head +
      '<div class="sm-options' + (q.type === 'chon-tu' || q.type === 'hoan-thanh-cau' && q.options[0].length > 6 ? ' is-wide' : '') + '">' + q.options.map(function (o, i) { return optionHTML(q, o, i); }).join('') + '</div>' +
      '<div class="sm-foot">' + feedback +
      (sm.answered ? '<button type="button" class="btn btn-primary btn-lg" data-sm="next" id="sm-next">' + (sm.idx === sm.questions.length - 1 ? 'Xem kết quả' : 'Câu tiếp') + ui.icon('arrowRight') + '</button>' : '') +
      '</div></div>';
  }

  function drawDone() {
    var ok = sm.results.filter(function (r) { return r.correct; }).length;
    var plan = sm.plan;
    var g = D.groupOfVan(plan.van);
    var readList = g.words[plan.van].slice(0, 3);
    sm.readCheck = sm.readCheck || {};
    var recorded = sm.studentId && !sm.cfg.preview;
    return '<div class="sm-body sm-center">' +
      '<h1 class="sm-title" id="sm-title">Em đã làm xong!</h1>' +
      '<p class="sm-score"><span class="num">' + ok + '/' + sm.results.length + '</span> câu chọn đúng</p>' +
      (recorded
        ? '<section class="sm-teacher" aria-label="Phần dành cho giáo viên"><h2>Đọc cho cô nghe</h2>' +
          '<p class="muted">Giáo viên nghe em đọc từng tiếng và ghi kết quả. Phần này cập nhật bản đồ âm vần.</p>' +
          '<ul class="read-check">' + readList.map(function (w) {
            var v = sm.readCheck[w];
            return '<li><span class="reading big">' + ui.vanWord(w, plan.van) + '</span>' +
              '<span class="btn-row"><button type="button" class="btn btn-sm' + (v === true ? ' is-on-ok' : '') + '" data-sm="read" data-word="' + ui.esc(w) + '" data-ok="1" aria-pressed="' + (v === true) + '">Đúng</button>' +
              '<button type="button" class="btn btn-sm' + (v === false ? ' is-on-miss' : '') + '" data-sm="read" data-word="' + ui.esc(w) + '" data-ok="0" aria-pressed="' + (v === false) + '">Chưa đúng</button></span></li>';
          }).join('') + '</ul></section>'
        : '<p class="muted">Lượt này không ghi vào hồ sơ.</p>') +
      '<div class="btn-row"><button type="button" class="btn btn-lg" data-sm="again">Luyện lại</button>' +
      '<button type="button" class="btn btn-primary btn-lg" data-sm="finish">Xong</button></div></div>';
  }

  // enter = true khi một màn hình hoặc câu hỏi mới xuất hiện (không phát lại khi chỉ cập nhật trạng thái trả lời).
  function draw(enter) {
    var body = sm.step === 'card' ? drawCard() : sm.step === 'who' ? drawWho() : sm.step === 'intro' ? drawIntro() : sm.step === 'play' ? drawPlay() : drawDone();
    if (enter) body = body.replace('class="sm-body', 'class="sm-enter sm-body');
    root.innerHTML = '<div class="sm-shell" role="dialog" aria-modal="true" aria-labelledby="sm-title">' + topbar() + body + '</div>';
    if (sm.step === 'play' && !sm.answered) {
      var t = root.querySelector('.sm-prompt');
      if (t) { t.setAttribute('id', 'sm-title'); }
      var first = root.querySelector('.sm-option');
      if (first) first.focus();
    } else {
      var f = root.querySelector('[autofocus]') || root.querySelector('#sm-next') || root.querySelector('.sm-title');
      if (f) { if (!f.hasAttribute('tabindex') && f.tagName === 'H1') f.setAttribute('tabindex', '-1'); f.focus(); }
    }
  }

  function startRound() {
    var plan = sm.plan || resolvePlan();
    sm.plan = plan;
    sm.questions = buildRound(plan);
    sm.idx = 0; sm.results = []; sm.answered = false; sm.readCheck = {};
    sm.step = 'play';
    draw(true);
    var q = sm.questions[0];
    if (q.type === 'nhan-dien' && q.showVan && ui.canSpeak()) ui.speak(q.focus);
  }

  function answer(value) {
    if (sm.answered) return;
    var q = sm.questions[sm.idx];
    var correct = value === q.answer;
    sm.results[sm.idx] = { correct: correct, chosen: value, van: q.van, word: q.answer, type: q.type };
    sm.answered = true;
    draw();
    var opt = root.querySelector('.sm-option.is-correct');
    if (opt && !ui.reducedMotion()) opt.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    if (!correct) {
      var wrong = root.querySelector('.sm-option.is-wrong');
      if (wrong && !ui.reducedMotion()) wrong.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 280, easing: 'cubic-bezier(.36,.07,.19,.97)' });
    }
    if (ui.canSpeak()) ui.speak(q.speakText || q.answer);
    var nextBtn = root.querySelector('#sm-next');
    if (nextBtn) nextBtn.focus();
  }

  function finishRound() {
    if (sm.studentId && !sm.cfg.preview) {
      var sid = sm.studentId;
      var plan = sm.plan;
      var res = sm.results;
      var rc = sm.readCheck || {};
      S.commit(function (s) {
        var now = Date.now();
        res.forEach(function (r) {
          s.records.push({ id: S.uid('r'), studentId: sid, date: now, phase: 'thuong-xuyen', skill: 'nhan-dien', source: 'game',
            game: r.type, van: r.van, tieng: r.word, correct: r.correct });
        });
        Object.keys(rc).forEach(function (w) {
          s.records.push({ id: S.uid('r'), studentId: sid, date: now, phase: 'thuong-xuyen', skill: 'doc', source: 'luyen',
            van: plan.van, tieng: w, correct: rc[w], error: null, support: 'tu-doc' });
        });
        s.practice.push({ id: S.uid('p'), studentId: sid, date: now, van: plan.van, level: plan.level, total: res.length,
          correct: res.filter(function (r) { return r.correct; }).length });
      });
    }
  }

  function onClick(e) {
    var b = e.target.closest('[data-sm]');
    if (!b || !sm) return;
    var what = b.getAttribute('data-sm');
    if (what === 'exit') {
      if (sm.step === 'play' && sm.results.length && sm.studentId && !sm.cfg.preview) {
        ui.confirmDialog({ title: 'Dừng lượt luyện?', body: 'Kết quả của lượt đang làm dở sẽ không được lưu.' }, 'Dừng và thoát').then(function (ok) { if (ok) close(); });
        return;
      }
      close();
    } else if (what === 'card') { sm.card = { word: b.getAttribute('data-word'), van: sm.card.van }; draw(true); }
    else if (what === 'card-practice') { sm.cfg = { van: sm.card.van, level: 'ho-tro', noStudent: true }; sm.plan = null; sm.step = 'intro'; draw(true); }
    else if (what === 'who') { sm.studentId = b.getAttribute('data-id'); sm.step = 'intro'; draw(true); }
    else if (what === 'guest') { sm.studentId = null; sm.step = 'intro'; draw(true); }
    else if (what === 'start') startRound();
    else if (what === 'answer') answer(b.getAttribute('data-value'));
    else if (what === 'next') {
      if (sm.idx < sm.questions.length - 1) { sm.idx++; sm.answered = false; draw(true); }
      else { sm.step = 'done'; draw(true); }
    } else if (what === 'read') {
      sm.readCheck[b.getAttribute('data-word')] = b.getAttribute('data-ok') === '1';
      draw();
    } else if (what === 'again') { finishRound(); startRound(); }
    else if (what === 'finish') {
      finishRound();
      if (sm.studentId && !sm.cfg.preview) ui.toast('Đã lưu kết quả luyện tập của ' + S.studentLabel(sm.studentId) + '.');
      close();
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('student-mode');
    el.addEventListener('click', onClick);
    el.addEventListener('keydown', function (e) {
      if (!sm) return;
      if (e.key === 'Escape') { e.preventDefault(); onClick({ target: el.querySelector('[data-sm="exit"]') }); }
      if (sm.step === 'play' && !sm.answered && /^[1-4]$/.test(e.key)) {
        var opts = el.querySelectorAll('.sm-option');
        var o = opts[Number(e.key) - 1];
        if (o) answer(o.getAttribute('data-value'));
      }
    });
  });

  // ---------- Màn hình Trò chơi (giáo viên chọn) ----------
  var gv = { type: 'nhan-dien', group: null, studentId: '' };

  function renderGames(main) {
    var progress = S.state.classInfo.progress;
    if (!gv.group) gv.group = progress;
    var g = D.GROUPS[gv.group - 1];
    var libCount = libraryQuestions(null, null).length;
    main.innerHTML = '<section class="page">' +
      '<header class="page-head"><div><h1>Trò chơi tương tác</h1>' +
      '<p class="lede">Mỗi lượt 6 câu, chơi trên màn hình chung hoặc máy tính bảng. Kết quả chọn đúng chỉ phản ánh nhận diện; muốn biết em đọc được chưa, giáo viên vẫn cần nghe em đọc.</p></div></header>' +
      '<form class="panel game-setup" data-form="game">' +
      '<fieldset class="field"><legend>Chọn trò chơi</legend><div class="game-cards">' +
      GAME_TYPES.map(function (t) {
        return '<label class="game-card"><input type="radio" name="gtype" value="' + t.id + '"' + (gv.type === t.id ? ' checked' : '') + '>' +
          '<span class="game-card-title">' + ui.esc(t.label) + '</span><span class="game-card-desc">' + ui.esc(t.desc) + '</span>' + gamePreview(t.id) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<div class="form-grid">' +
      '<div class="field"><label for="g-group">Nhóm âm, vần</label><select id="g-group" name="group">' +
      ui.groupSelect('g-group-sel', 'group', gv.group).replace(/^<select[^>]*>/, '').replace(/<\/select>$/, '') +
      '</select></div>' +
      '<div class="field"><label for="g-stu">Ghi kết quả cho</label><select id="g-stu" name="student">' + ui.studentOptions(gv.studentId, 'Không ghi (chơi thử, cả lớp)') + '</select></div>' +
      '</div>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary btn-lg">' + ui.icon('play') + 'Bắt đầu chơi</button></div>' +
      '</form>' +
      '<section class="panel"><h2 class="panel-title">Bài luyện giáo viên đã duyệt</h2>' +
      (libCount
        ? '<p>Kho học liệu có ' + libCount + ' nhiệm vụ chọn đáp án đã duyệt. Chúng được trộn vào lượt luyện của học sinh có cùng vần và mức độ trong Góc luyện tập.</p><a class="btn" href="#/tro-ly/kho">Xem kho học liệu</a>'
        : '<p>Chưa có nhiệm vụ nào. Dùng Trợ lý soạn bài để soạn và duyệt bài tập; bài đã duyệt sẽ xuất hiện trong Góc luyện tập.</p><a class="btn" href="#/tro-ly">Soạn bài tập</a>') +
      '</section></section>';
  }

  function gamePreview(type) {
    if (type === 'nhan-dien') return '<span class="mini" aria-hidden="true"><b>an</b><i>bàn</i><i>chăn</i></span>';
    if (type === 'ghep-tieng') return '<span class="mini" aria-hidden="true"><b>b + an + huyền</b></span>';
    if (type === 'chon-tu') return '<span class="mini" aria-hidden="true"><i>khăn đỏ</i><i>khân đỏ</i></span>';
    return '<span class="mini" aria-hidden="true"><b>Bà cho bé quả ___</b></span>';
  }

  VV.views['tro-choi'] = {
    render: renderGames,
    act: {},
    onchange: function (e) {
      if (e.target.name === 'gtype') gv.type = e.target.value;
      if (e.target.name === 'group') gv.group = Number(e.target.value);
      if (e.target.name === 'student') gv.studentId = e.target.value;
    },
    onsubmit: function (e) {
      e.preventDefault();
      var g = D.GROUPS[gv.group - 1];
      open({ type: gv.type, vans: g.vans, van: g.vans[0], level: 'tu-lam', studentId: gv.studentId || null, noStudent: !gv.studentId });
    }
  };

  VV.studentMode = { open: open, openCard: openCard, close: close, buildRound: buildRound, GAME_TYPES: GAME_TYPES };

  // Địa chỉ #/the/<tiếng>: mở thẻ vần (dùng cho mã QR in trên thẻ giấy).
  VV.views.the = {
    render: function (root, params) {
      var word = params[0] || '';
      var found = D.findWord(word);
      var g = found && found.group;
      VV.views['bai-hoc'].render(root, [String(g ? g.id : 1)]);
      if (g) setTimeout(function () { openCard(word); }, 0);
    },
    get act() { return VV.views['bai-hoc'].act; }
  };
})(window.VV = window.VV || {});

</script>
<script>
/* js/view-lessons.js */
/* Bài học số: các nhóm âm, vần của lớp 1, thẻ biết nói, luyện viết trên giấy ô li, in phiếu. */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store, V = VV.viet;

  function statusOf(g) {
    var p = S.state.classInfo.progress;
    if (g.id < p) return { id: 'da-hoc', label: 'Đã học' };
    if (g.id === p) return { id: 'dang-hoc', label: 'Đang học' };
    return { id: 'chua-hoc', label: 'Chưa học' };
  }

  function renderIndex(root) {
    var cur = D.GROUPS[S.state.classInfo.progress - 1];
    root.innerHTML = '<section class="page"><header class="page-head"><div><h1>Bài học số</h1>' +
      '<p class="lede">' + D.GROUPS.length + ' nhóm âm, vần của lớp 1, xếp theo tiến độ. Mỗi bài có đọc mẫu, thẻ ghép tiếng, câu ngắn và phiếu luyện viết trên giấy ô li.</p></div>' +
      (cur ? '<a class="btn btn-primary" href="#/bai-hoc/' + cur.id + '">' + ui.icon('book') + 'Mở bài đang học: ' + ui.esc(cur.title) + '</a>' : '') + '</header>' +
      D.STAGES.map(function (st) {
        var gs = D.GROUPS.filter(function (g) { return g.stage === st.id; });
        if (!gs.length) return '';
        return '<section class="lesson-stage"><h2 class="stage-title">' + ui.esc(st.label) + ' <span class="muted">' + gs.length + ' nhóm</span></h2>' +
          '<ol class="lesson-grid">' + gs.map(function (g) {
            var s2 = statusOf(g);
            return '<li><a class="lesson-card is-' + s2.id + '" href="#/bai-hoc/' + g.id + '"' + (s2.id === 'dang-hoc' ? ' aria-current="step"' : '') + '>' +
              '<span class="lesson-num">Nhóm ' + g.id + '</span>' +
              '<span class="lesson-vans reading">' + g.vans.map(ui.esc).join('<span class="sep">,</span> ') + '</span>' +
              '<span class="lesson-status">' + s2.label + '</span></a></li>';
          }).join('') + '</ol></section>';
      }).join('') +
      '<p class="muted">Thứ tự là gợi ý theo tiến độ phổ biến. Giáo viên ẩn, đổi thứ tự hoặc thêm nhóm cho khớp bộ sách ở <a href="#/cai-dat/noi-dung">Cài đặt, Nội dung bài học</a>.</p>' +
      '</section>';
  }

  // Địa chỉ mở thẻ khi quét mã QR (cần đăng file lên web và nhập địa chỉ trong Cài đặt).
  function cardUrl(word) {
    var base = (S.state.classInfo.siteUrl || '').trim();
    if (!base) return '';
    return base.replace(/#.*$/, '') + '#/the/' + encodeURIComponent(word);
  }
  function qrHTML(word) {
    var url = cardUrl(word);
    if (!url) return '';
    try { return '<span class="card-qr">' + VV.qr.svg(url, { label: 'Mã QR mở thẻ ' + word }) + '</span>'; }
    catch (e) { return ''; }
  }

  function cardHTML(word, van, withQr) {
    var p = V.parse(word);
    var flat = V.compose(p.initial, p.van, 'ngang');
    var step = p.tone === 'ngang'
      ? 'Đọc “' + flat + '”, rồi viết vào vở.'
      : 'Đọc “' + flat + '”. Thêm ' + V.TONE_NAME[p.tone] + ' thành “' + word + '”, rồi viết vào vở.';
    return '<article class="van-card">' +
      '<p class="van-card-sum reading">' + (p.initial ? '<span' + (D.isConsonantUnit(van) ? ' class="hl-van"' : '') + '>' + ui.esc(p.initial) + '</span><span class="plus">+</span>' : '') +
      '<span' + (D.isConsonantUnit(van) ? '' : ' class="hl-van"') + '>' + ui.esc(p.van) + '</span></p>' +
      '<p class="van-card-word reading">' + ui.vanWord(word, van) + '</p>' +
      '<p class="van-card-step">' + ui.esc(step) + '</p>' +
      (withQr ? qrHTML(word) : '') +
      '<div class="btn-row">' + ui.speakBtn(flat, 'Nghe “' + flat + '”') + ui.speakBtn(word, 'Nghe “' + word + '”', 'btn-icon-strong') +
      '<button type="button" class="btn btn-sm btn-ghost" data-act="open-card" data-word="' + ui.esc(word) + '">' + ui.icon('expand') + 'Mở thẻ</button></div></article>';
  }

  function countWords(g) { return g.vans.reduce(function (n, v) { return n + g.words[v].length; }, 0); }

  function renderLesson(root, id) {
    var g = D.GROUPS[id - 1];
    if (!g) { renderIndex(root); return; }
    var st = statusOf(g);
    var prev = D.GROUPS[id - 2], next = D.GROUPS[id];
    var writeChoices = g.vans.concat(g.vans.map(function (v) { return g.words[v][0]; }), g.phrases.slice(0, 3));

    root.innerHTML = '<section class="page lesson">' +
      '<nav class="crumbs" aria-label="Vị trí"><a href="#/bai-hoc">Bài học số</a><span aria-hidden="true">/</span><span aria-current="page">Nhóm ' + g.id + '</span></nav>' +
      '<header class="page-head"><div><h1>Nhóm ' + g.id + ': <span class="reading">' + ui.esc(g.title) + '</span></h1>' +
      '<p class="lede">' + st.label + '. ' + g.vans.length + (g.kind === 'am' ? ' âm, ' : ' vần, ') + countWords(g) + ' tiếng, ' + g.phrases.length + ' từ ngữ' + (g.sentences.length ? ' và ' + g.sentences.length + ' câu' : '') + '.</p></div>' +
      '<div class="btn-row">' +
      '<button type="button" class="btn btn-primary" data-act="practice">' + ui.icon('play') + 'Cho học sinh luyện</button>' +
      (g.id !== S.state.classInfo.progress ? '<button type="button" class="btn" data-act="set-progress">Đặt làm bài đang học</button>' : '') +
      '<button type="button" class="btn" data-act="print-cards">' + ui.icon('printer') + 'In thẻ ghép tiếng</button>' +
      '<button type="button" class="btn" data-act="print-sheet">' + ui.icon('printer') + 'In phiếu luyện viết</button></div></header>' +
      (ui.canSpeak() ? '' : '<div class="banner banner-soft">Máy này chưa có giọng đọc tiếng Việt nên nút nghe sẽ không phát âm. Giáo viên đọc mẫu trực tiếp, hoặc cài giọng tiếng Việt cho hệ điều hành rồi mở lại trang.</div>') +

      '<section class="panel"><h2 class="panel-title">' + (g.kind === 'am' ? 'Âm và chữ' : 'Vần') + '</h2><div class="van-row">' +
      g.vans.map(function (v) {
        var parts = D.isConsonantUnit(v) ? (v.length > 1 ? 'chữ ghép ' + v.split('').join(' + ') : 'âm đầu') : (v.length > 1 ? v.split('').join(' + ') : 'nguyên âm');
        return '<div class="van-big"><span class="van-big-glyph reading">' + ui.esc(v) + '</span>' +
          '<span class="van-big-parts">' + ui.esc(parts) + '</span>' + ui.speakBtn(v, 'Nghe ' + D.unitLabel(v)) + '</div>';
      }).join('') + '</div></section>' +

      '<section class="panel"><h2 class="panel-title">Tiếng</h2>' +
      g.vans.map(function (v) {
        return '<div class="word-row"><span class="word-row-van reading">' + ui.esc(v) + '</span><ul class="chips">' +
          g.words[v].map(function (w) { return '<li><button type="button" class="chip reading" data-speak="' + ui.esc(w) + '" aria-label="Nghe tiếng ' + ui.esc(w) + '">' + ui.vanWord(w, v) + '</button></li>'; }).join('') +
          '</ul></div>';
      }).join('') + '</section>' +

      '<section class="panel"><h2 class="panel-title">Thẻ biết nói</h2>' +
      '<p class="muted">Ghép âm đầu với vần, đọc tiếng không dấu, thêm dấu thanh rồi viết. Bản in có đủ ' + countWords(g) + ' thẻ' +
      (S.state.classInfo.siteUrl ? ', mỗi thẻ có mã QR mở bài nghe trên điện thoại.' : '. <a href="#/cai-dat/qr">Nhập địa chỉ web</a> để in thẻ có mã QR.') + '</p>' +
      '<div class="card-grid">' + g.vans.map(function (v) { return cardHTML(g.words[v][0], v) + cardHTML(g.words[v][1], v); }).join('') + '</div></section>' +

      '<div class="two-col">' +
      '<section class="panel"><h2 class="panel-title">Từ ngữ</h2><ul class="phrase-list">' +
      g.phrases.map(function (ph) { return '<li><span class="reading">' + ui.vanText(ph, g.vans) + '</span>' + ui.speakBtn(ph) + '</li>'; }).join('') + '</ul></section>' +
      (g.sentences.length
        ? '<section class="panel"><h2 class="panel-title">Câu</h2><ul class="phrase-list sentences">' +
          g.sentences.map(function (s) { return '<li><span class="reading">' + ui.vanText(s, g.vans) + '</span>' + ui.speakBtn(s) + '</li>'; }).join('') + '</ul></section>'
        : '') +
      '</div>' +

      '<section class="panel"><h2 class="panel-title">Luyện viết trên ô li</h2>' +
      '<div class="write-tools"><div class="field field-inline"><label for="w-model">Chữ mẫu</label><select id="w-model">' +
      writeChoices.map(function (c) { return '<option>' + ui.esc(c) + '</option>'; }).join('') + '</select></div>' +
      '<label class="switch"><input type="checkbox" id="w-ghost" checked><span>Hiện chữ mẫu mờ</span></label>' +
      '<button type="button" class="btn" data-act="clear-canvas">' + ui.icon('refresh') + 'Viết lại</button></div>' +
      '<div class="canvas-wrap"><canvas id="write-canvas" aria-label="Khung viết ô li. Dùng ngón tay, bút cảm ứng hoặc chuột để viết theo chữ mẫu."></canvas></div>' +
      '<p class="muted">Chữ mẫu dùng kiểu chữ in Andika giúp nhận diện mặt chữ. Khi chấm hình chữ viết tay, giáo viên dựa vào mẫu chữ trong vở tập viết của lớp.</p></section>' +

      '<nav class="pager" aria-label="Chuyển bài">' +
      (prev ? '<a class="btn btn-ghost" href="#/bai-hoc/' + prev.id + '">' + ui.icon('arrowLeft') + 'Nhóm ' + prev.id + '</a>' : '<span></span>') +
      (next ? '<a class="btn btn-ghost" href="#/bai-hoc/' + next.id + '">Nhóm ' + next.id + ui.icon('arrowRight') + '</a>' : '<span></span>') +
      '</nav></section>';

    setupCanvas(root);
  }

  // ---------- Khung viết ô li ----------
  var pad = null;
  var resizeObs = null;
  function setupCanvas(root) {
    var canvas = root.querySelector('#write-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var strokes = [];
    var drawing = null;
    var CELL = 12; // một ô li (px CSS)

    function size() {
      var w = canvas.parentNode.clientWidth;
      var h = CELL * (4 * 3 + 4); // 3 dòng viết, chừa 2 ô trên và dưới
      var dpr = window.devicePixelRatio || 1;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paint();
    }
    function cssVar(n, fb) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb; }
    function paint() {
      if (!canvas.isConnected) return;
      var w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = cssVar('--surface', '#fffdf8'); ctx.fillRect(0, 0, w, h);
      var faint = cssVar('--oli', '#cfc8e8'), strong = cssVar('--oli-strong', '#9c92cc');
      // Dòng kẻ đậm là đường chân chữ, cách nhau 4 ô li như vở học sinh.
      for (var y = CELL; y < h; y += CELL) {
        var main = (y / CELL) % 4 === 2;
        ctx.strokeStyle = main ? strong : faint;
        ctx.lineWidth = main ? 1.4 : 0.8;
        ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
      }
      ctx.strokeStyle = faint; ctx.lineWidth = 0.8;
      for (var x = CELL * 4; x < w; x += CELL * 4) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke(); }
      var model = root.querySelector('#w-model').value;
      if (root.querySelector('#w-ghost').checked) {
        ctx.fillStyle = 'rgba(27,61,53,0.16)';
        // Chữ thường cao khoảng 2 ô li tính từ đường chân chữ.
        ctx.font = (CELL * 4.2) + 'px Andika, "Be Vietnam Pro", sans-serif';
        ctx.textBaseline = 'alphabetic';
        for (var line = 0; line < 3; line++) {
          var baseY = CELL * (4 * line + 6);
          var text = model;
          var tw = ctx.measureText(text + '   ').width;
          for (var xx = CELL * 2; xx + tw * 0.6 < w; xx += tw) ctx.fillText(text, xx, baseY);
        }
      }
      ctx.strokeStyle = cssVar('--ink', '#1b3d35'); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      strokes.concat(drawing ? [drawing] : []).forEach(function (s) {
        ctx.beginPath();
        s.forEach(function (pt, i) { if (i) ctx.lineTo(pt[0], pt[1]); else ctx.moveTo(pt[0], pt[1]); });
        ctx.stroke();
      });
    }
    function pos(e) { var r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    canvas.addEventListener('pointerdown', function (e) { canvas.setPointerCapture(e.pointerId); drawing = [pos(e)]; paint(); });
    canvas.addEventListener('pointermove', function (e) { if (!drawing) return; drawing.push(pos(e)); paint(); });
    function end() { if (drawing) { strokes.push(drawing); drawing = null; } }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    root.querySelector('#w-model').addEventListener('change', paint);
    root.querySelector('#w-ghost').addEventListener('change', paint);
    pad = { clear: function () { strokes = []; paint(); } };
    if (resizeObs) resizeObs.disconnect();
    resizeObs = new ResizeObserver(function () { size(); });
    resizeObs.observe(canvas.parentNode);
    size();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint);
  }

  // ---------- In ấn ----------
  function printCards(g) {
    var cards = [];
    g.vans.forEach(function (v) { g.words[v].forEach(function (w) { cards.push(cardHTML(w, v, true)); }); });
    ui.printHTML('<h1 class="print-title">Thẻ ghép tiếng nhóm ' + g.id + ': ' + ui.esc(g.title) + '</h1><div class="print-cards">' + cards.join('') + '</div>', 'Thẻ vần nhóm ' + g.id);
  }

  function oliRows(rows) {
    var out = '';
    for (var i = 0; i < rows; i++) out += '<div class="oli-line"></div>';
    return out;
  }
  function writingSheetHTML(title, items, guide) {
    return '<h1 class="print-title">' + ui.esc(title) + '</h1>' +
      '<p class="print-meta">Họ tên hoặc mã học sinh: ........................ Ngày: ..../..../........</p>' +
      (guide && guide.length ? '<ol class="print-guide">' + guide.map(function (gd) { return '<li>' + ui.esc(gd) + '</li>'; }).join('') + '</ol>' : '') +
      items.map(function (t) { return '<section class="print-write"><div class="oli-line is-model"><span class="reading">' + ui.esc(t) + '</span></div>' + oliRows(2) + '</section>'; }).join('');
  }
  function printSheet(g) {
    var items = g.vans.concat(g.vans.map(function (v) { return g.words[v][0]; }), g.phrases.slice(0, 2));
    ui.printHTML(writingSheetHTML('Phiếu luyện viết nhóm ' + g.id + ': ' + g.title, items, [g.kind === 'am' ? 'Viết chữ ghi âm trước, rồi viết tiếng.' : 'Viết vần trước, rồi viết tiếng.', 'Mỗi chữ mẫu viết hai dòng.']), 'Phiếu luyện viết nhóm ' + g.id);
  }

  var current = 1;
  VV.views['bai-hoc'] = {
    render: function (root, params) {
      if (params[0]) { current = Number(params[0]) || 1; renderLesson(root, current); }
      else renderIndex(root);
    },
    act: {
      practice: function () {
        var g = D.GROUPS[current - 1];
        VV.studentMode.open({ vans: g.vans, van: g.vans[0], level: 'tu-lam' });
      },
      'print-cards': function () { printCards(D.GROUPS[current - 1]); },
      'print-sheet': function () { printSheet(D.GROUPS[current - 1]); },
      'clear-canvas': function () { if (pad) pad.clear(); },
      'open-card': function (el) { VV.studentMode.openCard(el.getAttribute('data-word')); },
      'set-progress': function () {
        S.commit(function (s) { s.classInfo.progress = current; });
        ui.toast('Lớp đang học nhóm ' + current + '. Kho tiếng và gợi ý đã cập nhật.');
        VV.app.refresh();
      }
    }
  };
  VV.lessons = { writingSheetHTML: writingSheetHTML, cardHTML: cardHTML };
})(window.VV = window.VV || {});

</script>
<script>
/* js/view-assistant.js */
/* Trợ lý soạn bài: AI soạn nháp, kiểm tra kho tiếng, giáo viên sửa và duyệt. */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store, V = VV.viet;

  var TABS = [
    { id: 'bai-tap', tool: 'exercises', label: 'Bài tập theo mức độ', libKind: 'bai-tap' },
    { id: 'truyen', tool: 'story', label: 'Truyện đúng vần', libKind: 'truyen' },
    { id: 'phu-huynh', tool: 'parent', label: '5 phút cùng con', libKind: 'phu-huynh' },
    { id: 'phieu-viet', tool: 'writing', label: 'Phiếu luyện viết', libKind: 'phieu-viet' },
    { id: 'kho', tool: null, label: 'Kho học liệu' }
  ];
  var KIND_LABEL = { 'bai-tap': 'Bài tập', truyen: 'Truyện', 'phu-huynh': '5 phút cùng con', 'phieu-viet': 'Phiếu luyện viết' };

  var drafts = {};
  var forms = {};
  var busy = null; // { tool, controller }
  var tab = TABS[0];

  function currentGroup() { return D.GROUPS[S.state.classInfo.progress - 1]; }

  function formState(tool) {
    if (!forms[tool]) {
      var g = currentGroup();
      forms[tool] = {
        vans: g.vans.slice(),
        objective: defaultObjective(g.vans),
        errors: [], perLevel: 3, topic: D.TOPICS[0], sentences: 3, studentId: ''
      };
    }
    return forms[tool];
  }

  function defaultObjective(vans) {
    var labels = vans.map(D.unitLabel).join(', ');
    return 'Đọc đúng, viết đúng các tiếng có ' + labels + '; nhận ra chúng trong tiếng, từ và câu.';
  }

  // ---------- Biểu mẫu ----------
  // Chọn nhóm trước, rồi chọn âm, vần trong nhóm đó (gọn hơn một dãy dài các nút).
  function vanChips(f) {
    var g = D.groupOfVan(f.vans[0]) || currentGroup();
    return '<div class="field"><label for="f-group">Nhóm</label>' + ui.groupSelect('f-group', 'group', g.id) + '</div>' +
      '<fieldset class="field"><legend>Âm, vần trọng tâm</legend><div class="chip-check">' +
      g.vans.map(function (v) {
        var id = 'v-' + v;
        return '<input type="checkbox" id="' + id + '" name="vans" value="' + ui.esc(v) + '"' + (f.vans.indexOf(v) !== -1 ? ' checked' : '') + '><label for="' + id + '" class="reading">' + ui.esc(v) + '</label>';
      }).join('') + '</div>' +
      (g.id > S.state.classInfo.progress ? '<p class="hint">Nhóm này lớp chưa học: bộ kiểm tra sẽ đánh dấu tiếng của nhóm là ngoài kho.</p>' : '') + '</fieldset>';
  }
  function errorChips(f, list, legend) {
    return '<fieldset class="field"><legend>' + legend + ' <span class="optional">(không bắt buộc)</span></legend><div class="chip-check">' +
      list.map(function (e) {
        var id = 'e-' + e.id;
        return '<input type="checkbox" id="' + id + '" name="errors" value="' + ui.esc(e.label) + '"' + (f.errors.indexOf(e.label) !== -1 ? ' checked' : '') + '><label for="' + id + '">' + ui.esc(e.label) + '</label>';
      }).join('') + '</div></fieldset>';
  }

  function formHTML(t) {
    var f = formState(t.tool);
    var body = '';
    if (t.tool === 'exercises') {
      body = vanChips(f) +
        '<div class="field"><label for="f-obj">Yêu cầu cần đạt của bài</label><textarea id="f-obj" name="objective" rows="3">' + ui.esc(f.objective) + '</textarea></div>' +
        errorChips(f, D.READ_ERRORS, 'Lỗi cần luyện') +
        '<fieldset class="field"><legend>Số nhiệm vụ mỗi mức</legend>' + ui.segmented('perLevel', [{ id: '2', label: '2' }, { id: '3', label: '3' }, { id: '4', label: '4' }], String(f.perLevel), 'Số nhiệm vụ mỗi mức') + '</fieldset>';
    } else if (t.tool === 'story') {
      body = vanChips(f) +
        '<div class="field"><label for="f-topic">Chủ đề</label><select id="f-topic" name="topic">' + D.TOPICS.map(function (x) { return '<option' + (x === f.topic ? ' selected' : '') + '>' + ui.esc(x) + '</option>'; }).join('') + '</select></div>' +
        '<fieldset class="field"><legend>Số câu</legend>' + ui.segmented('sentences', [{ id: '3', label: '3 câu' }, { id: '4', label: '4 câu' }], String(f.sentences), 'Số câu') + '</fieldset>';
    } else if (t.tool === 'parent') {
      body = '<div class="field"><label for="f-stu">Học sinh</label><select id="f-stu" name="studentId">' + ui.studentOptions(f.studentId, 'Chọn để điền sẵn vần và lỗi') + '</select>' +
        '<p class="hint">Mã học sinh không được gửi cho AI, chỉ gửi vần và loại lỗi.</p></div>' +
        vanChips(f) + errorChips(f, D.READ_ERRORS, 'Lỗi con hay gặp');
    } else {
      body = vanChips(f) + errorChips(f, D.WRITE_CRITERIA.map(function (c) { return { id: c.id, label: c.label + ' chưa đúng' }; }), 'Lỗi viết cần luyện');
    }
    var ready = VV.ai.isReady();
    var isBusy = busy && busy.tool === t.tool;
    return '<form class="panel assist-form" data-form="assist" novalidate>' + body +
      '<div class="btn-col">' +
      '<button type="submit" class="btn btn-primary" name="mode" value="ai"' + (ready && !isBusy ? '' : ' disabled') + '>' + ui.icon('pen') + 'Soạn bản nháp bằng AI</button>' +
      '<button type="button" class="btn" data-act="template"' + (isBusy ? ' disabled' : '') + '>Soạn từ mẫu có sẵn</button>' +
      (ready ? '' : '<p class="hint">Chưa kết nối AI. <a href="#/cai-dat/ai">Nhập API key</a>, hoặc dùng mẫu có sẵn (chạy được khi không có mạng).</p>') +
      '</div></form>';
  }

  // ---------- Kiểm tra kho tiếng ----------
  function childTexts(tool, data) {
    if (tool === 'exercises') {
      var out = [];
      data.tasks.forEach(function (t) {
        if (CHILD_READS_QUESTION.indexOf(t.type) !== -1) out.push(t.question);
        t.options.forEach(function (o) { out.push(o); });
      });
      return out;
    }
    if (tool === 'story') return [data.story];
    if (tool === 'parent') return data.readWords.concat(data.writeWords);
    return data.words;
  }
  function outsideWords(tool, data) {
    var all = [];
    childTexts(tool, data).forEach(function (t) {
      // Bỏ các nhãn như "dấu huyền", "(không có âm đầu)" khỏi câu ghép tiếng.
      var clean = String(t || '').replace(/\(.*?\)/g, ' ').replace(/dấu (huyền|sắc|hỏi|ngã|nặng)|thanh ngang/gi, ' ').replace(/___/g, ' ');
      if (/\+/.test(clean)) clean = clean.split('+').filter(function (p) { return V.parse(p.trim()) || /\s/.test(p.trim()); }).join(' ');
      VV.viet.checkText(clean, S.kho()).outside.forEach(function (w) { if (all.indexOf(w) === -1) all.push(w); });
    });
    return all;
  }
  function khoSummaryHTML(tool, data) {
    var out = outsideWords(tool, data);
    var k = S.state.classInfo;
    if (!out.length) {
      return '<div class="kho-summary is-ok" id="kho-summary">' + ui.icon('check') + '<p>Mọi tiếng cho học sinh đọc đều nằm trong kho tiếng (vần đã học tới nhóm ' + k.progress + (k.extraWords.length ? ' và ' + k.extraWords.length + ' tiếng bổ sung' : '') + '). Giáo viên vẫn cần xem nghĩa, mức độ và đáp án.</p></div>';
    }
    return '<div class="kho-summary is-warn" id="kho-summary">' + ui.icon('alert') + '<div><p>Cần giáo viên xem lại: ' +
      out.map(function (w) { return '“' + ui.esc(w) + '”'; }).join(', ') + ' chưa có trong kho tiếng. Sửa lại, hoặc thêm vào kho nếu học sinh đã được học.</p>' +
      '<div class="btn-row">' + out.slice(0, 6).map(function (w) { return '<button type="button" class="btn btn-sm" data-act="add-kho" data-word="' + ui.esc(w) + '">' + ui.icon('plus') + 'Thêm “' + ui.esc(w) + '” vào kho</button>'; }).join('') + '</div></div></div>';
  }
  function previewHTML(text) {
    var r = ui.khoText(text);
    if (!r.outside.length) return '';
    return '<span class="reading">' + r.html + '</span>';
  }

  // ---------- Bản nháp ----------
  function field(label, path, value, opts) {
    opts = opts || {};
    var id = 'd-' + path.replace(/\./g, '-');
    var input = opts.multiline
      ? '<textarea id="' + id + '" data-path="' + path + '" rows="' + (opts.rows || 3) + '"' + (opts.check ? ' data-check="1"' : '') + '>' + ui.esc(value) + '</textarea>'
      : '<input id="' + id + '" data-path="' + path + '" value="' + ui.esc(value) + '" autocomplete="off"' + (opts.check ? ' data-check="1"' : '') + (opts.cls ? ' class="' + opts.cls + '"' : '') + '>';
    return '<div class="field' + (opts.compact ? ' field-compact' : '') + '"><label for="' + id + '">' + ui.esc(label) + '</label>' + input +
      (opts.check ? '<p class="kho-preview" data-preview="' + path + '">' + previewHTML(value) + '</p>' : '') + '</div>';
  }

  function taskHTML(t, i) {
    var interactive = ['nhan-dien', 'ghep-tieng', 'chon-tu', 'hoan-thanh-cau'].indexOf(t.type) !== -1;
    return '<article class="task-card" data-task="' + i + '">' +
      '<div class="task-head"><div class="field field-compact"><label for="d-tasks-' + i + '-type">Loại</label><select id="d-tasks-' + i + '-type" data-path="tasks.' + i + '.type">' +
      Object.keys(VV.ai.TASK_TYPES).map(function (k) { return '<option value="' + k + '"' + (k === t.type ? ' selected' : '') + '>' + VV.ai.TASK_TYPES[k] + '</option>'; }).join('') + '</select></div>' +
      field('Vần', 'tasks.' + i + '.van', t.van, { compact: true, cls: 'input-short reading' }) +
      '<button type="button" class="btn-icon" data-act="del-task" data-i="' + i + '" aria-label="Xóa nhiệm vụ ' + (i + 1) + '">' + ui.icon('trash') + '</button></div>' +
      field('Lời giao việc', 'tasks.' + i + '.prompt', t.prompt) +
      field(t.type === 'doc' ? 'Chữ cho học sinh đọc' : t.type === 'viet' ? 'Chữ cho học sinh viết' : t.type === 'hoan-thanh-cau' ? 'Câu có chỗ trống ___' : 'Câu hỏi (giáo viên đọc)', 'tasks.' + i + '.question', t.question, { check: CHILD_READS_QUESTION.indexOf(t.type) !== -1, cls: 'reading' }) +
      (interactive
        ? '<fieldset class="field"><legend>Lựa chọn (đánh dấu đáp án đúng)</legend><div class="option-edit">' +
          [0, 1, 2].map(function (k) {
            var val = t.options[k] || '';
            return '<div class="option-row"><input type="radio" name="ans-' + i + '" data-answer="' + i + '" value="' + k + '" aria-label="Đáp án đúng là lựa chọn ' + (k + 1) + '"' + (val && val === t.answer ? ' checked' : '') + '>' +
              '<input data-path="tasks.' + i + '.options.' + k + '" data-check="1" value="' + ui.esc(val) + '" aria-label="Lựa chọn ' + (k + 1) + '" class="reading" autocomplete="off">' +
              '<p class="kho-preview" data-preview="tasks.' + i + '.options.' + k + '">' + previewHTML(val) + '</p></div>';
          }).join('') + '</div></fieldset>'
        : '') +
      field('Ghi chú cho giáo viên', 'tasks.' + i + '.teacherNote', t.teacherNote) +
      '</article>';
  }

  function draftBody(tool, data) {
    if (tool === 'exercises') {
      return D.LEVELS.map(function (lv) {
        var items = [];
        data.tasks.forEach(function (t, i) { if (t.level === lv.id) items.push(taskHTML(t, i)); });
        return '<section class="level-block"><h3 class="level-title"><span class="level-tag level-' + lv.id + '">' + lv.label + '</span><span class="muted">' + ui.esc(lv.hint) + '</span></h3>' +
          (items.join('') || '<p class="muted">Chưa có nhiệm vụ ở mức này.</p>') +
          '<button type="button" class="btn btn-sm btn-ghost" data-act="add-task" data-level="' + lv.id + '">' + ui.icon('plus') + 'Thêm nhiệm vụ</button></section>';
      }).join('');
    }
    if (tool === 'story') {
      return field('Tên truyện', 'title', data.title) +
        field('Nội dung truyện', 'story', data.story, { multiline: true, rows: 4, check: true, cls: 'reading' }) +
        '<div class="story-preview reading" id="story-preview">' + ui.vanText(data.story, forms.story ? forms.story.vans : []) + '</div>' +
        '<h3 class="sub-title">Câu hỏi đọc hiểu</h3>' +
        data.questions.map(function (q, i) {
          return '<div class="qa-row">' + field('Câu hỏi ' + (i + 1), 'questions.' + i + '.q', q.q) + field('Trả lời mẫu', 'questions.' + i + '.a', q.a) + '</div>';
        }).join('');
    }
    if (tool === 'parent') {
      return field('Tên gói', 'title', data.title) +
        field('3 phút đọc: các bước (mỗi dòng một bước)', 'read3', data.read3.join('\n'), { multiline: true, rows: 3 }) +
        field('Tiếng, câu để con đọc (mỗi dòng một mục)', 'readWords', data.readWords.join('\n'), { multiline: true, rows: 4, check: true, cls: 'reading' }) +
        field('2 phút viết', 'write2', data.write2) +
        field('Tiếng để con viết (mỗi dòng một tiếng)', 'writeWords', data.writeWords.join('\n'), { multiline: true, rows: 2, check: true, cls: 'reading' }) +
        field('Lời khuyên cho phụ huynh (mỗi dòng một ý)', 'tips', data.tips.join('\n'), { multiline: true, rows: 3 }) +
        '<div class="field"><label for="d-phone">Tin nhắn gửi phụ huynh</label><textarea id="d-phone" data-path="phone" rows="4">' + ui.esc(data.phone) + '</textarea>' +
        '<p class="hint"><span id="phone-count">' + data.phone.length + '</span> ký tự. Gửi qua Zalo hoặc tin nhắn; bản giấy in kèm có cùng nhiệm vụ.</p>' +
        '<div class="btn-row"><button type="button" class="btn btn-sm" data-act="copy-phone">' + ui.icon('copy') + 'Sao chép tin nhắn</button></div></div>';
    }
    return field('Tên phiếu', 'title', data.title) +
      field('Hướng dẫn cho học sinh (mỗi dòng một ý)', 'guide', data.guide.join('\n'), { multiline: true, rows: 3 }) +
      field('Tiếng hoặc từ để viết (mỗi dòng một mục)', 'words', data.words.join('\n'), { multiline: true, rows: 5, check: true, cls: 'reading' }) +
      field('Lưu ý khi chấm', 'teacherNote', data.teacherNote);
  }

  // Loại nhiệm vụ mà học sinh đọc chính câu hỏi (các loại khác là lời giáo viên đọc).
  var CHILD_READS_QUESTION = ['hoan-thanh-cau', 'doc', 'viet'];
  var LIST_FIELDS = ['read3', 'readWords', 'writeWords', 'tips', 'guide', 'words'];

  function draftHTML(t) {
    var isBusy = busy && busy.tool === t.tool;
    if (isBusy) {
      return '<section class="panel draft is-busy" aria-busy="true"><div class="draft-head"><h2 class="panel-title">Đang soạn bản nháp…</h2>' +
        '<button type="button" class="btn btn-sm" data-act="stop">Dừng</button></div>' +
        '<div class="skeleton"><span></span><span></span><span></span><span></span></div>' +
        '<p class="muted">AI thường mất 10 đến 60 giây. Bản nháp sẽ được kiểm tra theo kho tiếng ngay khi về.</p></section>';
    }
    var d = drafts[t.tool];
    if (!d) {
      return '<section class="panel draft is-empty"><h2 class="panel-title">Bản nháp</h2>' +
        '<p>Chọn vần, ghi yêu cầu cần đạt rồi bấm soạn. Bản nháp hiện ở đây để giáo viên sửa, kiểm tra kho tiếng và duyệt trước khi dùng với học sinh.</p>' +
        '<ol class="flow"><li><b>Giáo viên</b> chọn yêu cầu</li><li><b>AI</b> soạn bản nháp</li><li><b>Kiểm tra</b> kho tiếng, đáp án</li><li><b>Duyệt</b> rồi mới dùng</li></ol></section>';
    }
    var minutes = Math.max(1, Math.round((Date.now() - d.startedAt) / 60000));
    var fresh = d.fresh; d.fresh = false;
    return '<section class="panel draft' + (fresh ? ' is-fresh' : '') + '" aria-label="Bản nháp cần giáo viên duyệt">' +
      '<div class="draft-head"><h2 class="panel-title">' + (d.editingId ? 'Sửa học liệu đã duyệt' : 'Bản nháp cần giáo viên duyệt') + '</h2>' +
      '<span class="source-tag ' + (d.source === 'ai' ? 'is-ai' : '') + '">' + (d.source === 'ai' ? 'Nháp AI' : 'Nháp từ mẫu') + '</span></div>' +
      khoSummaryHTML(t.tool, d.data) +
      '<div class="draft-body">' + draftBody(t.tool, d.data) + '</div>' +
      '<form class="approve" data-form="approve">' +
      '<div class="field field-inline"><label for="ap-min">Thời gian soạn và duyệt</label><input id="ap-min" name="minutes" type="number" inputmode="numeric" min="1" max="240" value="' + minutes + '" class="input-short num"><span>phút</span></div>' +
      '<label class="check"><input type="checkbox" name="ok" required><span>Tôi đã kiểm tra ngữ liệu, mức độ và đáp án.</span></label>' +
      '<div class="btn-row"><button type="button" class="btn btn-ghost" data-act="discard">Bỏ bản nháp</button>' +
      '<button type="submit" class="btn btn-primary">' + (d.editingId ? 'Lưu bản sửa' : 'Duyệt và lưu vào kho học liệu') + '</button></div></form></section>';
  }

  // ---------- Kho học liệu ----------
  function libraryHTML() {
    var lib = S.state.library.slice().sort(function (a, b) { return b.approvedAt - a.approvedAt; });
    if (!lib.length) return ui.emptyState('Kho học liệu còn trống', 'Soạn và duyệt một bản nháp, nội dung đã duyệt sẽ được lưu ở đây để in, giao cho học sinh hoặc dùng trong đánh giá.');
    return '<ul class="lib-list">' + lib.map(function (it) {
      return '<li class="lib-item"><div><p class="lib-title">' + ui.esc(it.title) + '</p>' +
        '<p class="lib-meta"><span class="kind-tag">' + KIND_LABEL[it.kind] + '</span>' +
        '<span>Vần ' + ui.esc((it.vans || []).join(', ')) + '</span><span>Duyệt ' + ui.fmtDate(it.approvedAt) + '</span>' +
        '<span>' + (it.source === 'ai' ? 'AI soạn nháp' : 'Từ mẫu') + '</span><span>' + (it.minutes || 0) + ' phút</span>' +
        (it.source === 'ai' ? '<span>' + (it.edits && it.edits.length ? 'Giáo viên sửa ' + it.edits.length + ' chỗ' : 'Duyệt nguyên bản AI') + '</span>' : '') +
        (it.kind === 'phu-huynh' ? '<span>Đã giao ' + S.state.homework.filter(function (h) { return h.packId === it.id; }).length + ' em</span>' : '') + '</p></div>' +
        '<div class="btn-row"><button type="button" class="btn btn-sm" data-act="lib-view" data-id="' + it.id + '">' + ui.icon('eye') + 'Xem</button>' +
        '<button type="button" class="btn btn-sm" data-act="lib-edit" data-id="' + it.id + '">' + ui.icon('pen') + 'Sửa</button>' +
        (it.kind === 'phu-huynh' ? '<button type="button" class="btn btn-sm" data-act="lib-home" data-id="' + it.id + '">' + ui.icon('home') + 'Giao về nhà</button>' : '') +
        '<button type="button" class="btn btn-sm" data-act="lib-print" data-id="' + it.id + '">' + ui.icon('printer') + 'In</button>' +
        '<button type="button" class="btn-icon" data-act="lib-del" data-id="' + it.id + '" aria-label="Xóa ' + ui.esc(it.title) + '">' + ui.icon('trash') + '</button></div></li>';
    }).join('') + '</ul>';
  }

  function libContentHTML(it) {
    var c = it.content;
    if (it.kind === 'bai-tap') {
      return D.LEVELS.map(function (lv) {
        var ts = c.tasks.filter(function (t) { return t.level === lv.id; });
        if (!ts.length) return '';
        return '<h3 class="sub-title">' + lv.label + '</h3><ol class="print-tasks">' + ts.map(function (t) {
          return '<li><p><b>' + ui.esc(VV.ai.TASK_TYPES[t.type]) + '.</b> ' + ui.esc(t.prompt) + '</p><p class="reading big">' + ui.esc(t.question) + '</p>' +
            (t.options.length ? '<p class="reading print-options">' + t.options.map(function (o) { return '<span>' + ui.esc(o) + '</span>'; }).join('') + '</p>' : '') +
            (t.answer ? '<p class="muted">Đáp án: ' + ui.esc(t.answer) + '</p>' : '') + '</li>';
        }).join('') + '</ol>';
      }).join('');
    }
    if (it.kind === 'truyen') {
      return '<p class="reading story-big">' + ui.vanText(c.story, it.vans || []) + '</p><h3 class="sub-title">Câu hỏi</h3><ol>' +
        c.questions.map(function (q) { return '<li>' + ui.esc(q.q) + ' <span class="muted">(' + ui.esc(q.a) + ')</span></li>'; }).join('') + '</ol>';
    }
    if (it.kind === 'phu-huynh') {
      return '<h3 class="sub-title">3 phút đọc</h3><ol>' + c.read3.map(function (x) { return '<li>' + ui.esc(x) + '</li>'; }).join('') + '</ol>' +
        '<p class="reading big">' + c.readWords.map(ui.esc).join(' &nbsp; ') + '</p>' +
        '<h3 class="sub-title">2 phút viết</h3><p>' + ui.esc(c.write2) + '</p><p class="reading big">' + c.writeWords.map(ui.esc).join(' &nbsp; ') + '</p>' +
        '<h3 class="sub-title">Lời khuyên</h3><ul>' + c.tips.map(function (x) { return '<li>' + ui.esc(x) + '</li>'; }).join('') + '</ul>' +
        '<h3 class="sub-title">Tin nhắn điện thoại</h3><p class="phone-msg">' + ui.esc(c.phone) + '</p>';
    }
    return '<ol>' + c.guide.map(function (x) { return '<li>' + ui.esc(x) + '</li>'; }).join('') + '</ol><p class="reading big">' + c.words.map(ui.esc).join(' &nbsp; ') + '</p><p class="muted">' + ui.esc(c.teacherNote) + '</p>';
  }

  function editLogHTML(it) {
    if (it.source !== 'ai' && !(it.edits && it.edits.length)) return '';
    var edits = it.edits || [];
    var head = '<h3 class="sub-title">Nhật ký chỉnh sửa</h3>' +
      '<p class="muted">' + (it.source === 'ai' ? 'Bản nháp do AI soạn. ' : '') +
      (it.outsideStart != null ? 'Tiếng ngoài kho lúc nhận: <span class="num">' + it.outsideStart + '</span>, lúc duyệt: <span class="num">' + (it.outsideEnd || 0) + '</span>. ' : '') +
      (edits.length ? 'Giáo viên đã sửa <span class="num">' + edits.length + '</span> chỗ.' : 'Giáo viên duyệt nguyên bản, không sửa.') + '</p>';
    if (!edits.length) return head;
    return head + '<div class="table-wrap"><table class="table edit-log"><thead><tr><th scope="col">Mục</th><th scope="col">Bản trước</th><th scope="col">Sau khi sửa</th></tr></thead><tbody>' +
      edits.slice(0, 40).map(function (e) {
        return '<tr><td>' + ui.esc(e.field) + '</td><td class="was">' + ui.esc(e.before) + '</td><td>' + ui.esc(e.after) + '</td></tr>';
      }).join('') + '</tbody></table></div>' + (edits.length > 40 ? '<p class="muted">Và ' + (edits.length - 40) + ' chỗ khác.</p>' : '');
  }

  // ---------- So sánh bản nháp gốc với bản duyệt ----------
  var FIELD_LABEL = {
    type: 'loại', van: 'vần', prompt: 'lời giao việc', question: 'câu hỏi', options: 'lựa chọn', answer: 'đáp án', teacherNote: 'ghi chú',
    title: 'Tên', story: 'Nội dung truyện', read3: '3 phút đọc', readWords: 'Tiếng, câu để đọc', write2: '2 phút viết',
    writeWords: 'Tiếng để viết', tips: 'Lời khuyên', phone: 'Tin nhắn', guide: 'Hướng dẫn', words: 'Tiếng, từ để viết'
  };
  function val(v) { return Array.isArray(v) ? v.join(' | ') : String(v == null ? '' : v); }
  function flatten(tool, data) {
    var out = {};
    if (tool === 'exercises') {
      data.tasks.forEach(function (t, i) {
        var label = 'Nhiệm vụ ' + (i + 1);
        out['t:' + t._id] = { label: label, value: t.question, task: true };
        ['type', 'van', 'prompt', 'question', 'options', 'answer', 'teacherNote'].forEach(function (k) {
          out['t:' + t._id + ':' + k] = { label: label + ', ' + FIELD_LABEL[k], value: k === 'type' ? VV.ai.TASK_TYPES[t.type] : val(t[k]), parent: 't:' + t._id };
        });
      });
    } else if (tool === 'story') {
      out.title = { label: 'Tên truyện', value: data.title };
      out.story = { label: 'Nội dung truyện', value: data.story };
      data.questions.forEach(function (q, i) {
        out['q' + i] = { label: 'Câu hỏi ' + (i + 1), value: q.q };
        out['a' + i] = { label: 'Trả lời mẫu ' + (i + 1), value: q.a };
      });
    } else {
      Object.keys(data).forEach(function (k) { if (k[0] !== '_') out[k] = { label: FIELD_LABEL[k] || k, value: val(data[k]) }; });
    }
    return out;
  }
  function diffDraft(tool, before, after) {
    var a = flatten(tool, before), b = flatten(tool, after), edits = [];
    Object.keys(a).forEach(function (k) {
      if (a[k].parent && !(a[k].parent in b)) return;
      if (!(k in b)) edits.push({ field: a[k].task ? a[k].label + ' (xóa)' : a[k].label, before: a[k].value, after: 'Đã xóa' });
      else if (!a[k].task && a[k].value !== b[k].value) edits.push({ field: b[k].label, before: a[k].value, after: b[k].value });
    });
    Object.keys(b).forEach(function (k) {
      if (b[k].task && !(k in a)) edits.push({ field: b[k].label + ' (thêm)', before: 'Chưa có', after: b[k].value });
    });
    return edits;
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function tagTasks(data) {
    (data.tasks || []).forEach(function (t) { if (!t._id) t._id = S.uid('task'); });
    return data;
  }
  function makeDraft(tool, data, source, params, extra) {
    tagTasks(data);
    return Object.assign({ data: data, source: source, startedAt: Date.now(), params: params, fresh: true,
      original: clone(data), outsideStart: outsideWords(tool, data).length }, extra || {});
  }

  function printLib(it) {
    if (it.kind === 'phieu-viet') {
      ui.printHTML(VV.lessons.writingSheetHTML(it.title, it.content.words, it.content.guide), it.title);
    } else if (it.kind === 'phu-huynh') {
      var c = it.content;
      ui.printHTML('<h1 class="print-title">' + ui.esc(it.title) + '</h1>' +
        '<p class="print-meta">Gửi phụ huynh. Mỗi ngày khoảng 5 phút: 3 phút đọc cùng con, 2 phút con tự viết.</p>' +
        '<h2>3 phút đọc</h2><ol class="print-guide">' + c.read3.map(function (x) { return '<li>' + ui.esc(x) + '</li>'; }).join('') + '</ol>' +
        '<p class="reading print-big">' + c.readWords.map(ui.esc).join(' &nbsp;&nbsp; ') + '</p>' +
        '<h2>2 phút viết</h2><p>' + ui.esc(c.write2) + '</p>' +
        c.writeWords.map(function (w) { return '<div class="oli-line is-model"><span class="reading">' + ui.esc(w) + '</span></div><div class="oli-line"></div>'; }).join('') +
        '<h2>Lời khuyên</h2><ul>' + c.tips.map(function (x) { return '<li>' + ui.esc(x) + '</li>'; }).join('') + '</ul>' +
        '<p class="print-meta">Con đã luyện: ☐ Thứ hai ☐ Thứ ba ☐ Thứ tư ☐ Thứ năm ☐ Thứ sáu. Tiếng con còn đọc sai: ........................</p>', it.title);
    } else {
      ui.printHTML('<h1 class="print-title">' + ui.esc(it.title) + '</h1>' + libContentHTML(it), it.title);
    }
  }

  // ---------- Vẽ màn hình ----------
  function render(root, params) {
    tab = TABS.filter(function (t) { return t.id === params[0]; })[0] || TABS[0];
    var ready = VV.ai.isReady();
    var c = VV.ai.cfg();
    var tabs = '<nav class="tabs" aria-label="Công cụ soạn bài">' + TABS.map(function (t) {
      var count = t.id === 'kho' ? ' <span class="count num">' + S.state.library.length + '</span>' : '';
      return '<a class="tab' + (t === tab ? ' is-active' : '') + '" href="#/tro-ly/' + t.id + '"' + (t === tab ? ' aria-current="page"' : '') + '>' + ui.esc(t.label) + count + '</a>';
    }).join('') + '</nav>';
    var status = ready
      ? '<p class="ai-line">' + ui.icon('check') + 'Đang dùng ' + ui.esc(VV.ai.PROVIDERS[c.provider].label) + ', model <code translate="no">' + ui.esc(c.model) + '</code>. <a href="#/cai-dat/ai">Đổi</a></p>'
      : '<div class="banner banner-ai"><p><b>AI chưa được kết nối.</b> Nhập API key của Claude, OpenAI, Gemini hoặc dịch vụ tương thích để AI soạn bản nháp. Không có key, bạn vẫn soạn được từ mẫu có sẵn.</p><a class="btn btn-sm" href="#/cai-dat/ai">Nhập API key</a></div>';

    var body = tab.id === 'kho'
      ? '<section class="panel">' + libraryHTML() + '</section>'
      : '<div class="assist-grid">' + formHTML(tab) + draftHTML(tab) + '</div>';

    root.innerHTML = '<section class="page"><header class="page-head"><div><h1>Trợ lý soạn bài</h1>' +
      '<p class="lede">AI soạn bản nháp theo kho tiếng của lớp. Giáo viên sửa, kiểm tra đáp án và duyệt; chỉ nội dung đã duyệt mới đến tay học sinh.</p></div></header>' +
      status + tabs + body + '</section>';
  }

  function readForm(form, tool) {
    var f = formState(tool);
    f.vans = Array.prototype.map.call(form.querySelectorAll('input[name="vans"]:checked'), function (i) { return i.value; });
    f.errors = Array.prototype.map.call(form.querySelectorAll('input[name="errors"]:checked'), function (i) { return i.value; });
    if (form.objective) f.objective = form.objective.value.trim();
    var pl = form.querySelector('input[name="perLevel"]:checked'); if (pl) f.perLevel = Number(pl.value);
    var sn = form.querySelector('input[name="sentences"]:checked'); if (sn) f.sentences = Number(sn.value);
    if (form.topic) f.topic = form.topic.value;
    if (form.studentId) f.studentId = form.studentId.value;
    return f;
  }

  function generate(useAI) {
    var form = document.querySelector('form[data-form="assist"]');
    var t = tab;
    var f = readForm(form, t.tool);
    if (!f.vans.length) { ui.toast('Chọn ít nhất một vần trọng tâm.', 'error'); var first = form.querySelector('input[name="vans"]'); if (first) first.focus(); return; }
    var params = { vans: f.vans, objective: f.objective, errors: f.errors, perLevel: f.perLevel, topic: f.topic, sentences: f.sentences };
    var controller = useAI ? new AbortController() : null;
    var startedAt = Date.now();
    if (useAI) { busy = { tool: t.tool, controller: controller }; VV.app.refresh(); }
    VV.ai.draft(t.tool, params, useAI, controller && controller.signal).then(function (res) {
      drafts[t.tool] = makeDraft(t.tool, res.data, res.source, params, { startedAt: startedAt });
      if (t.tool === 'exercises' && !res.data.tasks.length) throw new Error('AI không trả về nhiệm vụ nào. Bấm soạn lại.');
      ui.toast(useAI ? 'AI đã soạn xong bản nháp. Hãy kiểm tra trước khi duyệt.' : 'Đã soạn bản nháp từ mẫu.');
    }).catch(function (err) {
      ui.toast(err.message, 'error');
    }).then(function () {
      busy = null;
      if (VV.app.route === 'tro-ly') VV.app.refresh();
    });
  }

  function setPath(obj, path, value) {
    var parts = path.split('.');
    var o = obj;
    for (var i = 0; i < parts.length - 1; i++) o = o[isNaN(parts[i]) ? parts[i] : Number(parts[i])];
    var last = parts[parts.length - 1];
    o[isNaN(last) ? last : Number(last)] = value;
  }

  var summaryTimer = null;
  function onInput(e) {
    var el = e.target;
    if (el.name === 'objective') { formState(tab.tool).objective = el.value; return; }
    var path = el.getAttribute('data-path');
    if (!path || !drafts[tab.tool]) return;
    var d = drafts[tab.tool].data;
    var val = el.value;
    if (LIST_FIELDS.indexOf(path) !== -1) val = val.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    var m = path.match(/^tasks\.(\d+)\.options\.(\d+)$/);
    if (m) {
      var task = d.tasks[Number(m[1])];
      var old = task.options[Number(m[2])];
      if (old && old === task.answer) task.answer = val;
      while (task.options.length <= Number(m[2])) task.options.push('');
    }
    setPath(d, path, val);
    if (el.hasAttribute('data-check')) {
      var pv = document.querySelector('[data-preview="' + path + '"]');
      if (pv) pv.innerHTML = previewHTML(el.value);
    }
    if (path === 'story') { var sp = document.getElementById('story-preview'); if (sp) sp.innerHTML = ui.vanText(el.value, forms.story ? forms.story.vans : []); }
    if (path === 'phone') { var pc = document.getElementById('phone-count'); if (pc) pc.textContent = el.value.length; }
    clearTimeout(summaryTimer);
    summaryTimer = setTimeout(function () {
      var box = document.getElementById('kho-summary');
      if (box) box.outerHTML = khoSummaryHTML(tab.tool, d);
    }, 250);
  }

  function onChange(e) {
    var el = e.target;
    var assistForm = el.closest('form[data-form="assist"]');
    if (assistForm) readForm(assistForm, tab.tool);
    if (assistForm && el.name === 'group') {
      var fg = formState(tab.tool), grp = D.GROUPS[Number(el.value) - 1];
      fg.vans = grp.vans.slice();
      fg.objective = defaultObjective(fg.vans);
      VV.app.refresh();
      return;
    }
    if (el.hasAttribute('data-answer')) {
      var i = Number(el.getAttribute('data-answer'));
      var t = drafts[tab.tool].data.tasks[i];
      t.answer = t.options[Number(el.value)] || '';
      return;
    }
    if (el.getAttribute('data-path') && /\.type$/.test(el.getAttribute('data-path'))) {
      setPath(drafts[tab.tool].data, el.getAttribute('data-path'), el.value);
      VV.app.refresh();
      return;
    }
    if (el.name === 'studentId' && el.value) {
      var f = formState('parent');
      var sug = S.suggest(el.value);
      var errs = S.errorCounts(el.value);
      f.studentId = el.value;
      f.vans = [sug.van];
      f.errors = D.READ_ERRORS.filter(function (x) { return errs[x.id] > 0; })
        .sort(function (a, b) { return errs[b.id] - errs[a.id]; }).slice(0, 2).map(function (x) { return x.label; });
      VV.app.refresh();
    }
  }

  function approve(form) {
    var d = drafts[tab.tool];
    if (!form.ok.checked) { ui.toast('Đánh dấu ô xác nhận đã kiểm tra trước khi duyệt.', 'error'); form.ok.focus(); return; }
    if (tab.tool === 'exercises') {
      var bad = d.data.tasks.filter(function (t) {
        var interactive = ['nhan-dien', 'ghep-tieng', 'chon-tu', 'hoan-thanh-cau'].indexOf(t.type) !== -1;
        return interactive && (!t.answer || t.options.filter(Boolean).indexOf(t.answer) === -1);
      });
      if (bad.length) { ui.toast(bad.length + ' nhiệm vụ chọn đáp án chưa đánh dấu đáp án đúng.', 'error'); return; }
      d.data.tasks.forEach(function (t) { t.options = t.options.filter(Boolean); });
    }
    var out = outsideWords(tab.tool, d.data);
    var go = out.length
      ? ui.confirmDialog({ title: 'Còn tiếng ngoài kho', body: 'Bản nháp còn ' + out.length + ' tiếng ngoài kho tiếng (' + out.join(', ') + '). Vẫn duyệt và lưu?' }, 'Vẫn duyệt')
      : Promise.resolve(true);
    go.then(function (ok) {
      if (!ok) return;
      var minutes = Math.max(1, Math.min(240, Number(form.minutes.value) || 1));
      var titleMap = {
        exercises: 'Bài tập vần ' + d.params.vans.join(', '),
        story: d.data.title, parent: d.data.title, writing: d.data.title
      };
      var edits = diffDraft(tab.tool, d.original, d.data);
      var now = Date.now();
      S.commit(function (s) {
        var prev = d.editingId ? s.library.filter(function (x) { return x.id === d.editingId; })[0] : null;
        if (prev) {
          prev.title = titleMap[tab.tool];
          prev.vans = d.params.vans;
          prev.content = clone(d.data);
          prev.approvedAt = now;
          prev.minutes = (prev.minutes || 0) + minutes;
          prev.edits = (prev.edits || []).concat(edits);
          prev.outsideEnd = out.length;
        } else {
