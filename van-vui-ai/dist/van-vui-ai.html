          s.library.push({ id: S.uid('lib'), kind: tab.libKind, title: titleMap[tab.tool], vans: d.params.vans,
            createdAt: d.startedAt, approvedAt: now, minutes: minutes, source: d.source, content: clone(d.data),
            aiOriginal: d.source === 'ai' ? clone(d.original) : null, edits: edits, outsideStart: d.outsideStart, outsideEnd: out.length });
        }
        s.effort.push({ id: S.uid('e'), date: now, tool: tab.label, minutes: minutes,
          note: (prev ? 'Sửa lại: ' : '') + 'Vần ' + d.params.vans.join(', ') + (d.source === 'ai' ? ' (AI soạn nháp, sửa ' + edits.length + ' chỗ)' : ' (từ mẫu)') });
      });
      delete drafts[tab.tool];
      ui.toast(d.editingId ? 'Đã lưu bản sửa vào kho học liệu.' : 'Đã duyệt và lưu vào kho học liệu.');
      VV.app.refresh();
    });
  }

  // Giao gói "5 phút cùng con" về nhà cho một số em.
  function homeDialog(packId) {
    var it = S.state.library.filter(function (x) { return x.id === packId; })[0];
    var already = S.state.homework.filter(function (h) { return h.packId === packId; }).map(function (h) { return h.studentId; });
    ui.openDialog('<form><h2 id="dialog-title" class="dialog-title">Giao về nhà: ' + ui.esc(it.title) + '</h2>' +
      '<p class="muted">Đánh dấu sẵn các em có vần cần luyện trùng với gói này. Giáo viên có thể đổi lại.</p>' +
      '<fieldset class="field"><legend>Học sinh</legend><div class="chip-check">' +
      S.state.students.map(function (s) {
        var sug = S.suggest(s.id);
        var pre = already.indexOf(s.id) === -1 && (it.vans || []).indexOf(sug.van) !== -1;
        return '<input type="checkbox" id="hw-' + s.id + '" name="stu" value="' + s.id + '"' + (pre ? ' checked' : '') + (already.indexOf(s.id) !== -1 ? ' disabled' : '') + '>' +
          '<label for="hw-' + s.id + '">' + ui.esc(s.code) + (already.indexOf(s.id) !== -1 ? ' (đã giao)' : '') + '</label>';
      }).join('') + '</div></fieldset>' +
      '<div class="dialog-actions"><button type="button" class="btn" data-global="close-dialog">Hủy</button><button type="submit" class="btn btn-primary">Giao gói</button></div></form>',
      {
        onMount: function (dlg) {
          dlg.querySelector('form').onsubmit = function (e) {
            e.preventDefault();
            var ids = Array.prototype.map.call(e.target.querySelectorAll('input[name="stu"]:checked'), function (i) { return i.value; });
            if (!ids.length) { ui.toast('Chọn ít nhất một học sinh.', 'error'); return; }
            S.commit(function (s) {
              ids.forEach(function (sid) { s.homework.push({ id: S.uid('hw'), packId: packId, studentId: sid, sentAt: Date.now(), status: 'da-giao', support: '', note: '', updatedAt: Date.now() }); });
            });
            ui.closeDialog();
            ui.toast('Đã giao gói cho ' + ids.length + ' em. Ghi nhận kết quả ở Đánh giá, mục Luyện ở nhà.');
            VV.app.refresh();
          };
        }
      });
  }

  // Mở công cụ soạn với các ô đã điền sẵn (gọi từ bản đồ âm vần, bài viết…).
  function prefill(tool, p) {
    var f = formState(tool);
    if (p.vans && p.vans.length) f.vans = p.vans.slice();
    if (p.errors) f.errors = p.errors.slice();
    if (p.studentId != null) f.studentId = p.studentId;
    if (p.objective) f.objective = p.objective;
    var t = TABS.filter(function (x) { return x.tool === tool; })[0];
    VV.app.go('tro-ly/' + t.id);
  }

  VV.assistant = { isDirty: function () { return Object.keys(drafts).length > 0 || !!busy; }, prefill: prefill, editLogHTML: editLogHTML };

  VV.views['tro-ly'] = {
    render: render,
    act: {
      template: function () { generate(false); },
      stop: function () { if (busy && busy.controller) busy.controller.abort(); },
      discard: function () {
        ui.confirmDialog({ title: 'Bỏ bản nháp?', body: 'Nội dung chưa duyệt sẽ mất.' }, 'Bỏ bản nháp', true).then(function (ok) {
          if (ok) { delete drafts[tab.tool]; VV.app.refresh(); }
        });
      },
      'add-kho': function (el) {
        var w = el.getAttribute('data-word');
        S.commit(function (s) { if (s.classInfo.extraWords.indexOf(w) === -1) s.classInfo.extraWords.push(w); });
        ui.toast('Đã thêm “' + w + '” vào kho tiếng của lớp.');
        VV.app.refresh();
      },
      'del-task': function (el) {
        drafts[tab.tool].data.tasks.splice(Number(el.getAttribute('data-i')), 1);
        VV.app.refresh();
      },
      'add-task': function (el) {
        var lv = el.getAttribute('data-level');
        drafts[tab.tool].data.tasks.push({ _id: S.uid('task'), level: lv, type: 'doc', van: (forms.exercises && forms.exercises.vans[0]) || '', prompt: 'Đọc to cho cô nghe.', question: '', options: [], answer: '', teacherNote: '' });
        VV.app.refresh();
      },
      'copy-phone': function () { ui.copyText(drafts.parent.data.phone); },
      'lib-view': function (el) {
        var it = S.state.library.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
        ui.openDialog('<h2 id="dialog-title" class="dialog-title">' + ui.esc(it.title) + '</h2><div class="lib-content">' + libContentHTML(it) + editLogHTML(it) + '</div>' +
          '<div class="dialog-actions"><button type="button" class="btn" data-global="close-dialog">Đóng</button></div>', { wide: true });
      },
      'lib-edit': function (el) {
        var it = S.state.library.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
        var t = TABS.filter(function (x) { return x.libKind === it.kind; })[0];
        if (drafts[t.tool]) { ui.toast('Đang có bản nháp chưa duyệt ở mục ' + t.label + '. Duyệt hoặc bỏ bản nháp đó trước.', 'error'); return; }
        var data = tagTasks(clone(it.content));
        drafts[t.tool] = makeDraft(t.tool, data, it.source, { vans: (it.vans || []).slice() }, { editingId: it.id });
        formState(t.tool).vans = (it.vans || []).slice();
        VV.app.go('tro-ly/' + t.id);
      },
      'lib-home': function (el) { homeDialog(el.getAttribute('data-id')); },
      'lib-print': function (el) {
        printLib(S.state.library.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]);
      },
      'lib-del': function (el) {
        var id = el.getAttribute('data-id');
        ui.confirmDialog({ title: 'Xóa khỏi kho học liệu?', body: 'Nội dung này sẽ không còn dùng được trong Góc luyện tập và đánh giá.' }, 'Xóa', true).then(function (ok) {
          if (!ok) return;
          S.commit(function (s) { s.library = s.library.filter(function (x) { return x.id !== id; }); });
          VV.app.refresh();
        });
      }
    },
    oninput: onInput,
    onchange: onChange,
    onsubmit: function (e) {
      e.preventDefault();
      var form = e.target;
      if (form.getAttribute('data-form') === 'assist') generate(true);
      if (form.getAttribute('data-form') === 'approve') approve(form);
    }
  };
})(window.VV = window.VV || {});

</script>
<script>
/* js/view-assess.js */
/* Công cụ đánh giá: phiếu đọc nhanh, bài đo A/B, chấm viết, đọc hiểu, nhật ký lỗi. */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store, V = VV.viet;

  var TABS = [
    { id: 'phieu', label: 'Phiếu đọc nhanh' },
    { id: 'ab', label: 'Bài đo đọc A/B' },
    { id: 'viet', label: 'Chấm bài viết' },
    { id: 'doc-hieu', label: 'Đọc hiểu' },
    { id: 'nha', label: 'Luyện ở nhà' },
    { id: 'nhat-ky', label: 'Nhật ký lỗi' }
  ];
  var tab = TABS[0];

  var phieu = { setup: { studentId: '', phase: 'thuong-xuyen', vans: null, per: 6 }, sess: null };
  var ab = { studentId: '', phase: 'dau-vao', form: 'A', scope: null, items: null };
  var viet = { studentId: '', phase: 'thuong-xuyen', words: null, scores: {}, independence: 'nhin-mau', note: '', photo: '' };
  var dh = { studentId: '', phase: 'thuong-xuyen', source: '', answers: {}, support: 'tu-doc' };
  var log = { studentId: '', skill: '', phase: '', onlyErrors: true };

  function firstStudent() { return (S.state.students[0] || {}).id || ''; }
  function studentField(id, value, label) {
    return '<div class="field"><label for="' + id + '">' + (label || 'Học sinh') + '</label><select id="' + id + '" name="studentId" required>' + ui.studentOptions(value) + '</select></div>';
  }
  function phaseField(name, value) {
    return '<fieldset class="field"><legend>Thời điểm</legend>' + ui.segmented(name, D.PHASES, value, 'Thời điểm') + '</fieldset>';
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---------- Phiếu đọc nhanh ----------
  function phieuSetupHTML() {
    var st = phieu.setup;
    if (!st.studentId) st.studentId = firstStudent();
    if (!st.group || !D.GROUPS[st.group - 1]) st.group = S.state.classInfo.progress;
    var g = D.GROUPS[st.group - 1];
    if (!st.vans || !st.vans.some(function (v) { return g.vans.indexOf(v) !== -1; })) st.vans = g.vans.slice();
    return '<form class="panel" data-form="phieu-setup">' +
      '<p class="muted">Giáo viên nghe học sinh đọc từng tiếng và ghi kết quả. Mỗi âm, vần 3 hoặc 6 tiếng. Kết quả cập nhật bản đồ âm vần ngay.</p>' +
      '<div class="form-grid">' + studentField('ph-stu', st.studentId) + phaseField('ph-phase', st.phase) +
      '<div class="field"><label for="ph-group">Nhóm</label>' + ui.groupSelect('ph-group', 'group', st.group) + '</div></div>' +
      '<fieldset class="field"><legend>Âm, vần cần đo</legend><div class="chip-check">' +
      g.vans.map(function (v) {
        return '<input type="checkbox" id="ph-v-' + v + '" name="vans" value="' + ui.esc(v) + '"' + (st.vans.indexOf(v) !== -1 ? ' checked' : '') + '><label for="ph-v-' + v + '" class="reading">' + ui.esc(v) + '</label>';
      }).join('') + '</div></fieldset>' +
      '<fieldset class="field"><legend>Số tiếng mỗi âm, vần</legend>' + ui.segmented('ph-per', [{ id: '3', label: '3 tiếng' }, { id: '6', label: '6 tiếng' }], String(st.per), 'Số tiếng mỗi âm, vần') + '</fieldset>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Bắt đầu ghi phiếu</button></div></form>';
  }

  function phieuSessionHTML() {
    var s = phieu.sess;
    var it = s.items[s.idx];
    var done = s.items.filter(function (x) { return x.result !== null; }).length;
    return '<div class="assess-session">' +
      '<section class="show-card oli-paper" id="show-card" aria-label="Màn hình cho học sinh đọc">' +
      '<p class="show-meta">Tiếng ' + (s.idx + 1) + ' trên ' + s.items.length + '</p>' +
      '<p class="show-word reading" aria-live="polite">' + ui.esc(it.tieng) + '</p>' +
      '<div class="show-nav"><button type="button" class="btn btn-ghost" data-act="ph-prev"' + (s.idx === 0 ? ' disabled' : '') + '>' + ui.icon('arrowLeft') + 'Trước</button>' +
      '<button type="button" class="btn btn-ghost" data-act="ph-full">' + ui.icon('expand') + 'Toàn màn hình</button>' +
      '<button type="button" class="btn btn-ghost" data-act="ph-next"' + (s.idx === s.items.length - 1 ? ' disabled' : '') + '>Sau' + ui.icon('arrowRight') + '</button></div></section>' +
      '<section class="panel mark-panel" aria-label="Phần giáo viên ghi">' +
      '<h2 class="panel-title">' + ui.esc(S.studentLabel(s.studentId)) + ' đọc tiếng <span class="reading">' + ui.vanWord(it.tieng, it.van) + '</span></h2>' +
      '<div class="mark-buttons"><button type="button" class="btn btn-lg mark-ok' + (it.result === true ? ' is-on' : '') + '" data-act="ph-mark" data-ok="1" aria-pressed="' + (it.result === true) + '">Đúng <kbd>D</kbd></button>' +
      '<button type="button" class="btn btn-lg mark-miss' + (it.result === false ? ' is-on' : '') + '" data-act="ph-mark" data-ok="0" aria-pressed="' + (it.result === false) + '">Chưa đúng <kbd>S</kbd></button></div>' +
      (it.result === false
        ? '<fieldset class="field"><legend>Loại lỗi <span class="optional">(phím 1 đến 5)</span></legend><div class="chip-check">' +
          D.READ_ERRORS.map(function (e, i) {
            return '<input type="radio" id="ph-err-' + e.id + '" name="ph-err" value="' + e.id + '"' + (it.error === e.id ? ' checked' : '') + '><label for="ph-err-' + e.id + '"><kbd>' + (i + 1) + '</kbd>' + ui.esc(e.label) + '</label>';
          }).join('') + '</div></fieldset>'
        : '') +
      '<fieldset class="field"><legend>Mức hỗ trợ</legend>' + ui.segmented('ph-support', [{ id: 'tu-doc', label: 'Tự đọc' }, { id: 'co-ho-tro', label: 'Có hỗ trợ' }], it.support, 'Mức hỗ trợ') + '</fieldset>' +
      '<ol class="mark-list" aria-label="Danh sách tiếng">' + s.items.map(function (x, i) {
        var cls = x.result === true ? 'is-ok' : x.result === false ? 'is-miss' : '';
        return '<li><button type="button" class="mark-item ' + cls + (i === s.idx ? ' is-current' : '') + '" data-act="ph-go" data-i="' + i + '" aria-label="' + ui.esc(x.tieng) + (x.result === true ? ', đúng' : x.result === false ? ', chưa đúng' : ', chưa chấm') + '"' + (i === s.idx ? ' aria-current="true"' : '') + '><span class="reading">' + ui.esc(x.tieng) + '</span></button></li>';
      }).join('') + '</ol>' +
      '<p class="muted">Phím tắt: D là đúng, S là chưa đúng, mũi tên trái phải để chuyển tiếng.</p>' +
      '<div class="btn-row"><button type="button" class="btn btn-ghost" data-act="ph-cancel">Hủy phiếu</button>' +
      '<button type="button" class="btn btn-primary" data-act="ph-save">Lưu phiếu (' + done + '/' + s.items.length + ' đã chấm)</button></div>' +
      '</section></div>';
  }

  function phieuStart(form) {
    var st = phieu.setup;
    st.studentId = form.studentId.value;
    st.phase = form.querySelector('input[name="ph-phase"]:checked').value;
    st.vans = Array.prototype.map.call(form.querySelectorAll('input[name="vans"]:checked'), function (i) { return i.value; });
    st.per = Number(form.querySelector('input[name="ph-per"]:checked').value);
    if (!st.studentId) { ui.toast('Chọn học sinh.', 'error'); return; }
    if (!st.vans.length) { ui.toast('Chọn ít nhất một âm hoặc vần.', 'error'); return; }
    var items = [];
    st.vans.forEach(function (v) {
      var g = D.groupOfVan(v);
      shuffle(g.words[v]).slice(0, st.per).forEach(function (w) { items.push({ tieng: w, van: v, result: null, error: null, support: 'tu-doc' }); });
    });
    phieu.sess = { studentId: st.studentId, phase: st.phase, items: shuffle(items), idx: 0, startedAt: Date.now() };
    VV.app.refresh();
  }

  function phieuMark(ok) {
    var s = phieu.sess;
    var it = s.items[s.idx];
    it.result = ok;
    if (ok) { it.error = null; if (s.idx < s.items.length - 1) s.idx++; }
    VV.app.refresh();
  }

  function phieuSave() {
    var s = phieu.sess;
    var marked = s.items.filter(function (x) { return x.result !== null; });
    if (!marked.length) { ui.toast('Chưa chấm tiếng nào.', 'error'); return; }
    var minutes = Math.max(1, Math.round((Date.now() - s.startedAt) / 60000));
    S.commit(function (st) {
      var now = Date.now();
      marked.forEach(function (x) {
        st.records.push({ id: S.uid('r'), studentId: s.studentId, date: now, phase: s.phase, skill: 'doc', source: 'phieu',
          van: x.van, tieng: x.tieng, correct: x.result, error: x.result ? null : x.error, support: x.support });
      });
      st.effort.push({ id: S.uid('e'), date: now, tool: 'Phiếu đọc nhanh', minutes: minutes, note: S.studentLabel(s.studentId) + ', ' + marked.length + ' tiếng' });
    });
    var ok = marked.filter(function (x) { return x.result; }).length;
    ui.toast('Đã lưu phiếu của ' + S.studentLabel(s.studentId) + ': ' + ok + '/' + marked.length + ' tiếng đúng.');
    phieu.sess = null;
    VV.app.refresh();
  }

  // ---------- Bài đo A/B ----------
  function abHTML() {
    if (!ab.studentId) ab.studentId = firstStudent();
    if (!ab.scope) ab.scope = S.state.classInfo.progress;
    if (!ab.items) ab.items = S.abForm(ab.form, ab.scope).map(function (it) { return { tieng: it.tieng, van: it.van, result: null, error: '' }; });
    var score = ab.items.filter(function (x) { return x.result === true; }).length;
    var marked = ab.items.filter(function (x) { return x.result !== null; }).length;
    var tests = S.state.tests.slice().sort(function (a, b) { return b.date - a.date; });
    return '<form class="panel" data-form="ab">' +
      '<p class="muted">Hai dạng A và B tương đương: cùng các âm, vần, khác tiếng. Đã sang giai đoạn vần thì chỉ đo vần. Dùng A cho đầu vào, B cho đầu ra để so sánh tiến bộ mà học sinh không học thuộc bài.</p>' +
      '<div class="form-grid">' + studentField('ab-stu', ab.studentId) +
      '<fieldset class="field"><legend>Thời điểm</legend>' + ui.segmented('ab-phase', [{ id: 'dau-vao', label: 'Đầu vào' }, { id: 'dau-ra', label: 'Đầu ra' }], ab.phase, 'Thời điểm') + '</fieldset>' +
      '<fieldset class="field"><legend>Dạng bài</legend>' + ui.segmented('ab-form', [{ id: 'A', label: 'Dạng A' }, { id: 'B', label: 'Dạng B' }], ab.form, 'Dạng bài') + '</fieldset>' +
      '<div class="field"><label for="ab-scope">Đo các âm, vần đã học tới</label>' + ui.groupSelect('ab-scope', 'scope', ab.scope) + '</div></div>' +
      '<div class="ab-grid">' + ab.items.map(function (x, i) {
        return '<div class="ab-cell' + (x.result === true ? ' is-ok' : x.result === false ? ' is-miss' : '') + '">' +
          '<span class="ab-num num">' + (i + 1) + '</span><span class="ab-word reading">' + ui.esc(x.tieng) + '</span>' +
          '<span class="ab-actions"><button type="button" class="btn-icon btn-ok" data-act="ab-mark" data-i="' + i + '" data-ok="1" aria-label="' + ui.esc(x.tieng) + ' đúng" aria-pressed="' + (x.result === true) + '">' + ui.icon('check') + '</button>' +
          '<button type="button" class="btn-icon btn-miss" data-act="ab-mark" data-i="' + i + '" data-ok="0" aria-label="' + ui.esc(x.tieng) + ' chưa đúng" aria-pressed="' + (x.result === false) + '">' + ui.icon('x') + '</button></span>' +
          (x.result === false ? '<select class="ab-err" data-ab-err="' + i + '" aria-label="Loại lỗi của ' + ui.esc(x.tieng) + '"><option value="">Loại lỗi</option>' +
            D.READ_ERRORS.map(function (e) { return '<option value="' + e.id + '"' + (x.error === e.id ? ' selected' : '') + '>' + ui.esc(e.label) + '</option>'; }).join('') + '</select>' : '') +
          '</div>';
      }).join('') + '</div>' +
      '<div class="ab-foot"><p class="ab-score"><span class="num">' + score + '/20</span> tiếng đúng, đã chấm ' + marked + '/20</p>' +
      '<div class="btn-row"><button type="button" class="btn" data-act="ab-print">' + ui.icon('printer') + 'In bài đo cho học sinh</button>' +
      '<button type="submit" class="btn btn-primary">Lưu bài đo</button></div></div></form>' +
      '<section class="panel"><h2 class="panel-title">Các bài đo đã lưu</h2>' +
      (tests.length ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Ngày</th><th scope="col">Học sinh</th><th scope="col">Thời điểm</th><th scope="col">Dạng</th><th scope="col" class="num">Kết quả</th><th scope="col"><span class="sr-only">Thao tác</span></th></tr></thead><tbody>' +
        tests.map(function (t) {
          return '<tr><td class="tnum">' + ui.fmtDate(t.date) + '</td><td>' + ui.esc(S.studentLabel(t.studentId)) + '</td><td>' + ui.esc(D.label(D.PHASES, t.phase)) + '</td><td>' + t.form + '</td>' +
            '<td class="num">' + t.score + '/' + t.total + '</td><td><button type="button" class="btn-icon" data-act="ab-del" data-id="' + t.id + '" aria-label="Xóa bài đo ngày ' + ui.fmtDate(t.date) + ' của ' + ui.esc(S.studentLabel(t.studentId)) + '">' + ui.icon('trash') + '</button></td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="muted">Chưa có bài đo nào.</p>') +
      '</section>';
  }

  // ---------- Chấm bài viết ----------
  function vietHTML() {
    if (!viet.studentId) viet.studentId = firstStudent();
    if (!viet.words) { var g = D.GROUPS[S.state.classInfo.progress - 1]; viet.words = g.vans.slice(0, 2).map(function (v) { return g.words[v][0]; }).concat(g.phrases.slice(0, 3)); }
    var levels = [{ id: '0', label: 'Chưa đạt' }, { id: '1', label: 'Gần đạt' }, { id: '2', label: 'Đạt' }];
    var rows = viet.words.map(function (w, i) {
      return '<tr><th scope="row"><input class="reading input-word" data-word="' + i + '" value="' + ui.esc(w) + '" aria-label="Chữ thứ ' + (i + 1) + '"></th>' +
        D.WRITE_CRITERIA.map(function (c) {
          var key = i + '-' + c.id;
          var val = viet.scores[key] != null ? String(viet.scores[key]) : '';
          return '<td>' + ui.segmented('sc-' + key, levels, val, c.label + ' của chữ ' + (i + 1)) + '</td>';
        }).join('') + '</tr>';
    }).join('');
    return '<form class="panel" data-form="viet">' +
      '<p class="muted">Chấm theo tiêu chí thống nhất trên bài viết trong vở. Ảnh chỉ cho thấy kết quả cuối; thứ tự nét và cách cầm bút cần quan sát khi em viết.</p>' +
      '<div class="form-grid">' + studentField('vt-stu', viet.studentId) + phaseField('vt-phase', viet.phase) + '</div>' +
      '<div class="table-wrap"><table class="table score-table"><thead><tr><th scope="col">Chữ</th>' +
      D.WRITE_CRITERIA.map(function (c) { return '<th scope="col">' + ui.esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<fieldset class="field"><legend>Mức độc lập khi viết</legend>' + ui.segmented('vt-ind', D.INDEPENDENCE, viet.independence, 'Mức độc lập') + '</fieldset>' +
      '<div class="form-grid"><div class="field"><label for="vt-note">Nhận xét <span class="optional">(không bắt buộc)</span></label><textarea id="vt-note" name="note" rows="2">' + ui.esc(viet.note) + '</textarea></div>' +
      '<div class="field"><label for="vt-photo">Ảnh bài viết <span class="optional">(không bắt buộc)</span></label><input id="vt-photo" type="file" accept="image/*" capture="environment" name="photo">' +
      (viet.photo ? '<img class="photo-thumb" src="' + viet.photo + '" width="' + (viet.photoW || 900) + '" height="' + (viet.photoH || 675) + '" alt="Ảnh bài viết vừa chọn">' : '') +
      '<p class="hint">Ảnh được thu nhỏ và chỉ lưu trên máy này.</p></div></div>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu bài viết</button></div></form>' +
      writingHistoryHTML(viet.studentId);
  }

  function writingHistoryHTML(sid) {
    var list = S.state.writing.filter(function (w) { return w.studentId === sid; }).sort(function (a, b) { return a.date - b.date; });
    if (!list.length) return '';
    var first = list[0], last = list[list.length - 1];
    function card(w, title) {
      var sc = S.writingScore(w);
      return '<article class="write-card"><h3 class="sub-title">' + title + ' (' + ui.fmtDate(w.date) + ')</h3>' +
        (w.photo ? '<img class="photo" src="' + w.photo + '" width="' + (w.photoW || 900) + '" height="' + (w.photoH || 675) + '" loading="lazy" alt="Bài viết của ' + ui.esc(S.studentLabel(sid)) + ' ngày ' + ui.fmtDate(w.date) + '">' : '<p class="photo-none">Không có ảnh</p>') +
        '<p class="write-total"><span class="num">' + sc.got + '/' + sc.max + '</span> điểm tiêu chí, ' + ui.esc(D.label(D.INDEPENDENCE, w.independence).toLowerCase()) + '</p>' +
        '<ul class="crit-bars">' + D.WRITE_CRITERIA.map(function (c) {
          var got = 0; w.items.forEach(function (it) { got += (it.scores && it.scores[c.id]) || 0; });
          var max = w.items.length * 2;
          return '<li><span>' + ui.esc(c.label) + '</span><span class="bar"><span style="width:' + Math.round(got / max * 100) + '%"></span></span><span class="num">' + got + '/' + max + '</span></li>';
        }).join('') + '</ul>' + (w.note ? '<p class="muted">' + ui.esc(w.note) + '</p>' : '') + '</article>';
    }
    // Gợi ý luyện tiếp theo tiêu chí còn yếu nhất ở bài mới nhất.
    var weakest = null, low = Infinity;
    D.WRITE_CRITERIA.forEach(function (c) {
      var got = 0; last.items.forEach(function (it) { got += (it.scores && it.scores[c.id]) || 0; });
      var r = got / (last.items.length * 2);
      if (r < low) { low = r; weakest = c; }
    });
    var tip = weakest && low < 0.75
      ? '<div class="write-tip"><p>Bài mới nhất còn yếu nhất ở <b>' + ui.esc(weakest.label.toLowerCase()) + '</b> (' + ui.pct(low) + ' điểm tiêu chí). Gợi ý: một phiếu luyện viết tập trung vào tiêu chí này.</p>' +
        '<button type="button" class="btn btn-sm" data-global="compose-writing" data-crit="' + ui.esc(weakest.label) + '">' + ui.icon('pen') + 'Soạn phiếu luyện viết</button></div>'
      : '';
    return '<section class="panel"><h2 class="panel-title">Nét chữ lớn lên: ' + ui.esc(S.studentLabel(sid)) + '</h2>' + tip +
      (list.length > 1 ? '<div class="write-compare">' + card(first, 'Bài đầu') + card(last, 'Bài mới nhất') + '</div>' : card(first, 'Bài đã chấm')) +
      '<p class="muted">' + list.length + ' bài viết đã lưu.</p></section>';
  }

  // ---------- Đọc hiểu ----------
  function textSources() {
    var out = [];
    S.state.library.filter(function (x) { return x.kind === 'truyen'; }).forEach(function (x) {
      out.push({ id: x.id, title: x.title, text: x.content.story, questions: x.content.questions.map(function (q) { return q.q; }) });
    });
    D.GROUPS.slice(0, S.state.classInfo.progress).reverse().forEach(function (g) {
      if (!g.sentences.length) return;
      out.push({ id: 'g' + g.id, title: 'Câu nhóm ' + g.id + ' (' + g.title + ')', text: g.sentences.join(' '),
        questions: ['Câu đầu tiên nói về ai?', 'Em hãy đọc lại câu có tiếng chứa ' + D.unitLabel(g.vans[0]) + '.'] });
    });
    return out;
  }
  function dhHTML() {
    if (!dh.studentId) dh.studentId = firstStudent();
    var src = textSources();
    var cur = src.filter(function (x) { return x.id === dh.source; })[0] || src[0];
    dh.source = cur.id;
    return '<form class="panel" data-form="dh">' +
      '<p class="muted">2 đến 3 câu hỏi với ngữ liệu phù hợp giai đoạn học. Ghi rõ em tự đọc hay được đọc hỗ trợ.</p>' +
      '<div class="form-grid">' + studentField('dh-stu', dh.studentId) + phaseField('dh-phase', dh.phase) +
      '<div class="field"><label for="dh-src">Bài đọc</label><select id="dh-src" name="source">' +
      src.map(function (x) { return '<option value="' + x.id + '"' + (x.id === cur.id ? ' selected' : '') + '>' + ui.esc(x.title) + '</option>'; }).join('') + '</select></div></div>' +
      '<p class="reading story-big oli-paper">' + ui.esc(cur.text) + '</p>' +
      '<ol class="dh-questions">' + cur.questions.slice(0, 3).map(function (q, i) {
        return '<li><p>' + ui.esc(q) + '</p>' + ui.segmented('dh-q' + i, [{ id: '1', label: 'Trả lời đúng' }, { id: '0', label: 'Chưa đúng' }], dh.answers[i] != null ? String(dh.answers[i]) : '', 'Kết quả câu ' + (i + 1)) + '</li>';
      }).join('') + '</ol>' +
      '<fieldset class="field"><legend>Cách đọc</legend>' + ui.segmented('dh-support', [{ id: 'tu-doc', label: 'Em tự đọc' }, { id: 'duoc-doc', label: 'Được đọc hỗ trợ' }], dh.support, 'Cách đọc') + '</fieldset>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu kết quả đọc hiểu</button></div></form>';
  }

  // ---------- Luyện ở nhà (5 phút cùng con) ----------
  function homeHTML() {
    var hw = S.state.homework;
    if (!hw.length) {
      return '<section class="panel">' + ui.emptyState('Chưa giao gói nào về nhà',
        'Soạn gói 5 phút cùng con ở Trợ lý soạn bài, duyệt, rồi bấm Giao về nhà trong Kho học liệu.',
        '<a class="btn btn-primary" href="#/tro-ly/phu-huynh">Soạn gói 5 phút cùng con</a>') + '</section>';
    }
    var packs = [];
    hw.forEach(function (h) { if (packs.indexOf(h.packId) === -1) packs.push(h.packId); });
    var done = hw.filter(function (h) { return h.status === 'da-lam'; }).length;
    var head = '<section class="panel"><p>Đã giao <b class="num">' + hw.length + '</b> lượt, phụ huynh báo đã làm <b class="num">' + done + '</b> lượt (' + ui.pct(done / hw.length) +
      '). Phụ huynh hỗ trợ thực hành; giáo viên kiểm tra lại trên lớp để xác định mức tiến bộ.</p></section>';
    return head + packs.map(function (pid) {
      var pack = S.state.library.filter(function (x) { return x.id === pid; })[0];
      var rows = hw.filter(function (h) { return h.packId === pid; });
      var title = pack ? pack.title : 'Gói đã xóa khỏi kho học liệu';
      return '<section class="panel"><div class="panel-head"><h2 class="panel-title">' + ui.esc(title) + '</h2>' +
        (pack ? '<button type="button" class="btn btn-sm" data-act="hw-print" data-id="' + pid + '">' + ui.icon('printer') + 'In bản giấy</button>' : '') + '</div>' +
        '<div class="table-wrap"><table class="table hw-table"><thead><tr><th scope="col">Học sinh</th><th scope="col">Ngày giao</th><th scope="col">Kết quả</th><th scope="col">Mức trợ giúp</th><th scope="col">Ghi chú</th><th scope="col"><span class="sr-only">Thao tác</span></th></tr></thead><tbody>' +
        rows.map(function (h) {
          return '<tr><th scope="row">' + ui.esc(S.studentLabel(h.studentId)) + '</th><td class="tnum">' + ui.fmtShort(h.sentAt) + '</td>' +
            '<td>' + ui.segmented('hw-st-' + h.id, D.HOME_STATUS, h.status, 'Kết quả của ' + S.studentLabel(h.studentId)) + '</td>' +
            '<td><select data-hw-support="' + h.id + '" aria-label="Mức trợ giúp của ' + ui.esc(S.studentLabel(h.studentId)) + '"' + (h.status === 'da-lam' ? '' : ' disabled') + '><option value="">Chưa ghi</option>' +
            D.HOME_SUPPORT.map(function (o) { return '<option value="' + o.id + '"' + (h.support === o.id ? ' selected' : '') + '>' + o.label + '</option>'; }).join('') + '</select></td>' +
            '<td><input data-hw-note="' + h.id + '" value="' + ui.esc(h.note) + '" placeholder="Tiếng con còn đọc sai…" autocomplete="off" aria-label="Ghi chú cho ' + ui.esc(S.studentLabel(h.studentId)) + '"></td>' +
            '<td><button type="button" class="btn-icon" data-act="hw-del" data-id="' + h.id + '" aria-label="Bỏ giao gói cho ' + ui.esc(S.studentLabel(h.studentId)) + '">' + ui.icon('trash') + '</button></td></tr>';
        }).join('') + '</tbody></table></div></section>';
    }).join('');
  }

  // ---------- Nhật ký lỗi ----------
  function logRows() {
    return S.state.records.filter(function (r) {
      if (log.studentId && r.studentId !== log.studentId) return false;
      if (log.skill && r.skill !== log.skill) return false;
      if (log.phase && r.phase !== log.phase) return false;
      if (log.onlyErrors && r.correct) return false;
      return true;
    }).sort(function (a, b) { return b.date - a.date; });
  }
  function logHTML() {
    var rows = logRows();
    var shown = rows.slice(0, 150);
    return '<section class="panel"><form class="filters" data-form="log">' +
      '<div class="field"><label for="lg-stu">Học sinh</label><select id="lg-stu" name="studentId">' + ui.studentOptions(log.studentId, 'Cả lớp') + '</select></div>' +
      '<div class="field"><label for="lg-skill">Kỹ năng</label><select id="lg-skill" name="skill"><option value="">Tất cả</option><option value="doc"' + (log.skill === 'doc' ? ' selected' : '') + '>Đọc (giáo viên nghe)</option><option value="nhan-dien"' + (log.skill === 'nhan-dien' ? ' selected' : '') + '>Nhận diện (trò chơi)</option></select></div>' +
      '<div class="field"><label for="lg-phase">Thời điểm</label><select id="lg-phase" name="phase"><option value="">Tất cả</option>' + D.PHASES.map(function (p) { return '<option value="' + p.id + '"' + (log.phase === p.id ? ' selected' : '') + '>' + p.label + '</option>'; }).join('') + '</select></div>' +
      '<label class="check"><input type="checkbox" name="onlyErrors"' + (log.onlyErrors ? ' checked' : '') + '><span>Chỉ hiện lỗi</span></label>' +
      '<button type="button" class="btn" data-act="log-csv">' + ui.icon('download') + 'Xuất CSV</button></form>' +
      '<p class="muted">' + rows.length + ' dòng' + (rows.length > shown.length ? ', hiện 150 dòng mới nhất' : '') + '.</p>' +
      (shown.length ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Ngày</th><th scope="col">Học sinh</th><th scope="col">Tiếng</th><th scope="col">Vần</th><th scope="col">Kỹ năng</th><th scope="col">Kết quả</th><th scope="col">Lỗi</th><th scope="col"><span class="sr-only">Thao tác</span></th></tr></thead><tbody>' +
        shown.map(function (r) {
          return '<tr><td class="tnum">' + ui.fmtShort(r.date) + '</td><td>' + ui.esc(S.studentLabel(r.studentId)) + '</td><td class="reading">' + ui.vanWord(r.tieng, r.van) + '</td><td>' + ui.esc(r.van) + '</td>' +
            '<td>' + (r.skill === 'doc' ? 'Đọc' : 'Nhận diện') + '</td><td>' + (r.correct ? '<span class="pill pill-ok">Đúng</span>' : '<span class="pill pill-miss">Chưa đúng</span>') + '</td>' +
            '<td>' + (r.error ? ui.esc(D.label(D.READ_ERRORS, r.error)) : '') + '</td>' +
            '<td><button type="button" class="btn-icon" data-act="log-del" data-id="' + r.id + '" aria-label="Xóa dòng ' + ui.esc(r.tieng) + ' của ' + ui.esc(S.studentLabel(r.studentId)) + '">' + ui.icon('trash') + '</button></td></tr>';
        }).join('') + '</tbody></table></div>' : ui.emptyState('Không có dòng nào', 'Đổi bộ lọc hoặc ghi phiếu đọc nhanh để có dữ liệu.')) +
      '</section>';
  }

  // ---------- Vẽ ----------
  function render(root, params) {
    tab = TABS.filter(function (t) { return t.id === params[0]; })[0] || TABS[0];
    // Liên kết sâu: #/danh-gia/phieu/<mã HS>/<nhóm>/<vần>
    if (tab.id === 'phieu' && params[1] && !phieu.sess) {
      phieu.setup.studentId = params[1];
      if (params[2]) phieu.setup.group = Number(params[2]);
      if (params[3]) phieu.setup.vans = [params[3]];
      history.replaceState(null, '', '#/danh-gia/phieu');
    }
    if (!S.state.students.length) {
      root.innerHTML = '<section class="page"><header class="page-head"><div><h1>Đánh giá</h1></div></header>' +
        ui.emptyState('Lớp chưa có học sinh', 'Thêm mã học sinh trước khi ghi kết quả.', '<a class="btn btn-primary" href="#/cai-dat/lop">Thêm học sinh</a>') + '</section>';
      return;
    }
    var body = tab.id === 'phieu' ? (phieu.sess ? phieuSessionHTML() : phieuSetupHTML())
      : tab.id === 'ab' ? abHTML() : tab.id === 'viet' ? vietHTML() : tab.id === 'doc-hieu' ? dhHTML() : tab.id === 'nha' ? homeHTML() : logHTML();
    root.innerHTML = '<section class="page"><header class="page-head"><div><h1>Đánh giá</h1>' +
      '<p class="lede">Giáo viên nghe, quan sát và ghi kết quả. Hệ thống chưa tự chấm phát âm hay chữ viết.</p></div></header>' +
      '<nav class="tabs" aria-label="Công cụ đánh giá">' + TABS.map(function (t) {
        return '<a class="tab' + (t === tab ? ' is-active' : '') + '" href="#/danh-gia/' + t.id + '"' + (t === tab ? ' aria-current="page"' : '') + '>' + t.label + '</a>';
      }).join('') + '</nav>' + body + '</section>';
  }

  function printAB() {
    ui.printHTML('<h1 class="print-title">Bài đo đọc dạng ' + ab.form + ' (nhóm 1 đến ' + ab.scope + ')</h1>' +
      '<div class="print-ab">' + ab.items.map(function (x) { return '<span class="reading">' + ui.esc(x.tieng) + '</span>'; }).join('') + '</div>', 'Bài đo đọc dạng ' + ab.form);
  }

  VV.assess = { writingHistoryHTML: writingHistoryHTML, isDirty: function () { return !!(phieu.sess && phieu.sess.items.some(function (x) { return x.result !== null; })); } };

  VV.views['danh-gia'] = {
    render: render,
    act: {
      'ph-mark': function (el) { phieuMark(el.getAttribute('data-ok') === '1'); },
      'ph-prev': function () { if (phieu.sess.idx > 0) { phieu.sess.idx--; VV.app.refresh(); } },
      'ph-next': function () { if (phieu.sess.idx < phieu.sess.items.length - 1) { phieu.sess.idx++; VV.app.refresh(); } },
      'ph-go': function (el) { phieu.sess.idx = Number(el.getAttribute('data-i')); VV.app.refresh(); },
      'ph-full': function () {
        var c = document.getElementById('show-card');
        if (c && c.requestFullscreen) c.requestFullscreen().catch(function () { ui.toast('Trình duyệt không cho mở toàn màn hình.', 'error'); });
      },
      'ph-save': phieuSave,
      'ph-cancel': function () {
        ui.confirmDialog({ title: 'Hủy phiếu này?', body: 'Kết quả đã chấm trong phiếu sẽ không được lưu.' }, 'Hủy phiếu', true).then(function (ok) {
          if (ok) { phieu.sess = null; VV.app.refresh(); }
        });
      },
      'ab-mark': function (el) {
        var x = ab.items[Number(el.getAttribute('data-i'))];
        var ok = el.getAttribute('data-ok') === '1';
        x.result = x.result === ok ? null : ok;
        if (x.result !== false) x.error = '';
        VV.app.refresh();
      },
      'ab-print': printAB,
      'ab-del': function (el) {
        var id = el.getAttribute('data-id');
        ui.confirmDialog({ title: 'Xóa bài đo?', body: 'Bài đo và các kết quả đọc đi kèm sẽ bị xóa.' }, 'Xóa', true).then(function (ok) {
          if (!ok) return;
          S.commit(function (s) {
            s.tests = s.tests.filter(function (t) { return t.id !== id; });
            s.records = s.records.filter(function (r) { return r.testId !== id; });
          });
          VV.app.refresh();
        });
      },
      'log-del': function (el) {
        var id = el.getAttribute('data-id');
        ui.confirmDialog({ title: 'Xóa dòng này?', body: 'Kết quả đọc này sẽ bị xóa khỏi hồ sơ và bản đồ âm vần.' }, 'Xóa', true).then(function (ok) {
          if (!ok) return;
          S.commit(function (s) { s.records = s.records.filter(function (r) { return r.id !== id; }); });
          ui.toast('Đã xóa một dòng.');
          VV.app.refresh();
        });
      },
      'hw-del': function (el) {
        var id = el.getAttribute('data-id');
        ui.confirmDialog({ title: 'Bỏ giao gói này?', body: 'Dòng ghi nhận luyện ở nhà của em này sẽ bị xóa.' }, 'Bỏ giao', true).then(function (ok) {
          if (!ok) return;
          S.commit(function (s) { s.homework = s.homework.filter(function (h) { return h.id !== id; }); });
          VV.app.refresh();
        });
      },
      'hw-print': function (el) {
        var btn = document.createElement('button');
        btn.setAttribute('data-id', el.getAttribute('data-id'));
        VV.views['tro-ly'].act['lib-print'](btn);
      },
      'log-csv': function () {
        var rows = [['Ngày', 'Học sinh', 'Tiếng', 'Vần', 'Kỹ năng', 'Thời điểm', 'Kết quả', 'Lỗi', 'Nguồn']];
        logRows().forEach(function (r) {
          rows.push([ui.fmtDate(r.date), S.studentLabel(r.studentId), r.tieng, r.van, r.skill === 'doc' ? 'Đọc' : 'Nhận diện', D.label(D.PHASES, r.phase),
            r.correct ? 'Đúng' : 'Chưa đúng', r.error ? D.label(D.READ_ERRORS, r.error) : '', r.source]);
        });
        ui.download('nhat-ky-loi.csv', ui.csv(rows), 'text/csv;charset=utf-8');
      }
    },
    onchange: function (e) {
      var t = e.target;
      var form = t.closest('form');
      var f = form && form.getAttribute('data-form');
      if (f === 'phieu-setup') {
        if (t.name === 'studentId') phieu.setup.studentId = t.value;
        if (t.name === 'ph-phase') phieu.setup.phase = t.value;
        if (t.name === 'group') { phieu.setup.group = Number(t.value); phieu.setup.vans = null; VV.app.refresh(); }
        return;
      }
      if (t.name === 'ph-err') { phieu.sess.items[phieu.sess.idx].error = t.value; if (phieu.sess.idx < phieu.sess.items.length - 1) { phieu.sess.idx++; } VV.app.refresh(); return; }
      if (t.name === 'ph-support') { phieu.sess.items[phieu.sess.idx].support = t.value; return; }
      if (f === 'ab') {
        if (t.name === 'studentId') ab.studentId = t.value;
        if (t.name === 'ab-phase') { ab.phase = t.value; ab.form = t.value === 'dau-vao' ? 'A' : 'B'; ab.items = null; VV.app.refresh(); }
        if (t.name === 'ab-form') { ab.form = t.value; ab.items = null; VV.app.refresh(); }
        if (t.name === 'scope') { ab.scope = Number(t.value); ab.items = null; VV.app.refresh(); }
        if (t.hasAttribute('data-ab-err')) ab.items[Number(t.getAttribute('data-ab-err'))].error = t.value;
        return;
      }
      if (f === 'viet') {
        if (t.name === 'studentId') { viet.studentId = t.value; VV.app.refresh(); }
        if (t.name === 'vt-phase') viet.phase = t.value;
        if (t.name === 'vt-ind') viet.independence = t.value;
        if (/^sc-/.test(t.name)) viet.scores[t.name.slice(3)] = Number(t.value);
        if (t.name === 'photo' && t.files && t.files[0]) {
          ui.readImage(t.files[0], 900).then(function (img) { viet.photo = img.url; viet.photoW = img.w; viet.photoH = img.h; VV.app.refresh(); }, function (err) { ui.toast(err.message, 'error'); });
        }
        return;
      }
      if (f === 'dh') {
        if (t.name === 'studentId') dh.studentId = t.value;
        if (t.name === 'dh-phase') dh.phase = t.value;
        if (t.name === 'source') { dh.source = t.value; dh.answers = {}; VV.app.refresh(); }
        if (/^dh-q\d$/.test(t.name)) dh.answers[Number(t.name.slice(4))] = Number(t.value);
        if (t.name === 'dh-support') dh.support = t.value;
        return;
      }
      if (/^hw-st-/.test(t.name)) {
        var hid = t.name.slice(6);
        S.commit(function (s) { s.homework.forEach(function (h) { if (h.id === hid) { h.status = t.value; h.updatedAt = Date.now(); if (t.value !== 'da-lam') h.support = ''; } }); });
        VV.app.refresh();
        return;
      }
      if (t.hasAttribute('data-hw-support')) {
        var sid2 = t.getAttribute('data-hw-support');
        S.commit(function (s) { s.homework.forEach(function (h) { if (h.id === sid2) { h.support = t.value; h.updatedAt = Date.now(); } }); });
        return;
      }
      if (t.hasAttribute('data-hw-note')) {
        var nid = t.getAttribute('data-hw-note');
        S.commit(function (s) { s.homework.forEach(function (h) { if (h.id === nid) h.note = t.value.trim(); }); });
        ui.toast('Đã lưu ghi chú.');
        return;
      }
      if (f === 'log') {
        if (t.name === 'studentId') log.studentId = t.value;
        if (t.name === 'skill') log.skill = t.value;
        if (t.name === 'phase') log.phase = t.value;
        if (t.name === 'onlyErrors') log.onlyErrors = t.checked;
        VV.app.refresh();
      }
    },
    oninput: function (e) {
      var t = e.target;
      if (t.hasAttribute('data-word')) viet.words[Number(t.getAttribute('data-word'))] = t.value;
      if (t.name === 'note' && t.closest('form[data-form="viet"]')) viet.note = t.value;
    },
    onsubmit: function (e) {
      e.preventDefault();
      var form = e.target;
      var f = form.getAttribute('data-form');
      if (f === 'phieu-setup') phieuStart(form);
      if (f === 'ab') {
        var marked = ab.items.filter(function (x) { return x.result !== null; });
        if (marked.length < 20) { ui.toast('Còn ' + (20 - marked.length) + ' tiếng chưa chấm.', 'error'); return; }
        var score = marked.filter(function (x) { return x.result; }).length;
        var testId = S.uid('t');
        S.commit(function (s) {
          var now = Date.now();
          s.tests.push({ id: testId, studentId: ab.studentId, date: now, phase: ab.phase, form: ab.form, scope: ab.scope, score: score, total: 20,
            items: ab.items.map(function (x) { return { tieng: x.tieng, van: x.van, correct: x.result, error: x.result ? null : (x.error || null) }; }) });
          ab.items.forEach(function (x) {
            s.records.push({ id: S.uid('r'), studentId: ab.studentId, date: now, phase: ab.phase, skill: 'doc', source: 'bai-do', testId: testId,
              van: x.van, tieng: x.tieng, correct: x.result, error: x.result ? null : (x.error || null), support: 'tu-doc' });
          });
        });
        ui.toast('Đã lưu bài đo dạng ' + ab.form + ' của ' + S.studentLabel(ab.studentId) + ': ' + score + '/20.');
        ab.items = null;
        VV.app.refresh();
      }
      if (f === 'viet') {
        var missing = 0;
        viet.words.forEach(function (w, i) { D.WRITE_CRITERIA.forEach(function (c) { if (viet.scores[i + '-' + c.id] == null) missing++; }); });
        if (missing) { ui.toast('Còn ' + missing + ' ô tiêu chí chưa chấm.', 'error'); return; }
        S.commit(function (s) {
          s.writing.push({ id: S.uid('w'), studentId: viet.studentId, date: Date.now(), phase: viet.phase,
            items: viet.words.map(function (w, i) {
              var sc = {}; D.WRITE_CRITERIA.forEach(function (c) { sc[c.id] = viet.scores[i + '-' + c.id]; });
              return { text: w, scores: sc };
            }), independence: viet.independence, note: viet.note, photo: viet.photo, photoW: viet.photoW, photoH: viet.photoH });
        });
        if (S.saveFailed) ui.toast('Bộ nhớ trình duyệt đã đầy. Xuất bản sao lưu rồi xóa bớt ảnh cũ.', 'error');
        else ui.toast('Đã lưu bài viết của ' + S.studentLabel(viet.studentId) + '.');
        viet.scores = {}; viet.note = ''; viet.photo = ''; viet.photoW = 0; viet.photoH = 0;
        VV.app.refresh();
      }
      if (f === 'dh') {
        var src = textSources().filter(function (x) { return x.id === dh.source; })[0];
        var n = Math.min(3, src.questions.length);
        var ans = Object.keys(dh.answers).length;
        if (ans < n) { ui.toast('Còn ' + (n - ans) + ' câu hỏi chưa ghi kết quả.', 'error'); return; }
        var correct = 0; for (var i = 0; i < n; i++) correct += dh.answers[i] || 0;
        S.commit(function (s) {
          s.comprehension.push({ id: S.uid('c'), studentId: dh.studentId, date: Date.now(), phase: dh.phase, textTitle: src.title, correct: correct, total: n, support: dh.support });
        });
        ui.toast('Đã lưu: ' + correct + '/' + n + ' câu đúng.');
        dh.answers = {};
        VV.app.refresh();
      }
    },
    onkey: function (e) {
      if (tab.id !== 'phieu' || !phieu.sess) return;
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var k = e.key.toLowerCase();
      if (k === 'd' || k === 'đ') { e.preventDefault(); phieuMark(true); }
      else if (k === 's') { e.preventDefault(); phieuMark(false); }
      else if (k === 'arrowleft') { e.preventDefault(); if (phieu.sess.idx > 0) { phieu.sess.idx--; VV.app.refresh(); } }
      else if (k === 'arrowright') { e.preventDefault(); if (phieu.sess.idx < phieu.sess.items.length - 1) { phieu.sess.idx++; VV.app.refresh(); } }
      else if (/^[1-5]$/.test(k) && phieu.sess.items[phieu.sess.idx].result === false) {
        e.preventDefault();
        phieu.sess.items[phieu.sess.idx].error = D.READ_ERRORS[Number(k) - 1].id;
        if (phieu.sess.idx < phieu.sess.items.length - 1) phieu.sess.idx++;
        VV.app.refresh();
      }
    }
  };
})(window.VV = window.VV || {});

</script>
<script>
/* js/view-report.js */
/* Báo cáo tiến bộ: trước và sau, theo học sinh, nhóm vần, loại lỗi, công sức giáo viên. */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store;

  function trend(a, b) {
    if (!a) return { id: 'thieu', label: 'Chưa đo đầu vào' };
    if (!b) return { id: 'cho', label: 'Chưa đo đầu ra' };
    var d = b.score - a.score;
    if (d >= 2) return { id: 'len', label: 'Tiến bộ', delta: d };
    if (d <= -2) return { id: 'xuong', label: 'Giảm', delta: d };
    return { id: 'giu', label: 'Chưa rõ thay đổi', delta: d };
  }
  function trendChip(t) {
    var icon = { len: 'arrowRight', xuong: 'alert', giu: 'refresh', cho: 'clipboard', thieu: 'clipboard' }[t.id];
    return '<span class="trend trend-' + t.id + '">' + ui.icon(icon) + ui.esc(t.label) + '</span>';
  }
  function delta(t) {
    if (t.delta == null) return '–';
    return (t.delta > 0 ? '+' : t.delta < 0 ? '−' : '') + Math.abs(t.delta);
  }

  function studentRows() {
    return S.state.students.map(function (s) {
      var a = S.latestTest(s.id, 'dau-vao');
      var b = S.latestTest(s.id, 'dau-ra');
      var wa = S.latestWriting(s.id, 'dau-vao'), wb = S.latestWriting(s.id, 'dau-ra');
      var sug = S.suggest(s.id);
      var sessions = S.state.practice.filter(function (p) { return p.studentId === s.id; }).length;
      return { s: s, a: a, b: b, t: trend(a, b), wa: wa && S.writingScore(wa), wb: wb && S.writingScore(wb), sug: sug, sessions: sessions };
    });
  }

  function avg(list) { return list.length ? list.reduce(function (x, y) { return x + y; }, 0) / list.length : null; }
  function one(n) { return ui.dec(n); }

  // Biểu đồ cặp cột ngang: đầu vào và đầu ra theo nhóm vần.
  function prePostChart(studentId) {
    var progress = S.state.classInfo.progress;
    // Chỉ vẽ các nhóm đã có số liệu đầu vào hoặc đầu ra.
    var withData = D.GROUPS.slice(0, progress).filter(function (g) { var pp = S.groupPrePost(g.id, studentId); return pp.pre.total || pp.post.total; });
    if (!withData.length) {
      return '<figure class="chart"><figcaption class="chart-head"><span class="chart-title">Tỉ lệ đọc đúng theo nhóm</span></figcaption>' +
        '<p class="muted">Chưa có kết quả ghi thời điểm đầu vào hoặc đầu ra. Dùng phiếu đọc nhanh hoặc bài đo A/B và chọn thời điểm.</p></figure>';
    }
    var rows = withData.map(function (g) {
      var pp = S.groupPrePost(g.id, studentId);
      function bar(cls, r, label) {
        if (!r.total) return '<div class="pp-bar is-none"><span class="pp-val">' + label + ': chưa đo</span></div>';
        var w = Math.max(2, Math.round(r.ratio * 100));
        return '<div class="pp-bar ' + cls + '" tabindex="0" data-tip="' + ui.esc(label + ': ' + r.correct + '/' + r.total + ' tiếng đúng (' + Math.round(r.ratio * 100) + '%)') + '">' +
          '<span class="pp-fill" style="width:' + w + '%"></span><span class="pp-val num">' + Math.round(r.ratio * 100) + '%</span></div>';
      }
      return '<div class="pp-row"><span class="pp-label">Nhóm ' + g.id + ' <span class="reading">' + ui.esc(g.title) + '</span></span>' +
        '<div class="pp-bars">' + bar('is-pre', pp.pre, 'Đầu vào') + bar('is-post', pp.post, 'Đầu ra') + '</div></div>';
    }).join('');
    return '<figure class="chart"><figcaption class="chart-head"><span class="chart-title">Tỉ lệ đọc đúng theo nhóm</span>' +
      '<span class="legend-inline"><span class="key is-pre"></span>Đầu vào<span class="key is-post"></span>Đầu ra</span></figcaption>' +
      '<div class="pp-chart">' + rows + '</div>' +
      '<p class="chart-note">Tính từ phiếu đọc nhanh và bài đo A/B có ghi thời điểm đầu vào hoặc đầu ra. Rê chuột hoặc chạm vào cột để xem số tiếng.</p></figure>';
  }

  function errorChart(studentId) {
    var c = S.errorCounts(studentId);
    var max = Math.max.apply(null, D.READ_ERRORS.map(function (e) { return c[e.id]; }).concat([1]));
    var total = D.READ_ERRORS.reduce(function (s, e) { return s + c[e.id]; }, 0);
    return '<figure class="chart"><figcaption class="chart-head"><span class="chart-title">Loại lỗi đọc đã ghi</span><span class="muted num">' + total + ' lỗi</span></figcaption>' +
      (total ? '<div class="err-chart">' + D.READ_ERRORS.map(function (e) {
        return '<div class="err-row"><span class="err-label">' + ui.esc(e.label) + '</span>' +
          '<span class="err-track" tabindex="0" data-tip="' + ui.esc(e.label + ': ' + c[e.id] + ' lần') + '"><span class="err-fill' + (c[e.id] ? '' : ' is-zero') + '" style="width:' + Math.round(c[e.id] / max * 100) + '%"></span></span>' +
          '<span class="err-val num">' + c[e.id] + '</span></div>';
      }).join('') + '</div>' : '<p class="muted">Chưa ghi lỗi nào.</p>') + '</figure>';
  }

  // Luyện ở nhà: tỷ lệ tham gia và mức cần trợ giúp.
  function homePanel(studentId) {
    var hw = S.state.homework.filter(function (h) { return !studentId || h.studentId === studentId; });
    var body;
    if (!hw.length) {
      body = '<p class="muted">Chưa giao gói 5 phút cùng con nào. <a href="#/tro-ly/phu-huynh">Soạn gói</a></p>';
    } else {
      var done = hw.filter(function (h) { return h.status === 'da-lam'; });
      var notDone = hw.filter(function (h) { return h.status === 'chua-lam'; }).length;
      var waiting = hw.length - done.length - notDone;
      var max = Math.max(1, done.length);
      body = '<p class="home-rate"><span class="num">' + ui.pct(done.length / hw.length) + '</span> lượt đã làm</p>' +
        '<p class="muted">' + done.length + ' đã làm, ' + notDone + ' chưa làm, ' + waiting + ' chưa có phản hồi, trên ' + hw.length + ' lượt giao.</p>' +
        '<h3 class="sub-title">Mức trợ giúp khi làm</h3><div class="err-chart">' + D.HOME_SUPPORT.map(function (o) {
          var n = done.filter(function (h) { return h.support === o.id; }).length;
          return '<div class="err-row"><span class="err-label">' + o.label + '</span><span class="err-track" tabindex="0" data-tip="' + ui.esc(o.label + ': ' + n + ' lượt') + '"><span class="err-fill is-home' + (n ? '' : ' is-zero') + '" style="width:' + Math.round(n / max * 100) + '%"></span></span><span class="err-val num">' + n + '</span></div>';
        }).join('') + '</div>';
    }
    return '<section class="panel"><h2 class="panel-title">Luyện ở nhà</h2>' + body + '</section>';
  }

  // Học liệu AI: giáo viên sửa bao nhiêu, tiếng ngoài kho trước và sau khi duyệt.
  function aiPanel() {
    var items = S.state.library.filter(function (x) { return x.source === 'ai'; });
    var body;
    if (!items.length) {
      body = '<p class="muted">Chưa có học liệu nào do AI soạn nháp. Học liệu soạn từ mẫu không tính ở đây.</p>';
    } else {
      var edits = items.reduce(function (n, x) { return n + (x.edits ? x.edits.length : 0); }, 0);
      var withEdits = items.filter(function (x) { return x.edits && x.edits.length; }).length;
      var outStart = items.reduce(function (n, x) { return n + (x.outsideStart || 0); }, 0);
      var outEnd = items.reduce(function (n, x) { return n + (x.outsideEnd || 0); }, 0);
      var minutes = avg(items.map(function (x) { return x.minutes || 0; }));
      body = '<table class="table"><tbody>' +
        '<tr><th scope="row">Học liệu AI đã duyệt</th><td class="num">' + items.length + '</td></tr>' +
        '<tr><th scope="row">Cần giáo viên sửa</th><td class="num">' + withEdits + '/' + items.length + '</td></tr>' +
        '<tr><th scope="row">Tổng số chỗ đã sửa</th><td class="num">' + edits + '</td></tr>' +
        '<tr><th scope="row">Tiếng ngoài kho lúc nhận</th><td class="num">' + outStart + '</td></tr>' +
        '<tr><th scope="row">Tiếng ngoài kho lúc duyệt</th><td class="num">' + outEnd + '</td></tr>' +
        '<tr><th scope="row">Thời gian soạn và duyệt trung bình</th><td class="num">' + one(minutes) + ' phút</td></tr>' +
        '</tbody></table><p class="muted">Xem từng chỗ sửa trong Kho học liệu, nút Xem.</p>';
    }
    return '<section class="panel"><h2 class="panel-title">Học liệu do AI soạn</h2>' + body + '</section>';
  }

  function classView() {
    var rows = studentRows();
    var withA = rows.filter(function (r) { return r.a; });
    var withB = rows.filter(function (r) { return r.a && r.b; });
    var up = rows.filter(function (r) { return r.t.id === 'len'; }).length;
    var flat = rows.filter(function (r) { return r.t.id === 'giu' || r.t.id === 'xuong'; }).length;
    var waiting = rows.length - up - flat;
    var minutes = S.effortMinutes();
    var wPre = avg(rows.filter(function (r) { return r.wa; }).map(function (r) { return r.wa.ratio; }));
    var wPost = avg(rows.filter(function (r) { return r.wb; }).map(function (r) { return r.wb.ratio; }));

    var stats = '<div class="stats">' +
      '<div class="stat"><p class="stat-label">Đọc đúng, bài đo A/B</p><p class="stat-value num">' + one(avg(withA.map(function (r) { return r.a.score; }))) + '<span class="stat-arrow">→</span>' + one(avg(withB.map(function (r) { return r.b.score; }))) + '<span class="stat-unit">/20</span></p>' +
      '<p class="stat-sub">Trung bình đầu vào ' + withA.length + ' em, đầu ra ' + withB.length + ' em</p></div>' +
      '<div class="stat"><p class="stat-label">Số em theo kết quả</p><p class="stat-value num">' + up + '<span class="stat-unit">tiến bộ</span></p>' +
      '<p class="stat-sub">' + flat + ' em chưa rõ thay đổi hoặc giảm, ' + waiting + ' em chưa đủ dữ liệu</p></div>' +
      '<div class="stat"><p class="stat-label">Viết đúng tiêu chí</p><p class="stat-value num">' + ui.pct(wPre) + '<span class="stat-arrow">→</span>' + ui.pct(wPost) + '</p><p class="stat-sub">Trung bình điểm tiêu chí, đầu vào và đầu ra</p></div>' +
      '<div class="stat"><p class="stat-label">Công sức giáo viên</p><p class="stat-value num">' + minutes + '<span class="stat-unit">phút</span></p><p class="stat-sub">' + S.state.effort.length + ' lần soạn, duyệt, ghi phiếu</p></div>' +
      '</div>';

    var table = '<section class="panel"><div class="panel-head"><h2 class="panel-title">Từng học sinh</h2>' +
      '<button type="button" class="btn btn-sm" data-act="csv">' + ui.icon('download') + 'Xuất CSV</button></div>' +
      '<div class="table-wrap"><table class="table report-table"><thead><tr>' +
      '<th scope="col">Học sinh</th><th scope="col" class="num">Đọc đầu vào</th><th scope="col" class="num">Đọc đầu ra</th><th scope="col" class="num">Thay đổi</th><th scope="col">Kết quả</th>' +
      '<th scope="col" class="num">Viết</th><th scope="col">Vần cần luyện</th><th scope="col" class="num">Buổi luyện</th></tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><th scope="row"><a href="#/bao-cao/' + r.s.id + '">' + ui.esc(r.s.code) + '</a></th>' +
          '<td class="num">' + (r.a ? r.a.score + '/20' : '–') + '</td><td class="num">' + (r.b ? r.b.score + '/20' : '–') + '</td>' +
          '<td class="num">' + delta(r.t) + '</td><td>' + trendChip(r.t) + '</td>' +
          '<td class="num">' + (r.wa ? ui.pct(r.wa.ratio) : '–') + ' → ' + (r.wb ? ui.pct(r.wb.ratio) : '–') + '</td>' +
          '<td class="reading">' + ui.esc(r.sug.van) + '</td><td class="num">' + r.sessions + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="muted">Báo cáo liệt kê đủ cả em tiến bộ và em chưa tiến bộ. Kết quả trước, sau ở một lớp là bằng chứng ban đầu, chưa đủ để kết luận học liệu là nguyên nhân.</p></section>';

    var effort = '<section class="panel"><div class="panel-head"><h2 class="panel-title">Nhật ký công sức giáo viên</h2>' +
      '<button type="button" class="btn btn-sm" data-act="add-effort">' + ui.icon('plus') + 'Ghi thêm</button></div>' +
      (S.state.effort.length ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Ngày</th><th scope="col">Việc</th><th scope="col">Ghi chú</th><th scope="col" class="num">Phút</th></tr></thead><tbody>' +
        S.state.effort.slice().sort(function (a, b) { return b.date - a.date; }).map(function (e) {
          return '<tr><td class="tnum">' + ui.fmtDate(e.date) + '</td><td>' + ui.esc(e.tool) + '</td><td>' + ui.esc(e.note) + '</td><td class="num">' + e.minutes + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="muted">Chưa có ghi nhận.</p>') +
      '<p class="muted">Thời gian thực tế tính cả phần sửa nội dung AI. Được ghi tự động khi duyệt học liệu và lưu phiếu đọc.</p></section>';

    return stats + '<div class="two-col">' + '<section class="panel">' + prePostChart(null) + '</section>' + '<section class="panel">' + errorChart(null) + '</section></div>' + table +
      '<div class="two-col">' + homePanel(null) + aiPanel() + '</div>' + effort;
  }

  function studentView(sid) {
    var s = S.student(sid);
    if (!s) return ui.emptyState('Không tìm thấy học sinh', 'Học sinh này có thể đã bị xóa.', '<a class="btn" href="#/bao-cao">Về báo cáo cả lớp</a>');
    var a = S.latestTest(sid, 'dau-vao'), b = S.latestTest(sid, 'dau-ra');
    var t = trend(a, b);
    var sug = S.suggest(sid);
    var comp = S.state.comprehension.filter(function (c) { return c.studentId === sid; }).sort(function (x, y) { return y.date - x.date; });
    var prac = S.state.practice.filter(function (p) { return p.studentId === sid; }).sort(function (x, y) { return y.date - x.date; });
    var map = S.vanMap(sid);
    var mini = '<div class="mini-map">' + D.vansUpTo(S.state.classInfo.progress).map(function (v) {
      var c = map[v];
      return '<span class="mini-tile is-' + S.cellStatus(c) + '"><span class="reading">' + ui.esc(v) + '</span><span class="num">' + (c.read.total ? c.read.correct + '/' + c.read.total : '–') + '</span></span>';
    }).join('') + '</div>';

    return '<div class="stats">' +
      '<div class="stat"><p class="stat-label">Đọc đúng, bài đo A/B</p><p class="stat-value num">' + (a ? a.score : '–') + '<span class="stat-arrow">→</span>' + (b ? b.score : '–') + '<span class="stat-unit">/20</span></p><p class="stat-sub">' + trendChip(t) + '</p></div>' +
      '<div class="stat"><p class="stat-label">Gợi ý luyện tiếp</p><p class="stat-value reading">' + ui.esc(sug.van) + '</p><p class="stat-sub">' + ui.esc(D.label(D.LEVELS, sug.level)) + '</p></div>' +
      '<div class="stat"><p class="stat-label">Buổi luyện ở Góc luyện tập</p><p class="stat-value num">' + prac.length + '</p><p class="stat-sub">' + (prac[0] ? 'Gần nhất ' + ui.fmtDate(prac[0].date) + ', đúng ' + prac[0].correct + '/' + prac[0].total : 'Chưa luyện') + '</p></div>' +
      '</div>' +
      '<section class="panel"><h2 class="panel-title">Bản đồ âm vần</h2>' + mini + '<p class="muted">' + ui.esc(sug.reason) + '</p></section>' +
      '<div class="two-col"><section class="panel">' + prePostChart(sid) + '</section><section class="panel">' + errorChart(sid) + '</section></div>' +
      (VV.assess.writingHistoryHTML(sid) || '') + homePanel(sid) +
      '<section class="panel"><h2 class="panel-title">Đọc hiểu</h2>' +
      (comp.length ? '<ul class="plain-list">' + comp.map(function (c) {
        return '<li><span class="num">' + ui.fmtDate(c.date) + '</span> ' + ui.esc(c.textTitle) + ': <b class="num">' + c.correct + '/' + c.total + '</b> câu đúng, ' + (c.support === 'tu-doc' ? 'em tự đọc' : 'được đọc hỗ trợ') + '.</li>';
      }).join('') + '</ul>' : '<p class="muted">Chưa ghi đọc hiểu.</p>') + '</section>';
  }

  var sid = null;
  function render(root, params) {
    sid = params[0] || null;
    var st = S.state;
    var head = sid
      ? '<nav class="crumbs" aria-label="Vị trí"><a href="#/bao-cao">Báo cáo tiến bộ</a><span aria-hidden="true">/</span><span aria-current="page">' + ui.esc(S.studentLabel(sid)) + '</span></nav>' +
        '<header class="page-head"><div><h1>Tiến bộ của ' + ui.esc(S.studentLabel(sid)) + '</h1><p class="lede">Đầu vào so với đầu ra, lỗi đọc, bài viết và đọc hiểu.</p></div>'
      : '<header class="page-head"><div><h1>Báo cáo tiến bộ</h1><p class="lede">Tổng hợp kết quả trước và sau khi dùng học liệu để giáo viên điều chỉnh việc dạy.</p></div>';
    head += '<div class="btn-row"><label class="field field-inline"><span class="sr-only">Xem báo cáo của</span><select data-role="pick" aria-label="Xem báo cáo của">' +
      '<option value="">Cả lớp</option>' + st.students.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sid ? ' selected' : '') + '>' + ui.esc(s.code) + '</option>'; }).join('') + '</select></label>' +
      '<button type="button" class="btn" data-act="print">' + ui.icon('printer') + 'In báo cáo</button></div></header>';
    root.innerHTML = '<section class="page report">' + head +
      (st.isDemo ? '<div class="banner">Số liệu đang hiển thị là dữ liệu mẫu giả lập. Chỉ trình bày số liệu thu được thật khi báo cáo.</div>' : '') +
      '<div id="report-body">' + (st.students.length ? (sid ? studentView(sid) : classView()) : ui.emptyState('Chưa có dữ liệu', 'Thêm học sinh và ghi bài đo đầu vào để bắt đầu.', '<a class="btn btn-primary" href="#/cai-dat/lop">Thêm học sinh</a>')) + '</div>' +
      '</section>';
  }

  VV.views['bao-cao'] = {
    render: render,
    act: {
      print: function () {
        var body = document.getElementById('report-body').innerHTML;
        ui.printHTML('<h1 class="print-title">' + (sid ? 'Tiến bộ của ' + ui.esc(S.studentLabel(sid)) : 'Báo cáo tiến bộ ' + ui.esc(S.state.classInfo.name)) + '</h1><p class="print-meta">Ngày in: ' + ui.fmtDate(Date.now()) + '</p>' + body, 'Báo cáo tiến bộ');
      },
      csv: function () {
        var rows = [['Học sinh', 'Đọc đầu vào (/20)', 'Đọc đầu ra (/20)', 'Thay đổi', 'Kết quả', 'Viết đầu vào', 'Viết đầu ra', 'Vần cần luyện', 'Buổi luyện']];
        studentRows().forEach(function (r) {
          rows.push([r.s.code, r.a ? r.a.score : '', r.b ? r.b.score : '', r.t.delta == null ? '' : r.t.delta, r.t.label,
            r.wa ? Math.round(r.wa.ratio * 100) + '%' : '', r.wb ? Math.round(r.wb.ratio * 100) + '%' : '', r.sug.van, r.sessions]);
        });
        ui.download('bao-cao-tien-bo.csv', ui.csv(rows), 'text/csv;charset=utf-8');
      },
      'add-effort': function () {
        ui.openDialog('<form><h2 id="dialog-title" class="dialog-title">Ghi thời gian làm việc</h2>' +
          '<div class="field"><label for="ef-tool">Việc đã làm</label><input id="ef-tool" name="tool" required autocomplete="off" placeholder="Ví dụ: chấm vở…"></div>' +
          '<div class="field"><label for="ef-min">Số phút</label><input id="ef-min" name="minutes" type="number" inputmode="numeric" min="1" max="600" required class="input-short num"></div>' +
          '<div class="field"><label for="ef-note">Ghi chú <span class="optional">(không bắt buộc)</span></label><input id="ef-note" name="note" autocomplete="off"></div>' +
          '<div class="dialog-actions"><button type="button" class="btn" data-global="close-dialog">Hủy</button><button type="submit" class="btn btn-primary">Lưu</button></div></form>',
          {
            onMount: function (dlg) {
              dlg.querySelector('form').onsubmit = function (e) {
                e.preventDefault();
                var f = e.target;
                S.commit(function (s) { s.effort.push({ id: S.uid('e'), date: Date.now(), tool: f.tool.value.trim(), minutes: Number(f.minutes.value), note: f.note.value.trim() }); });
                ui.closeDialog(); VV.app.refresh();
              };
            }
          });
      }
    },
    onchange: function (e) {
      if (e.target.getAttribute('data-role') === 'pick') VV.app.go('bao-cao' + (e.target.value ? '/' + e.target.value : ''));
    }
  };
})(window.VV = window.VV || {});

</script>
<script>
/* js/view-settings.js */
/* Cài đặt: kết nối AI, lớp học, kho tiếng, giọng đọc, dữ liệu. */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store;

  var showKey = false;
  var testing = null;

  function aiSection() {
    var s = S.settings.ai;
    var P = VV.ai.PROVIDERS;
    var prov = P[s.provider];
    var key = S.getApiKey();
    return '<section class="panel" id="ai" aria-labelledby="ai-title"><h2 class="panel-title" id="ai-title">Kết nối AI</h2>' +
      '<p class="muted">AI chỉ soạn bản nháp học liệu. Nhập API key của dịch vụ bạn dùng; key được gửi thẳng từ trình duyệt tới nhà cung cấp đó, không qua máy chủ nào khác.</p>' +
      '<form data-form="ai" autocomplete="off">' +
      '<fieldset class="field"><legend>Nhà cung cấp</legend><div class="provider-grid">' +
      Object.keys(P).map(function (k) {
        return '<label class="provider"><input type="radio" name="provider" value="' + k + '"' + (k === s.provider ? ' checked' : '') + '><span class="provider-name">' + ui.esc(P[k].label) + '</span><span class="provider-hint">' + ui.esc(P[k].keyHint) + '</span></label>';
      }).join('') + '</div></fieldset>' +
      (s.provider === 'compatible'
        ? '<div class="field"><label for="ai-base">Địa chỉ API (base URL)</label><input id="ai-base" name="baseUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://openrouter.ai/api/v1…" value="' + ui.esc(s.baseUrl) + '"><p class="hint">Địa chỉ có đường dẫn /chat/completions phía sau, theo chuẩn OpenAI.</p></div>'
        : '') +
      '<div class="field"><label for="ai-key">API key</label><div class="input-group">' +
      '<input id="ai-key" name="key" type="' + (showKey ? 'text' : 'password') + '" spellcheck="false" autocomplete="off" placeholder="' + ui.esc(prov.keyHint) + '…" value="' + ui.esc(key) + '">' +
      '<button type="button" class="btn-icon" data-act="toggle-key" aria-label="' + (showKey ? 'Ẩn key' : 'Hiện key') + '" aria-pressed="' + showKey + '">' + ui.icon(showKey ? 'eyeOff' : 'eye') + '</button></div>' +
      (prov.keyUrl ? '<p class="hint">Lấy key tại <a href="' + prov.keyUrl + '" target="_blank" rel="noopener">' + ui.esc(prov.keyUrl.replace(/^https:\/\//, '')) + '</a>.</p>' : '') + '</div>' +
      '<div class="field"><label for="ai-model">Model</label><input id="ai-model" name="model" list="ai-models" spellcheck="false" value="' + ui.esc(s.model) + '" placeholder="Ví dụ: claude-opus-5-5…">' +
      '<datalist id="ai-models">' + prov.models.map(function (m) { return '<option value="' + ui.esc(m) + '">'; }).join('') + '</datalist>' +
      '<p class="hint">' + (s.provider === 'anthropic' ? 'Mặc định claude-opus-5-5. Có thể chọn claude-sonnet-5-5 hoặc claude-haiku-5-5 để nhanh và rẻ hơn.' : 'Nhập đúng tên model mà tài khoản của bạn được dùng.') + '</p></div>' +
      '<label class="check"><input type="checkbox" name="remember"' + (s.remember ? ' checked' : '') + '><span>Ghi nhớ key trên máy này. Bỏ chọn nếu dùng máy chung: key sẽ mất khi đóng thẻ trình duyệt.</span></label>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu kết nối</button>' +
      '<button type="button" class="btn" data-act="test-ai"' + (testing ? ' disabled' : '') + '>' + (testing ? 'Đang kiểm tra…' : 'Kiểm tra kết nối') + '</button>' +
      (key ? '<button type="button" class="btn btn-ghost" data-act="clear-key">Xóa key</button>' : '') + '</div>' +
      '<p class="ai-test" id="ai-test" role="status" aria-live="polite"></p>' +
      '<details class="details"><summary>Dữ liệu nào được gửi cho AI?</summary><p>Chỉ gửi vần, yêu cầu cần đạt, loại lỗi và danh sách vần trong kho tiếng. Không gửi mã học sinh, kết quả đọc, ảnh bài viết hay ghi chú. Dịch vụ AI tính phí theo tài khoản của bạn.</p></details>' +
      '</form></section>';
  }

  function classSection() {
    var c = S.state.classInfo;
    return '<section class="panel" id="lop" aria-labelledby="lop-title"><h2 class="panel-title" id="lop-title">Lớp học</h2>' +
      '<form data-form="class"><div class="form-grid">' +
      '<div class="field"><label for="cl-name">Tên lớp</label><input id="cl-name" name="name" value="' + ui.esc(c.name) + '" autocomplete="off"></div>' +
      '<div class="field"><label for="cl-prog">Lớp đang học</label>' + ui.groupSelect('cl-prog', 'progress', c.progress) +
      '<p class="hint">Quyết định kho tiếng, âm, vần được gợi ý và phạm vi bài đo.</p></div></div>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu thông tin lớp</button></div></form>' +
      '<h3 class="sub-title">Học sinh</h3><p class="muted">Dùng mã thay cho họ tên để bảo vệ dữ liệu trẻ em. Ghi chú chỉ lưu trên máy này.</p>' +
      '<ul class="student-list">' + S.state.students.map(function (s) {
        return '<li><input value="' + ui.esc(s.code) + '" data-stu-code="' + s.id + '" aria-label="Mã học sinh" class="input-short" autocomplete="off">' +
          '<input value="' + ui.esc(s.note) + '" data-stu-note="' + s.id + '" aria-label="Ghi chú cho ' + ui.esc(s.code) + '" placeholder="Ghi chú, không bắt buộc…" autocomplete="off">' +
          '<button type="button" class="btn-icon" data-act="del-stu" data-id="' + s.id + '" aria-label="Xóa ' + ui.esc(s.code) + '">' + ui.icon('trash') + '</button></li>';
      }).join('') + '</ul>' +
      '<div class="btn-row"><button type="button" class="btn" data-act="add-stu">' + ui.icon('plus') + 'Thêm một học sinh</button>' +
      '<button type="button" class="btn btn-ghost" data-act="add-many">Thêm nhiều mã cùng lúc</button></div></section>';
  }

  function khoSection() {
    var c = S.state.classInfo;
    var k = S.kho();
    var vans = Array.from(k.vans);
    return '<section class="panel" id="kho" aria-labelledby="kho-title"><h2 class="panel-title" id="kho-title">Kho tiếng</h2>' +
      '<p class="muted">Tiếng có vần dưới đây được xem là đã học. Trợ lý AI và bộ kiểm tra dùng danh sách này để đánh dấu tiếng vượt nội dung đã học.</p>' +
      '<ul class="chips kho-chips" aria-label="Vần đã học">' + vans.map(function (v) { return '<li class="chip chip-static reading">' + ui.esc(v) + '</li>'; }).join('') + '</ul>' +
      (k.initials ? '<p class="muted">Lớp đang học âm nên chỉ chấp nhận các âm đầu đã học:</p><ul class="chips kho-chips" aria-label="Âm đầu đã học">' +
        Array.from(k.initials).map(function (v) { return '<li class="chip chip-static reading">' + ui.esc(v) + '</li>'; }).join('') + '</ul>' : '') +
      '<form data-form="kho"><div class="field"><label for="kho-extra">Tiếng bổ sung đã duyệt</label>' +
      '<textarea id="kho-extra" name="extra" rows="3" class="reading" spellcheck="false" placeholder="Ví dụ: Lan, Nam…">' + ui.esc(c.extraWords.join(', ')) + '</textarea>' +
      '<p class="hint">Cách nhau bằng dấu phẩy hoặc xuống dòng.</p></div>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu kho tiếng</button></div></form></section>';
  }

  function qrSection() {
    var url = S.state.classInfo.siteUrl || '';
    var sample = url ? url.replace(/#.*$/, '') + '#/the/' + encodeURIComponent('bàn') : '';
    var preview = '';
    if (sample) { try { preview = '<div class="qr-preview">' + VV.qr.svg(sample, { label: 'Mã QR thử cho thẻ bàn' }) + '<p class="hint">Quét thử mã này bằng điện thoại: phải mở ra thẻ “bàn”.</p></div>'; } catch (e) { preview = '<p class="hint">' + ui.esc(e.message) + '</p>'; } }
    return '<section class="panel" id="qr" aria-labelledby="qr-title"><h2 class="panel-title" id="qr-title">Mã QR cho thẻ ghép tiếng</h2>' +
      '<p class="muted">Mã QR trên thẻ giấy chỉ mở được khi file này được đăng lên một địa chỉ web (ví dụ GitHub Pages, Google Sites, máy chủ của trường). Dán địa chỉ đó vào đây; thẻ in ra sẽ có mã QR mở đúng thẻ trên điện thoại. Chưa có địa chỉ thì thẻ in không kèm mã.</p>' +
      '<form data-form="site" class="qr-form"><div class="field"><label for="site-url">Địa chỉ trang Vần vui AI đã đăng</label>' +
      '<input id="site-url" name="siteUrl" type="url" inputmode="url" spellcheck="false" autocomplete="off" placeholder="https://truong-cua-ban.github.io/van-vui-ai.html…" value="' + ui.esc(url) + '"></div>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu địa chỉ</button>' + (url ? '<button type="button" class="btn btn-ghost" data-act="clear-site">Xóa địa chỉ</button>' : '') + '</div></form>' +
      preview + '</section>';
  }

  // ---------- Nội dung bài học: danh sách nhóm và ô sửa ----------
  var editKey = null;
  function findGroup(key) { return D.allGroups().filter(function (g) { return g.key === key; })[0]; }
  function stageLabel(id) { return D.label(D.STAGES, id); }

  function groupListHTML() {
    var all = D.allGroups();
    var used = all.filter(function (g) { return !g.hidden; }).length;
    return '<details class="details group-list-wrap"' + (S.state.curriculum.order || S.state.curriculum.hidden.length || S.state.curriculum.custom.length ? ' open' : '') + '>' +
      '<summary>Danh sách nhóm: ' + used + ' nhóm đang dùng' + (all.length > used ? ', ' + (all.length - used) + ' nhóm ẩn' : '') + '</summary>' +
      '<p class="muted">Bỏ chọn “Dùng” để ẩn nhóm lớp không học. Dùng mũi tên để đổi thứ tự cho khớp bộ sách. Kết quả đã ghi không bị mất khi ẩn hay đổi thứ tự.</p>' +
      '<ol class="group-list">' + all.map(function (g, i) {
        return '<li class="group-item' + (g.hidden ? ' is-hidden' : '') + '">' +
          '<label class="check"><input type="checkbox" data-grp-use="' + g.key + '"' + (g.hidden ? '' : ' checked') + '><span>Dùng</span></label>' +
          '<span class="group-item-name"><span class="group-item-num">' + (g.hidden ? 'Ẩn' : 'Nhóm ' + g.id) + '</span>' +
          '<span class="reading">' + ui.esc(g.title) + '</span><span class="group-item-stage">' + ui.esc(stageLabel(g.stage)) + (g.edited ? ', đã sửa' : '') + '</span></span>' +
          '<span class="group-item-actions">' +
          '<button type="button" class="btn-icon" data-act="grp-up" data-key="' + g.key + '" aria-label="Đưa nhóm ' + ui.esc(g.title) + ' lên"' + (i === 0 ? ' disabled' : '') + '>' + ui.icon('arrowUp') + '</button>' +
          '<button type="button" class="btn-icon" data-act="grp-down" data-key="' + g.key + '" aria-label="Đưa nhóm ' + ui.esc(g.title) + ' xuống"' + (i === all.length - 1 ? ' disabled' : '') + '>' + ui.icon('arrowDown') + '</button>' +
          '<button type="button" class="btn btn-sm" data-act="grp-edit" data-key="' + g.key + '">Sửa</button></span></li>';
      }).join('') + '</ol>' +
      '<div class="btn-row"><button type="button" class="btn" data-act="grp-add">' + ui.icon('plus') + 'Thêm nhóm vần</button>' +
      (S.state.curriculum.order || S.state.curriculum.hidden.length ? '<button type="button" class="btn btn-ghost" data-act="grp-reset-order">Trở về thứ tự gợi ý</button>' : '') + '</div></details>';
  }

  function contentSection() {
    var g = (editKey && findGroup(editKey)) || D.GROUPS[S.state.classInfo.progress - 1];
    editKey = g.key;
    var isCustom = g.stage === 'tu-them';
    var unitName = function (v) { return D.isConsonantUnit(v) ? 'âm' : 'vần'; };
    return '<section class="panel" id="noi-dung" aria-labelledby="nd-title"><h2 class="panel-title" id="nd-title">Nội dung bài học</h2>' +
      '<p class="muted">Chỉnh cho khớp bộ sách và những gì lớp đã học: ẩn hoặc đổi thứ tự nhóm, thêm nhóm vần, sửa tiếng, từ, câu của từng nhóm.</p>' +
      groupListHTML() +
      '<form data-form="content" class="content-form">' +
      '<div class="field field-inline"><label for="nd-group">Sửa nhóm</label><select id="nd-group" name="groupKey">' +
      D.allGroups().map(function (x) { return '<option value="' + x.key + '"' + (x.key === g.key ? ' selected' : '') + '>' + (x.hidden ? 'Ẩn' : 'Nhóm ' + x.id) + ': ' + ui.esc(x.title) + (x.edited ? ' (đã sửa)' : '') + '</option>'; }).join('') + '</select></div>' +
      '<div class="form-grid">' + g.vans.map(function (v) {
        return '<div class="field"><label for="nd-w-' + v + '">Tiếng có ' + unitName(v) + ' <span class="reading">' + ui.esc(v) + '</span></label>' +
          '<textarea id="nd-w-' + v + '" name="w-' + v + '" rows="2" class="reading" spellcheck="false">' + ui.esc(g.words[v].join(', ')) + '</textarea><p class="hint">Từ 2 đến 8 tiếng, cách nhau dấu phẩy.</p></div>';
      }).join('') + '</div>' +
      '<div class="form-grid"><div class="field"><label for="nd-ph">Từ ngữ (mỗi dòng một từ)</label><textarea id="nd-ph" name="phrases" rows="5" class="reading" spellcheck="false">' + ui.esc(g.phrases.join('\n')) + '</textarea></div>' +
      '<div class="field"><label for="nd-se">Câu (mỗi dòng một câu) <span class="optional">(không bắt buộc)</span></label><textarea id="nd-se" name="sentences" rows="5" class="reading" spellcheck="false">' + ui.esc(g.sentences.join('\n')) + '</textarea></div></div>' +
      '<div class="field"><label for="nd-fill">Câu điền từ <span class="optional">(không bắt buộc; mỗi dòng: câu có ___ | các lựa chọn cách nhau dấu phẩy | đáp án)</span></label>' +
      '<textarea id="nd-fill" name="fill" rows="3" class="reading" spellcheck="false">' + ui.esc(g.fill.map(function (f) { return f.text + ' | ' + f.options.join(', ') + ' | ' + f.answer; }).join('\n')) + '</textarea></div>' +
      '<div id="nd-issues"></div>' +
      '<div class="btn-row"><button type="submit" class="btn btn-primary">Lưu nhóm ' + ui.esc(g.title) + '</button>' +
      (g.edited && !isCustom ? '<button type="button" class="btn btn-ghost" data-act="reset-group">Khôi phục nội dung gốc</button>' : '') +
