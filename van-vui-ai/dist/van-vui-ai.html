    { id: 'hinh-chu', label: 'Hình chữ' },
    { id: 'dau-thanh', label: 'Vị trí dấu thanh' },
    { id: 'khoang-cach', label: 'Khoảng cách' },
    { id: 'do-cao', label: 'Độ cao con chữ' }
  ];
  var INDEPENDENCE = [
    { id: 'tu-viet', label: 'Tự viết' },
    { id: 'nhin-mau', label: 'Nhìn mẫu' },
    { id: 'can-ho-tro', label: 'Cần hỗ trợ' }
  ];
  var LEVELS = [
    { id: 'ho-tro', label: 'Có hỗ trợ', hint: 'Có nghe mẫu, tô màu vần, ít lựa chọn.' },
    { id: 'tu-lam', label: 'Tự thực hiện', hint: 'Tự ghép, tự chọn, không có gợi ý.' },
    { id: 'van-dung', label: 'Vận dụng', hint: 'Dùng tiếng trong từ, câu mới.' }
  ];
  var PHASES = [
    { id: 'dau-vao', label: 'Đầu vào' },
    { id: 'thuong-xuyen', label: 'Thường xuyên' },
    { id: 'dau-ra', label: 'Đầu ra' }
  ];
  var HOME_STATUS = [
    { id: 'da-giao', label: 'Đã giao' },
    { id: 'da-lam', label: 'Đã làm' },
    { id: 'chua-lam', label: 'Chưa làm' }
  ];
  var HOME_SUPPORT = [
    { id: 'tu-lam', label: 'Con tự làm' },
    { id: 'nhac-nho', label: 'Cần nhắc' },
    { id: 'lam-cung', label: 'Bố mẹ làm cùng' }
  ];
  var TOPICS = ['Gia đình', 'Trường lớp', 'Con vật', 'Cây và quả', 'Thời tiết'];

  function groupOfVan(van) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].vans.indexOf(van) !== -1) return GROUPS[i];
    return null;
  }
  function allVans() {
    var out = [];
    GROUPS.forEach(function (g) { out = out.concat(g.vans); });
    return out;
  }
  function vansUpTo(groupId) {
    var out = [];
    GROUPS.forEach(function (g) { if (g.id <= groupId) out = out.concat(g.vans); });
    return out;
  }
  function label(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].label;
    return id;
  }

  VV.data = {
    BASE_VANS: BASE_VANS,
    GROUPS: GROUPS,
    STAGES: STAGES,
    DEFAULT_ORDER: DEFAULT_ORDER,
    LEGACY_KEYS: LEGACY_KEYS,
    applyCurriculum: applyCurriculum,
    allGroups: allGroups,
    isConsonantUnit: isConsonantUnit,
    matches: matches,
    unitOf: unitOf,
    unitWord: unitWord,
    unitLabel: unitLabel,
    findWord: findWord,
    khoAt: khoAt,
    READ_ERRORS: READ_ERRORS,
    WRITE_CRITERIA: WRITE_CRITERIA,
    INDEPENDENCE: INDEPENDENCE,
    LEVELS: LEVELS,
    PHASES: PHASES,
    TOPICS: TOPICS,
    HOME_STATUS: HOME_STATUS,
    HOME_SUPPORT: HOME_SUPPORT,
    groupOfVan: groupOfVan,
    defaultsOf: defaultsOf,
    allVans: allVans,
    vansUpTo: vansUpTo,
    label: label
  };
  applyCurriculum({});
})(window.VV = window.VV || {});

</script>
<script>
/* js/store.js */
/* Lưu trữ trên trình duyệt, dữ liệu mẫu và các phép tính cho bản đồ âm vần, gợi ý, báo cáo. */
(function (VV) {
  'use strict';
  var D = VV.data;
  var KEY = 'vanvui.state.v1';
  var SETTINGS_KEY = 'vanvui.settings.v1';
  var APIKEY_KEY = 'vanvui.apikey.v1';
  var DAY = 86400000;

  var listeners = [];
  var state = null;
  var settings = null;
  var sessionKey = '';

  function uid(prefix) {
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  }

  function safeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) {
    try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
  function safeRemove(k) { try { window.localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } }

  function emptyState() {
    return {
      version: 1,
      isDemo: false,
      classInfo: { name: 'Lớp 1', progress: 1, extraWords: [], siteUrl: '' },
      students: [],
      records: [],
      tests: [],
      writing: [],
      comprehension: [],
      practice: [],
      assignments: {},
      library: [],
      effort: [],
      homework: [],
      contentVersion: 2,
      curriculum: { edits: {}, order: null, hidden: [], custom: [], toneStyle: 'moi' }
    };
  }

  function defaultSettings() {
    return {
      ai: { provider: 'anthropic', model: 'claude-opus-5-5', baseUrl: '', remember: false },
      voice: { name: '', rate: 0.85 }
    };
  }

  // ---------- Lưu trữ: IndexedDB (dung lượng lớn, đủ cho cả năm học), dự phòng localStorage ----------
  var DB_NAME = 'vanvui', DB_STORE = 'kv';
  var dbPromise = null;
  function db() {
    if (!dbPromise) {
      dbPromise = new Promise(function (resolve, reject) {
        if (!window.indexedDB) { reject(new Error('no idb')); return; }
        var timer = setTimeout(function () { reject(new Error('idb timeout')); }, 2000);
        var req;
        try { req = window.indexedDB.open(DB_NAME, 1); } catch (e) { clearTimeout(timer); reject(e); return; }
        req.onupgradeneeded = function () { req.result.createObjectStore(DB_STORE); };
        req.onsuccess = function () { clearTimeout(timer); resolve(req.result); };
        req.onerror = function () { clearTimeout(timer); reject(req.error); };
        req.onblocked = function () { clearTimeout(timer); reject(new Error('idb blocked')); };
      });
    }
    return dbPromise;
  }
  function idbGet(k) {
    return db().then(function (d) {
      return new Promise(function (resolve, reject) {
        var r = d.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k);
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function idbPut(k, v) {
    return db().then(function (d) {
      return new Promise(function (resolve, reject) {
        var tx = d.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(v, k);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error); };
      });
    });
  }

  // Dữ liệu trong localStorage chỉ còn khi là bản cũ hoặc khi IndexedDB không dùng được: ưu tiên bản đó.
  function readRaw() {
    var legacy = safeGet(KEY);
    if (legacy) return Promise.resolve(legacy);
    return idbGet(KEY).catch(function () { return null; });
  }

  function load() {
    return readRaw().then(function (raw) {
      if (raw) {
        try { state = JSON.parse(raw); } catch (e) { state = null; }
      }
      finishLoad();
    });
  }
  function finishLoad() {
    if (!state || state.version !== 1) state = buildDemo();
    migrate(state);
    var s = safeGet(SETTINGS_KEY);
    settings = defaultSettings();
    if (s) {
      try {
        var parsed = JSON.parse(s);
        settings.ai = Object.assign(settings.ai, parsed.ai || {});
        settings.voice = Object.assign(settings.voice, parsed.voice || {});
      } catch (e) { /* giữ mặc định */ }
    }
    save();
  }

  // Bổ sung trường mới cho dữ liệu đã lưu từ bản trước.
  function migrate(s) {
    var base = emptyState();
    var oldKey = null;
    if (!s.contentVersion) {
      // Bản đầu chỉ có 10 nhóm vần đánh số 1-10: đổi sang khóa ổn định của danh sách đầy đủ.
      var old = s.curriculum || {}, edits = {};
      Object.keys(old).forEach(function (id) { var k = D.LEGACY_KEYS[Number(id) - 1]; if (k) edits[k] = old[id]; });
      s.curriculum = { edits: edits, order: null, hidden: [], custom: [], toneStyle: 'moi' };
      oldKey = D.LEGACY_KEYS[(s.classInfo && s.classInfo.progress || 1) - 1] || D.LEGACY_KEYS[0];
      s.contentVersion = 2;
    }
    Object.keys(base).forEach(function (k) { if (s[k] === undefined) s[k] = base[k]; });
    Object.keys(base.classInfo).forEach(function (k) { if (s.classInfo[k] === undefined) s.classInfo[k] = base.classInfo[k]; });
    Object.keys(base.curriculum).forEach(function (k) { if (s.curriculum[k] === undefined) s.curriculum[k] = base.curriculum[k]; });
    D.applyCurriculum(s.curriculum);
    VV.viet.setToneStyle(s.curriculum.toneStyle);
    if (oldKey) s.classInfo.progress = positionOf(oldKey);
    s.classInfo.progress = Math.max(1, Math.min(D.GROUPS.length, s.classInfo.progress || 1));
  }
  function positionOf(key) {
    for (var i = 0; i < D.GROUPS.length; i++) if (D.GROUPS[i].key === key) return D.GROUPS[i].id;
    return 1;
  }

  // Sửa danh sách nhóm (ẩn, đổi thứ tự, thêm nhóm…) mà vẫn giữ đúng nhóm lớp đang học.
  function updateCurriculum(mutator) {
    var cur = D.GROUPS[state.classInfo.progress - 1];
    var curKey = cur && cur.key;
    var curIndex = D.allGroups().indexOf(cur);
    mutator(state.curriculum);
    D.applyCurriculum(state.curriculum);
    VV.viet.setToneStyle(state.curriculum.toneStyle);
    var pos = 0;
    D.GROUPS.forEach(function (g) { if (g.key === curKey) pos = g.id; });
    if (!pos) {
      // Nhóm đang học vừa bị ẩn: lùi về nhóm đang dùng gần nhất phía trước.
      var all = D.allGroups();
      for (var i = Math.min(curIndex, all.length - 1); i >= 0 && !pos; i--) if (!all[i].hidden) pos = all[i].id;
    }
    state.classInfo.progress = pos || 1;
    save();
    listeners.forEach(function (fn) { fn(); });
  }

  var saveFailed = false;
  var lastSize = 0;
  var writeChain = Promise.resolve();
  var warned = false;
  function save() {
    var json = JSON.stringify(state);
    lastSize = json.length * 2;
    safeSet(SETTINGS_KEY, JSON.stringify(settings));
    // Ghi tuần tự để bản mới nhất luôn là bản cuối cùng được lưu.
    writeChain = writeChain.then(function () {
      return idbPut(KEY, json).then(function () {
        saveFailed = false;
        safeRemove(KEY);
      }, function () {
        saveFailed = !safeSet(KEY, json);
        if (saveFailed && !warned && VV.ui) { warned = true; VV.ui.toast('Không lưu được dữ liệu: bộ nhớ trình duyệt đã đầy hoặc bị chặn. Xuất bản sao lưu ở Cài đặt, mục Dữ liệu.', 'error'); }
      });
    });
    return writeChain;
  }

  function commit(mutator) {
    mutator(state);
    save();
    listeners.forEach(function (fn) { fn(); });
  }
  function onChange(fn) { listeners.push(fn); }

  // ---------- API key ----------
  // Key ghi nhớ: localStorage. Không ghi nhớ: sessionStorage, mất khi đóng thẻ.
  function sessGet() { try { return window.sessionStorage.getItem(APIKEY_KEY); } catch (e) { return null; } }
  function sessSet(v) { try { if (v) window.sessionStorage.setItem(APIKEY_KEY, v); else window.sessionStorage.removeItem(APIKEY_KEY); } catch (e) { /* bỏ qua */ } }
  function getApiKey() { return sessionKey || sessGet() || safeGet(APIKEY_KEY) || ''; }
  function setApiKey(key, remember) {
    sessionKey = key || '';
    if (remember && key) { safeSet(APIKEY_KEY, key); sessSet(''); }
    else { safeRemove(APIKEY_KEY); sessSet(key || ''); }
  }

  // ---------- Truy vấn ----------
  function student(id) {
    for (var i = 0; i < state.students.length; i++) if (state.students[i].id === id) return state.students[i];
    return null;
  }
  function studentLabel(id) {
    var s = student(id);
    return s ? s.code : 'Học sinh đã xóa';
  }

  function kho() {
    return D.khoAt(state.classInfo.progress, state.classInfo.extraWords);
  }

  function byDateDesc(a, b) { return b.date - a.date; }

  // Bản đồ âm vần của một học sinh: mỗi vần lấy tối đa 6 lần đọc gần nhất do giáo viên ghi.
  function vanMap(studentId) {
    var out = {};
    D.allVans().forEach(function (v) {
      out[v] = { van: v, read: { correct: 0, total: 0 }, game: { correct: 0, total: 0 }, errors: {} };
    });
    var recs = state.records.filter(function (r) { return r.studentId === studentId; }).sort(byDateDesc);
    var countRead = {}, countGame = {};
    recs.forEach(function (r) {
      var cell = out[r.van];
      if (!cell) return;
      if (r.skill === 'doc') {
        countRead[r.van] = (countRead[r.van] || 0) + 1;
        if (countRead[r.van] > 6) return;
        cell.read.total++;
        if (r.correct) cell.read.correct++;
        else if (r.error) cell.errors[r.error] = (cell.errors[r.error] || 0) + 1;
      } else if (r.skill === 'nhan-dien') {
        countGame[r.van] = (countGame[r.van] || 0) + 1;
        if (countGame[r.van] > 6) return;
        cell.game.total++;
        if (r.correct) cell.game.correct++;
      }
    });
    return out;
  }

  function cellStatus(cell) {
    if (!cell || cell.read.total === 0) return 'chua-do';
    var ratio = cell.read.correct / cell.read.total;
    if (ratio <= 0.5) return 'can-luyen';
    if (ratio >= 0.83) return 'vung';
    return 'dang-len';
  }

  function levelFor(ratio) {
    if (ratio < 0.34) return 'ho-tro';
    if (ratio < 0.67) return 'tu-lam';
    return 'van-dung';
  }

  // Gợi ý theo quy tắc: vần đã học có tỉ lệ đọc đúng thấp nhất (ít nhất 3 lần đọc).
  function suggest(studentId) {
    var map = vanMap(studentId);
    var learned = D.vansUpTo(state.classInfo.progress);
    var measured = learned.filter(function (v) { return map[v].read.total >= 3; });
    if (!measured.length) {
      var g = D.GROUPS[state.classInfo.progress - 1] || D.GROUPS[0];
      return {
        van: g.vans[0], level: 'ho-tro', measured: 0, cell: map[g.vans[0]],
        reason: 'Chưa có đủ kết quả đọc. Bắt đầu với ' + D.unitLabel(g.vans[0]) + ' của bài đang học và ghi phiếu đọc nhanh để hệ thống có căn cứ.'
      };
    }
    measured.sort(function (a, b) {
      var ra = map[a].read.correct / map[a].read.total;
      var rb = map[b].read.correct / map[b].read.total;
      if (ra !== rb) return ra - rb;
      // Cùng tỉ lệ: ưu tiên âm, vần có nhiều lần đo hơn (kết quả đáng tin hơn).
      if (map[a].read.total !== map[b].read.total) return map[b].read.total - map[a].read.total;
      if (map[a].read.correct !== map[b].read.correct) return map[a].read.correct - map[b].read.correct;
      return learned.indexOf(a) - learned.indexOf(b);
    });
    var best = measured[0];
    var cell = map[best];
    var ratio = cell.read.correct / cell.read.total;
    if (ratio >= 0.83) {
      var next = D.GROUPS[Math.min(state.classInfo.progress, D.GROUPS.length) - 1];
      return {
        van: next.vans[0], level: 'van-dung', measured: measured.length, cell: map[next.vans[0]],
        reason: 'Các âm, vần đã đo đều đạt từ 5/6 tiếng đúng. Gợi ý luyện vận dụng với bài đang học.'
      };
    }
    var topErr = Object.keys(cell.errors).sort(function (a, b) { return cell.errors[b] - cell.errors[a]; })[0];
    var reason = 'Hồ sơ ghi ' + cell.read.correct + '/' + cell.read.total + ' tiếng đúng ở ' + D.unitLabel(best) +
      ', thấp nhất trong ' + measured.length + ' âm, vần đã đo.';
    if (topErr) reason += ' Lỗi gặp nhiều nhất: ' + D.label(D.READ_ERRORS, topErr).toLowerCase() + ' (' + cell.errors[topErr] + ' lần).';
    return { van: best, level: levelFor(ratio), measured: measured.length, cell: cell, reason: reason, topError: topErr };
  }

  function assignment(studentId) {
    return state.assignments[studentId] || null;
  }

  // ---------- Báo cáo ----------
  function latestTest(studentId, phase) {
    var list = state.tests.filter(function (t) { return t.studentId === studentId && t.phase === phase; }).sort(byDateDesc);
    return list[0] || null;
  }

  function readRatioBy(filter) {
    var c = 0, t = 0;
    state.records.forEach(function (r) {
      if (r.skill !== 'doc' || !filter(r)) return;
      t++; if (r.correct) c++;
    });
    return { correct: c, total: t, ratio: t ? c / t : null };
  }

  function groupPrePost(groupId, studentId) {
    var g = D.GROUPS[groupId - 1];
    function f(phase) {
      return function (r) {
        return r.phase === phase && g.vans.indexOf(r.van) !== -1 && (!studentId || r.studentId === studentId);
      };
    }
    return { pre: readRatioBy(f('dau-vao')), post: readRatioBy(f('dau-ra')) };
  }

  function errorCounts(studentId) {
    var counts = {};
    D.READ_ERRORS.forEach(function (e) { counts[e.id] = 0; });
    state.records.forEach(function (r) {
      if (r.skill !== 'doc' || r.correct || !r.error) return;
      if (studentId && r.studentId !== studentId) return;
      counts[r.error] = (counts[r.error] || 0) + 1;
    });
    return counts;
  }

  function writingScore(w) {
    var got = 0, max = 0;
    w.items.forEach(function (it) {
      D.WRITE_CRITERIA.forEach(function (c) { max += 2; got += (it.scores && it.scores[c.id]) || 0; });
    });
    return { got: got, max: max, ratio: max ? got / max : null };
  }

  function latestWriting(studentId, phase) {
    var list = state.writing.filter(function (w) { return w.studentId === studentId && (!phase || w.phase === phase); }).sort(byDateDesc);
    return list[0] || null;
  }

  function effortMinutes() {
    return state.effort.reduce(function (s, e) { return s + (Number(e.minutes) || 0); }, 0);
  }

  // ---------- Dữ liệu mẫu ----------
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Bài đo A/B: 2 tiếng mỗi vần ở các nhóm đã học, chọn 20 tiếng. Dạng A lấy tiếng chẵn, dạng B lấy tiếng lẻ.
  // Bài đo A/B: 20 tiếng rải đều các âm, vần đã học (đã sang giai đoạn vần thì chỉ đo vần).
  // Dạng A và B lấy tiếng khác nhau của cùng các đơn vị. Trả về [{ tieng, van }].
  function abForm(form, progress) {
    var units = D.vansUpTo(progress);
    var vanUnits = units.filter(function (u) { var g = D.groupOfVan(u); return g && g.kind === 'van'; });
    if (vanUnits.length) units = vanUnits;
    if (units.length > 20) {
      var spaced = [];
      for (var s = 0; s < 20; s++) spaced.push(units[Math.floor(s * units.length / 20)]);
      units = spaced;
    }
    var pick = [], used = [];
    var offset = form === 'A' ? 0 : 1;
    for (var round = 0; round < 6 && pick.length < 20; round++) {
      for (var i = 0; i < units.length && pick.length < 20; i++) {
        var list = D.groupOfVan(units[i]).words[units[i]];
        var w = list[(offset + round * 2) % list.length];
        if (used.indexOf(w) === -1) { used.push(w); pick.push({ tieng: w, van: units[i] }); }
      }
    }
    return pick;
  }

  function buildDemo() {
    var s = emptyState();
    s.isDemo = true;
    var posOf = function (key) { var p = 1; D.GROUPS.forEach(function (g) { if (g.key === key) p = g.id; }); return p; };
    var demoProgress = posOf('v-oi');
    var vanStart = posOf('v-an');
    s.classInfo = { name: 'Lớp 1A (mẫu)', progress: demoProgress, extraWords: ['lan', 'na'], siteUrl: '' };
    var R = rng(20261026);
    var now = Date.now();
    var weak = {
      HS01: { vans: ['an', 'ăn'], err: 'van', base: 0.86 },
      HS02: { vans: ['ay', 'ây'], err: 'van', base: 0.82 },
      HS03: { vans: [], err: 'thanh', base: 0.93 },
      HS04: { vans: ['âm', 'ơn'], err: 'thanh', base: 0.78 },
      HS05: { vans: ['ôi', 'ơi'], err: 'van', base: 0.8 },
      HS06: { vans: ['ên', 'en'], err: 'van', base: 0.8 },
      HS07: { vans: ['ăm', 'ân', 'ay'], err: 'danh-van', base: 0.68 },
      HS08: { vans: ['un', 'on'], err: 'am-dau', base: 0.84 }
    };
    Object.keys(weak).forEach(function (code, idx) {
      var stu = { id: 'stu-' + (idx + 1), code: code, note: '' };
      s.students.push(stu);
      var prof = weak[code];

      function readTieng(van, phase, date, source, boost) {
        var p = prof.base + (boost || 0);
        if (prof.vans.indexOf(van) !== -1) p = 0.32 + (boost || 0) * 1.6;
        p = Math.max(0.05, Math.min(0.98, p));
        var ok = R() < p;
        var err = null;
        if (!ok) {
          var roll = R();
          err = roll < 0.6 ? prof.err : D.READ_ERRORS[Math.floor(R() * 4)].id;
        }
        return { ok: ok, err: err };
      }

      // Phiếu đọc nhanh: phần âm (đã vững) từ đầu năm; 4 nhóm vần đầu là đầu vào, các nhóm sau là thường xuyên.

      D.vansUpTo(demoProgress).filter(function (v) { return D.groupOfVan(v).kind === 'van'; }).forEach(function (v) {

      // Bài đo A (đầu vào) cho mọi em, B (đầu ra) cho 6 em.
      ['A', 'B'].forEach(function (form) {

        var items = abForm(form, posOf('v-am')).map(function (it) {

        s.tests.push({ id: testId, studentId: stu.id, date: date, phase: phase, form: form, items: items, score: score, total: 20 });

      // Bài viết: tuần đầu và tuần thứ tư.
      [{ phase: 'dau-vao', d: 26, add: 0 }, { phase: 'dau-ra', d: 2, add: 1 }].forEach(function (w) {
        if (w.phase === 'dau-ra' && idx >= 6) return;
        var words = ['bàn', 'khăn', 'con', 'nến', 'cam'];
        s.writing.push({
          id: uid('w'), studentId: stu.id, date: now - w.d * DAY, phase: w.phase,

              sc[c.id] = Math.min(2, v);
            });
            return { text: t, scores: sc };
          }),
          independence: w.add ? 'tu-viet' : 'nhin-mau', note: '', photo: ''
        });
      });

      s.comprehension.push({ id: uid('c'), studentId: stu.id, date: now - 5 * DAY, phase: 'thuong-xuyen',
        textTitle: 'Bạn Lan có khăn đỏ.', correct: R() < 0.7 ? 2 : 1, total: 3, support: R() < 0.5 ? 'tu-doc' : 'duoc-doc' });

      s.practice.push({ id: uid('p'), studentId: stu.id, date: now - 3 * DAY, van: prof.vans[0] || 'ai', level: 'tu-lam',
        total: 6, correct: 3 + Math.floor(R() * 4) });
    });

    s.effort = [
      { id: uid('e'), date: now - 20 * DAY, tool: 'Bài tập theo mức độ', minutes: 14, note: 'Nhóm vần an, ăn, ân' },
      { id: uid('e'), date: now - 13 * DAY, tool: 'Truyện đúng vần', minutes: 9, note: 'Vần ai, ay' },
      { id: uid('e'), date: now - 6 * DAY, tool: 'Phiếu đọc nhanh', minutes: 18, note: 'Ghi lỗi đọc nhóm 5, 6' }
    ];

    s.library = [{
      id: uid('lib'), kind: 'truyen', title: 'Truyện mẫu: Bé và bạn', vans: ['an', 'ăn'], level: 'tu-lam',
      createdAt: now - 13 * DAY, approvedAt: now - 13 * DAY, minutes: 9, source: 'mau',
      content: {
        story: 'Bạn Lan có khăn đỏ. Bà cho Lan quả mận. Lan và bé ra sân.',
        questions: [

    // Bài tập do AI soạn, giáo viên đã sửa một chỗ (minh họa nhật ký chỉnh sửa).
    var aiTasks = [
      { _id: 'task-d1', level: 'ho-tro', type: 'nhan-dien', van: 'an', prompt: 'Nghe cô đọc, chọn tiếng có vần an.', question: 'Tiếng nào có vần an?', options: ['bàn', 'chăn', 'cân'], answer: 'bàn', teacherNote: 'Đọc mẫu vần an hai lần.' },
      { _id: 'task-d2', level: 'tu-lam', type: 'hoan-thanh-cau', van: 'an', prompt: 'Chọn tiếng điền vào chỗ trống.', question: 'Bé đi ___ ở sân.', options: ['chơi', 'chăn', 'chân'], answer: 'chơi', teacherNote: '' },
      { _id: 'task-d3', level: 'van-dung', type: 'doc', van: 'an', prompt: 'Đọc to cho cô nghe.', question: 'Bạn Lan có khăn đỏ.', options: [], answer: '', teacherNote: 'Ghi lại tiếng em đọc sai.' }
    ];
    var aiOriginal = JSON.parse(JSON.stringify(aiTasks));
    aiOriginal[1].question = 'Bé đi ___ ở vườn.';
    s.library.push({
      id: 'lib-demo-ai', kind: 'bai-tap', title: 'Bài tập vần an', vans: ['an'], createdAt: now - 20 * DAY, approvedAt: now - 20 * DAY,
      minutes: 14, source: 'ai', content: { tasks: aiTasks }, aiOriginal: { tasks: aiOriginal },
      edits: [{ field: 'Nhiệm vụ 2, câu hỏi', before: 'Bé đi ___ ở vườn.', after: 'Bé đi ___ ở sân.' }], outsideStart: 1, outsideEnd: 0
    });

    // Gói 5 phút cùng con đã giao về nhà.
    s.library.push({
      id: 'lib-demo-home', kind: 'phu-huynh', title: '5 phút cùng con: vần an, ăn', vans: ['an', 'ăn'], createdAt: now - 9 * DAY, approvedAt: now - 9 * DAY,
      minutes: 6, source: 'mau', edits: [],
      content: {
        title: '5 phút cùng con: vần an, ăn',
        read3: ['Bố mẹ đọc mẫu vần an, ăn hai lần, con đọc theo.', 'Con đọc các tiếng dưới đây. Con đọc sai thì đọc mẫu lại, không chê.', 'Con đọc câu ngắn. Khen khi con tự đọc được.'],
        readWords: ['bàn', 'bạn', 'chăn', 'khăn', 'Bạn Lan có khăn đỏ.'],
        write2: 'Con viết 2 tiếng vào vở ô li, mỗi tiếng một dòng ngắn.',
        writeWords: ['bàn', 'khăn'],
        tips: ['Ngồi cạnh con, đọc chậm và rõ.', 'Chỉ luyện khoảng 5 phút, dừng khi con mệt.', 'Ghi lại tiếng con còn đọc sai để báo cô.'],
        phone: 'Cô gửi gói 5 phút luyện vần an, ăn. Bố mẹ đọc mẫu, con đọc theo: bàn, bạn, chăn, khăn. Sau đó con viết 2 tiếng: bàn, khăn. Bố mẹ ghi lại tiếng con còn đọc sai giúp cô nhé.'
      }
    });
    [['stu-1', 'da-lam', 'tu-lam'], ['stu-2', 'da-lam', 'lam-cung'], ['stu-4', 'chua-lam', ''], ['stu-6', 'da-lam', 'nhac-nho'], ['stu-7', 'da-giao', '']].forEach(function (h, i) {
      s.homework.push({ id: 'hw-demo-' + i, packId: 'lib-demo-home', studentId: h[0], sentAt: now - 8 * DAY, status: h[1], support: h[2], note: '', updatedAt: now - (h[1] === 'da-giao' ? 8 : 4) * DAY });
    });

    // Một em đã được giao bài.
    s.assignments['stu-1'] = { van: 'an', level: 'ho-tro', source: 'goi-y', date: now - DAY,
      reason: 'Giao theo gợi ý của bản đồ âm vần.' };
    return s;
  }

  function resetToEmpty(keepClass) {
    var cls = keepClass ? state.classInfo : null;
    var students = keepClass ? state.students : [];
    commit(function (s) {
      var fresh = emptyState();
      Object.keys(fresh).forEach(function (k) { s[k] = fresh[k]; });
      if (cls) { s.classInfo = Object.assign({}, cls, { name: cls.name.replace(' (mẫu)', '') }); s.students = students; }
      migrate(s);
    });
  }
  function resetToDemo() {
    var demo = buildDemo();
    commit(function (s) { Object.keys(demo).forEach(function (k) { s[k] = demo[k]; }); migrate(s); });
  }
  function importState(obj) {
    if (!obj || obj.version !== 1 || !Array.isArray(obj.students)) throw new Error('Tệp không đúng định dạng sao lưu của Vần vui AI.');
    commit(function (s) { var base = emptyState(); Object.keys(base).forEach(function (k) { s[k] = obj[k] !== undefined ? obj[k] : base[k]; }); migrate(s); });
  }

  function storageSize() { return lastSize; }

  VV.store = {
    load: load, save: save, whenSaved: function () { return writeChain; }, commit: commit, onChange: onChange, uid: uid,
    get state() { return state; },
    get settings() { return settings; },
    get saveFailed() { return saveFailed; },
    getApiKey: getApiKey, setApiKey: setApiKey,
    student: student, studentLabel: studentLabel, kho: kho,
    vanMap: vanMap, cellStatus: cellStatus, suggest: suggest, levelFor: levelFor, assignment: assignment,
    latestTest: latestTest, groupPrePost: groupPrePost, errorCounts: errorCounts,
    writingScore: writingScore, latestWriting: latestWriting, effortMinutes: effortMinutes,
    abForm: abForm, updateCurriculum: updateCurriculum, positionOf: positionOf, resetToEmpty: resetToEmpty, resetToDemo: resetToDemo, importState: importState,
    storageSize: storageSize, rng: rng, DAY: DAY
  };
})(window.VV = window.VV || {});

<script>
/* js/ai.js */
/* Kết nối AI bằng API key do giáo viên nhập. Gọi thẳng từ trình duyệt tới nhà cung cấp. */
(function (VV) {
  'use strict';
  var D = VV.data;

  var PROVIDERS = {
    anthropic: {
      label: 'Claude (Anthropic)',
      models: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'],
      defaultModel: 'claude-opus-5-5',
      keyHint: 'Bắt đầu bằng sk-ant-',
      keyUrl: 'https://console.anthropic.com/settings/keys'
    },
    openai: {
      label: 'OpenAI',
      models: ['gpt-4.1-mini', 'gpt-4.1', 'gpt-4o-mini'],
      defaultModel: 'gpt-4.1-mini',
      keyHint: 'Bắt đầu bằng sk-',
      keyUrl: 'https://platform.openai.com/api-keys'
    },
    gemini: {
      label: 'Google Gemini',
      models: ['gemini-2.5-flash', 'gemini-2.5-pro'],
      defaultModel: 'gemini-2.5-flash',
      keyHint: 'Lấy tại Google AI Studio',
      keyUrl: 'https://aistudio.google.com/app/apikey'
    },
    compatible: {
      label: 'Dịch vụ tương thích OpenAI',
      models: [],
      defaultModel: '',
      keyHint: 'Ví dụ OpenRouter, Groq, máy chủ nội bộ',
      keyUrl: ''
    }
  };

  function cfg() {
    var s = VV.store.settings.ai;
    return { provider: s.provider, model: s.model || PROVIDERS[s.provider].defaultModel, baseUrl: s.baseUrl, key: VV.store.getApiKey() };
  }
  function isReady() {
    var c = cfg();
    if (!c.key) return false;
    if (c.provider === 'compatible' && !c.baseUrl) return false;
    return !!c.model;
  }

  function httpError(status, bodyText) {
    var msg = '';
    try {
      var j = JSON.parse(bodyText);
      msg = (j.error && (j.error.message || j.error.type)) || j.message || '';
    } catch (e) { msg = (bodyText || '').slice(0, 200); }
    var hint = '';
    if (status === 401 || status === 403) hint = 'API key không đúng hoặc chưa được cấp quyền. Kiểm tra lại key trong Cài đặt.';
    else if (status === 404) hint = 'Không tìm thấy model hoặc địa chỉ. Kiểm tra tên model trong Cài đặt.';
    else if (status === 429) hint = 'Đã vượt giới hạn gọi hoặc hết hạn mức. Đợi một lúc rồi thử lại.';
    else if (status >= 500) hint = 'Máy chủ AI đang bận. Thử lại sau ít phút.';
    else hint = 'Yêu cầu bị từ chối.';
    var err = new Error(hint + (msg ? ' Chi tiết: ' + msg : ''));
    err.status = status;
    return err;
  }

  // Model Claude hỗ trợ tham số effort và cơ chế chuyển model dự phòng khi bị từ chối.
  function claudeFeatures(model) {
    var effort = /^claude-(opus|sonnet|haiku|fable)-5/.test(model);
    var fallback = /^claude-(opus-5|sonnet-5-5|fable-5)/.test(model);
    return { effort: effort, fallback: fallback };
  }

  function callAnthropic(c, system, user, signal, opts) {
    var f = claudeFeatures(c.model);
    var body = { model: c.model, max_tokens: opts.maxTokens || 16000, system: system, messages: [{ role: 'user', content: user }] };
    var headers = {
      'content-type': 'application/json',
      'x-api-key': c.key,
      'anthropic-version': '2026-10-21',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
    if (f.effort) body.output_config = { effort: opts.effort || 'medium' };
    if (f.fallback && !opts.noFallback) {
      body.fallbacks = 'default';
      headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
    }
    return fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: headers, body: JSON.stringify(body), signal: signal })
      .then(function (res) {
        return res.text().then(function (t) {
          if (!res.ok) {
            // Một số tài khoản chưa bật tính năng dự phòng: gửi lại không kèm tham số đó.
            if (res.status === 400 && /fallback|beta/i.test(t) && !opts.noFallback) {
              return callAnthropic(c, system, user, signal, Object.assign({}, opts, { noFallback: true }));
            }
            throw httpError(res.status, t);
          }
          var j = JSON.parse(t);
          if (j.stop_reason === 'refusal') throw new Error('AI từ chối yêu cầu này. Hãy diễn đạt lại yêu cầu cần đạt rồi thử lại.');
          if (j.stop_reason === 'max_tokens') throw new Error('Câu trả lời của AI bị cắt giữa chừng. Giảm số nhiệm vụ rồi thử lại.');
          return (j.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');
        });
      });
  }

  function callOpenAI(c, system, user, signal, opts) {
    var base = c.provider === 'compatible' ? c.baseUrl.replace(/\/+$/, '') : 'https://api.openai.com/v1';
    var body = { model: c.model, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] };
    if (c.provider === 'openai' && opts.json) body.response_format = { type: 'json_object' };
    return fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + c.key },
      body: JSON.stringify(body), signal: signal
    }).then(function (res) {
      return res.text().then(function (t) {
        if (!res.ok) throw httpError(res.status, t);
        var j = JSON.parse(t);
        var ch = j.choices && j.choices[0];
        if (!ch) throw new Error('AI không trả về nội dung.');
        if (ch.finish_reason === 'length') throw new Error('Câu trả lời của AI bị cắt giữa chừng. Giảm số nhiệm vụ rồi thử lại.');
        return ch.message && ch.message.content || '';
      });
    });
  }

  function callGemini(c, system, user, signal, opts) {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(c.model) + ':generateContent';
    var body = {
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: user }] }]
    };
    if (opts.json) body.generationConfig = { responseMimeType: 'application/json' };
    return fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': c.key },
      body: JSON.stringify(body), signal: signal
    }).then(function (res) {
      return res.text().then(function (t) {
        if (!res.ok) throw httpError(res.status, t);
        var j = JSON.parse(t);
        var cand = j.candidates && j.candidates[0];
        if (!cand) throw new Error('AI không trả về nội dung' + (j.promptFeedback && j.promptFeedback.blockReason ? ' (bị chặn: ' + j.promptFeedback.blockReason + ').' : '.'));
        return (cand.content && cand.content.parts || []).map(function (p) { return p.text || ''; }).join('');
      });
    });
  }

  function complete(system, user, opts) {
    opts = opts || {};
    var c = cfg();
    if (!c.key) return Promise.reject(new Error('Chưa có API key. Mở Cài đặt để nhập key.'));
    var p;
    if (c.provider === 'anthropic') p = callAnthropic(c, system, user, opts.signal, opts);
    else if (c.provider === 'gemini') p = callGemini(c, system, user, opts.signal, opts);
    else p = callOpenAI(c, system, user, opts.signal, opts);
    return p.catch(function (e) {
      if (e.name === 'AbortError') throw new Error('Đã dừng soạn.');
      if (e instanceof TypeError) throw new Error('Không kết nối được tới dịch vụ AI. Kiểm tra mạng, địa chỉ máy chủ, hoặc dịch vụ này không cho gọi trực tiếp từ trình duyệt.');
      throw e;
    });
  }

  function extractJSON(text) {
    var t = String(text || '').replace(/```json/gi, '```');
    var fence = t.match(/```([\s\S]*?)```/);
    if (fence) t = fence[1];
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a === -1 || b === -1) throw new Error('AI không trả về đúng định dạng. Bấm soạn lại.');
    try { return JSON.parse(t.slice(a, b + 1)); }
    catch (e) { throw new Error('AI trả về dữ liệu lỗi định dạng. Bấm soạn lại.'); }
  }

  function testConnection(signal) {
    return complete('Bạn là trợ lý kiểm tra kết nối.', 'Trả lời đúng một từ: OK', { signal: signal, maxTokens: 2000, effort: 'low' });
  }

  // ---------- Lời nhắc ----------
  function systemPrompt(allowedVans, extra, initials) {
    return [
      'Bạn là trợ lý soạn học liệu luyện đọc, viết tiếng Việt cho học sinh lớp 1 (khoảng 6 tuổi). Bạn chỉ soạn bản nháp; giáo viên là người kiểm tra và quyết định cuối cùng.',
      'Quy tắc bắt buộc:',
      '1. Chỉ dùng tiếng có vần nằm trong danh sách vần đã học: ' + allowedVans.join(', ') + '. ' +
        (initials ? 'Lớp đang học âm: chỉ dùng tiếng không có âm đầu hoặc có âm đầu trong danh sách: ' + initials.join(', ') + '.' : 'Âm đầu nào cũng được.') +
        ' Tiếng có vần khác danh sách là lỗi (ví dụ "vườn" có vần ươn, "hoa" có vần oa).',
      extra && extra.length ? '2. Được dùng thêm các tiếng giáo viên đã duyệt: ' + extra.join(', ') + '.' : '2. Không có tiếng bổ sung.',
      '3. Câu ngắn từ 3 đến 7 tiếng, nội dung gần gũi, an toàn, tích cực với trẻ. Không dùng tên thật của học sinh. Không chép nguyên văn sách giáo khoa.',
      '4. Viết đúng chính tả và dấu thanh; viết thường, chỉ viết hoa đầu câu và tên riêng.',
      '5. Không dùng emoji. Chỉ trả về một đối tượng JSON hợp lệ theo mẫu được yêu cầu, không thêm lời giải thích.'
    ].join('\n');
  }

  var TASK_TYPES = {
    'nhan-dien': 'Nhận diện vần',
    'ghep-tieng': 'Ghép tiếng',
    'chon-tu': 'Chọn từ đúng',
    'hoan-thanh-cau': 'Hoàn thành câu',
    'doc': 'Đọc',
    'viet': 'Viết'
  };

  function exercisesPrompt(p) {
    return [
      'Soạn bài tập luyện theo 3 mức độ cho: ' + p.vans.map(D.unitLabel).join(', ') + '.',
      'Yêu cầu cần đạt của bài: ' + (p.objective || '(không ghi)'),
      p.errors.length ? 'Lỗi học sinh hay gặp cần luyện: ' + p.errors.join(', ') + '.' : '',
      'Mỗi mức độ ' + p.perLevel + ' nhiệm vụ. Ba mức: "ho-tro" (có hỗ trợ: tô màu vần, ít lựa chọn, có nghe mẫu), "tu-lam" (tự thực hiện), "van-dung" (dùng tiếng trong từ, câu mới).',
      'Loại nhiệm vụ: "nhan-dien" (chọn tiếng có vần), "ghep-tieng" (âm đầu + vần + thanh), "chon-tu" (chọn từ viết đúng), "hoan-thanh-cau" (chọn tiếng điền vào chỗ trống ___), "doc" (đọc to cho giáo viên nghe), "viet" (viết vào vở ô li).',
      'Với nhan-dien, ghep-tieng, chon-tu, hoan-thanh-cau: có 3 lựa chọn, đúng một đáp án nằm trong lựa chọn. Với doc và viet: options là mảng rỗng, answer là chuỗi rỗng.',
      'Trả về JSON đúng mẫu:',
      '{"tasks":[{"level":"ho-tro","type":"nhan-dien","van":"an","prompt":"Lời giao việc ngắn cho học sinh","question":"Nội dung câu hỏi hoặc chữ cần đọc, viết","options":["bàn","bông","bé"],"answer":"bàn","teacherNote":"Gợi ý ngắn cho giáo viên"}]}'
    ].filter(Boolean).join('\n');
  }

  function storyPrompt(p) {
    return [
      'Viết một truyện rất ngắn ' + p.sentences + ' câu để luyện đọc: ' + p.vans.map(D.unitLabel).join(', ') + '. Chủ đề: ' + p.topic + '.',
      'Dùng nhiều tiếng có vần cần luyện. Thêm 2 câu hỏi đọc hiểu ngắn kèm câu trả lời mẫu.',
      'Trả về JSON đúng mẫu:',
      '{"title":"Tên truyện","story":"Câu 1. Câu 2. Câu 3.","questions":[{"q":"Câu hỏi?","a":"Câu trả lời."}]}'
    ].join('\n');
  }

  function parentPrompt(p) {
    return [
      'Soạn gói "5 phút cùng con" để phụ huynh luyện cùng con ở nhà: 3 phút đọc có người lớn hỗ trợ, 2 phút viết một nhiệm vụ ngắn.',
      'Âm, vần cần luyện: ' + p.vans.map(D.unitLabel).join(', ') + '. Lỗi con hay gặp: ' + (p.errors.length ? p.errors.join(', ') : 'chưa ghi') + '.',
      'Hướng dẫn dễ hiểu cho phụ huynh không có chuyên môn, giọng nhẹ nhàng, không so sánh với bạn khác, không chấm điểm.',
      'Các tiếng, câu để con đọc và viết phải theo quy tắc kho tiếng. Lời hướng dẫn cho phụ huynh thì không bị giới hạn.',
      'Trả về JSON đúng mẫu:',
      '{"title":"Tên gói","read3":["Bước 1","Bước 2","Bước 3"],"readWords":["tiếng hoặc câu để con đọc"],"write2":"Nhiệm vụ viết 2 phút","writeWords":["tiếng để con viết"],"tips":["Lời khuyên ngắn"],"phone":"Tin nhắn ngắn gửi phụ huynh qua điện thoại, tối đa 500 ký tự"}'
    ].join('\n');
  }

  function writingPrompt(p) {
    return [
      'Soạn phiếu luyện viết vào vở ô li cho học sinh lớp 1. Trọng tâm: ' + p.vans.map(D.unitLabel).join(', ') + '.',
      'Lỗi viết giáo viên đã ghi: ' + (p.errors.length ? p.errors.join(', ') : 'chưa ghi') + '.',
      'Gồm hướng dẫn ngắn cho học sinh (giáo viên đọc to), 5 tiếng hoặc từ để viết, và một lưu ý cho giáo viên khi chấm.',
      'Trả về JSON đúng mẫu:',
      '{"title":"Tên phiếu","guide":["Hướng dẫn 1","Hướng dẫn 2"],"words":["tiếng 1","tiếng 2","tiếng 3","tiếng 4","tiếng 5"],"teacherNote":"Lưu ý khi chấm"}'
    ].join('\n');
  }

  // ---------- Soạn từ mẫu (không dùng AI, chạy khi mất mạng) ----------
  function shuffle(arr, R) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(R() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function templateExercises(p) {
    var R = VV.store.rng(Date.now() % 100000);
    var out = { 'ho-tro': [], 'tu-lam': [], 'van-dung': [] };
    for (var k = 0; k < p.perLevel * p.vans.length && out['ho-tro'].length < p.perLevel; k++) {
      var van = p.vans[k % p.vans.length];
      var round = Math.floor(k / p.vans.length);
      var g = D.groupOfVan(van);
      var words = g.words[van];
      var w = words[(round * 2) % words.length];
      var parsed = VV.viet.parse(w);
      var cons = D.isConsonantUnit(van);
      var others = g.vans.filter(function (v) { return v !== van && D.isConsonantUnit(v) === cons; });
      // Tiếng nhiễu không được chứa âm, vần đang hỏi.
      var pool = [];
      g.vans.forEach(function (v) { if (v !== van) g.words[v].forEach(function (x) { if (!D.matches(x, van) && pool.indexOf(x) === -1) pool.push(x); }); });
      var d1 = pool[round % (pool.length || 1)] || 'bé', d2 = pool[(round + 3) % (pool.length || 1)] || 'bà';
      if (d2 === d1) d2 = pool[(round + 1) % (pool.length || 1)] || 'bà';
      var label = D.unitLabel(van);

      out['ho-tro'].push({
        level: 'ho-tro', type: 'nhan-dien', van: van,
        prompt: 'Nghe cô đọc, chọn tiếng có ' + label + '.',
        question: 'Tiếng nào có ' + label + '?',
        options: shuffle([w, d1, d2], R), answer: w,
        teacherNote: 'Đọc mẫu ' + label + ' trước khi cho học sinh chọn.'
      });

      var dis = VV.viet.toneDistractors(w, cons ? [] : others);
      out['tu-lam'].push({
        level: 'tu-lam', type: 'ghep-tieng', van: van,
        prompt: 'Ghép âm, vần và dấu thanh thành tiếng.',
        question: (parsed.initial || '(không có âm đầu)') + ' + ' + parsed.van + ' + ' + VV.viet.TONE_NAME[parsed.tone],
        options: shuffle([w].concat(dis), R),
        answer: w, teacherNote: 'Cho học sinh đọc to tiếng vừa ghép.'
      });

      var fills = g.fill.filter(function (f) { return D.matches(f.answer, van); });
      if ((k % 2 === 0 || !fills.length) && g.fill.length) {
        var f = fills[round % (fills.length || 1)] || g.fill[round % g.fill.length];
        out['van-dung'].push({
          level: 'van-dung', type: 'hoan-thanh-cau', van: D.unitOf(g, f.answer) || van,
          prompt: 'Chọn tiếng điền vào chỗ trống rồi đọc cả câu.',
          question: f.text, options: shuffle(f.options, R), answer: f.answer,
          teacherNote: 'Hỏi học sinh vì sao chọn tiếng đó.'
        });
      } else {
        var phrase = g.phrases.filter(function (ph) {
          return ph.split(' ').some(function (x) { return D.matches(x, van); });
        })[0] || w;
        out['van-dung'].push({
          level: 'van-dung', type: 'viet', van: van, prompt: 'Viết vào vở ô li.',
          question: phrase, options: [], answer: '',
          teacherNote: 'Chấm theo tiêu chí: hình chữ, vị trí dấu thanh, khoảng cách.'
        });
      }
    }
    return { tasks: out['ho-tro'].concat(out['tu-lam'], out['van-dung']) };
  }

  function templateStory(p) {
    var lines = [];
    var vans = p.vans;
    D.GROUPS.forEach(function (g) {
      if (g.vans.some(function (v) { return vans.indexOf(v) !== -1; })) lines = lines.concat(g.sentences);
    });
    lines = lines.slice(0, p.sentences);
    return {
      title: 'Truyện ghép từ câu mẫu',
      story: lines.join(' '),
      questions: [{ q: 'Trong truyện có những ai?', a: 'Học sinh trả lời theo truyện.' }, { q: 'Em thích câu nào nhất?', a: 'Học sinh đọc lại câu mình thích.' }]
    };
  }

  function templateParent(p) {
    var g = D.groupOfVan(p.vans[0]) || D.GROUPS[0];
    var words = g.words[p.vans[0]] || [];
    return {
      title: '5 phút cùng con: vần ' + p.vans.join(', '),
      read3: [
        'Đọc mẫu vần ' + p.vans[0] + ' hai lần, con đọc theo.',
        'Con đọc các tiếng dưới đây. Con đọc sai thì bố mẹ đọc mẫu lại, không chê.',
        'Con đọc câu ngắn. Khen khi con tự đọc được.'

      readWords: words.slice(0, 4).concat(g.sentences.slice(0, 1)),
      write2: 'Con viết 2 tiếng vào vở ô li, mỗi tiếng một dòng ngắn.',
      writeWords: words.slice(0, 2),
      tips: ['Ngồi cạnh con, đọc chậm và rõ.', 'Chỉ luyện khoảng 5 phút, dừng khi con mệt.', 'Ghi lại tiếng con còn đọc sai để báo cô.'],
      phone: 'Cô gửi gói 5 phút luyện vần ' + p.vans.join(', ') + '. Bố mẹ đọc mẫu, con đọc theo các tiếng: ' + words.slice(0, 4).join(', ') + '. Sau đó con viết 2 tiếng: ' + words.slice(0, 2).join(', ') + '. Bố mẹ ghi lại tiếng con còn đọc sai giúp cô nhé.'
    };
  }

  function templateWriting(p) {
    var words = [];
    p.vans.forEach(function (v) { var g = D.groupOfVan(v); if (g) words = words.concat(g.words[v].slice(0, 3)); });
    return {
      title: 'Phiếu luyện viết vần ' + p.vans.join(', '),
      guide: ['Ngồi thẳng lưng, cầm bút đúng cách.', 'Viết vần trước, rồi viết tiếng.', 'Đặt dấu thanh trên hoặc dưới con chữ chính của vần.'],
      words: words.slice(0, 5),
      teacherNote: 'Chú ý độ cao con chữ và khoảng cách giữa các tiếng.'
    };
  }

  // ---------- Chuẩn hóa kết quả ----------
  function normExercises(j) {
    var tasks = Array.isArray(j.tasks) ? j.tasks : [];
    if (!tasks.length && Array.isArray(j.levels)) {
      j.levels.forEach(function (lv) { (lv.tasks || []).forEach(function (t) { t.level = t.level || lv.level; tasks.push(t); }); });
    }
    return {
      tasks: tasks.map(function (t) {
        var level = ['ho-tro', 'tu-lam', 'van-dung'].indexOf(t.level) !== -1 ? t.level : 'tu-lam';
        var type = TASK_TYPES[t.type] ? t.type : 'doc';
        var options = Array.isArray(t.options) ? t.options.map(String).slice(0, 4) : [];
        return {
          level: level, type: type, van: String(t.van || ''),
          prompt: String(t.prompt || ''), question: String(t.question || ''),
          options: options, answer: String(t.answer || ''), teacherNote: String(t.teacherNote || '')
        };
      }).filter(function (t) { return t.question || t.prompt; })
    };
  }
  function normStory(j) {
    return {
      title: String(j.title || 'Truyện luyện vần'),
      story: String(j.story || ''),
      questions: (Array.isArray(j.questions) ? j.questions : []).map(function (q) { return { q: String(q.q || ''), a: String(q.a || '') }; })
    };
  }
  function strList(x) { return (Array.isArray(x) ? x : []).map(String).filter(Boolean); }
  function normParent(j) {
    return {
      title: String(j.title || '5 phút cùng con'), read3: strList(j.read3), readWords: strList(j.readWords),
      write2: String(j.write2 || ''), writeWords: strList(j.writeWords), tips: strList(j.tips), phone: String(j.phone || '')
    };
  }
  function normWriting(j) {
    return { title: String(j.title || 'Phiếu luyện viết'), guide: strList(j.guide), words: strList(j.words), teacherNote: String(j.teacherNote || '') };
  }

  var TOOLS = {
    exercises: { prompt: exercisesPrompt, template: templateExercises, norm: normExercises, maxTokens: 16000 },
    story: { prompt: storyPrompt, template: templateStory, norm: normStory, maxTokens: 8000 },
    parent: { prompt: parentPrompt, template: templateParent, norm: normParent, maxTokens: 8000 },
    writing: { prompt: writingPrompt, template: templateWriting, norm: normWriting, maxTokens: 8000 }
  };

  // Soạn bản nháp. useAI=false dùng mẫu có sẵn.
  function draft(tool, params, useAI, signal) {
    var t = TOOLS[tool];
    if (!useAI) return Promise.resolve({ data: t.norm(t.template(params)), source: 'mau' });
    var k = VV.store.kho();
    var sys = systemPrompt(Array.from(k.vans), Array.from(k.extra), k.initials ? Array.from(k.initials) : null);
    return complete(sys, t.prompt(params), { signal: signal, json: true, maxTokens: t.maxTokens })
      .then(function (text) { return { data: t.norm(extractJSON(text)), source: 'ai' }; });
  }

  VV.ai = {
    PROVIDERS: PROVIDERS, TASK_TYPES: TASK_TYPES,
    isReady: isReady, cfg: cfg, complete: complete, testConnection: testConnection, draft: draft, extractJSON: extractJSON
  };
})(window.VV = window.VV || {});

    dlg.innerHTML = '<div class="dialog-inner">' + html + '</div>';
    dlg.setAttribute('aria-labelledby', 'dialog-title');
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    var first = dlg.querySelector('[autofocus]') || dlg.querySelector('input, select, textarea, button');
    if (first) first.focus();
    if (opts.onMount) opts.onMount(dlg);
    return dlg;
  }
  function closeDialog() {
    var dlg = document.getElementById('dialog');
    if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
    dlg.innerHTML = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function confirmDialog(message, okLabel, danger) {
    return new Promise(function (resolve) {
      openDialog(
        '<h2 id="dialog-title" class="dialog-title">' + esc(message.title || 'Xác nhận') + '</h2>' +
        '<p>' + esc(message.body || message) + '</p>' +
        '<div class="dialog-actions">' +
        '<button type="button" class="btn" data-dlg="cancel">Hủy</button>' +
        '<button type="button" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-dlg="ok" autofocus>' + esc(okLabel || 'Đồng ý') + '</button>' +
        '</div>',
        {
          onMount: function (dlg) {
            dlg.onclick = function (e) {
              var b = e.target.closest('[data-dlg]');
              if (!b) return;
              closeDialog(); resolve(b.getAttribute('data-dlg') === 'ok');
            };
            dlg.oncancel = function () { resolve(false); };
          }
        }
      );
    });
  }

  // ---------- Giọng đọc ----------
  var viVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    var voices = window.speechSynthesis.getVoices() || [];
    var pref = VV.store && VV.store.settings && VV.store.settings.voice.name;
    var vi = voices.filter(function (v) { return /^vi/i.test(v.lang); });
    viVoice = vi.filter(function (v) { return v.name === pref; })[0] || vi[0] || null;
    return viVoice;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = function () { pickVoice(); document.dispatchEvent(new Event('vv-voices')); };
  }
  function viVoices() {
    if (!('speechSynthesis' in window)) return [];
    return (window.speechSynthesis.getVoices() || []).filter(function (v) { return /^vi/i.test(v.lang); });
  }
  function canSpeak() { return !!pickVoice(); }
  function speak(text) {
    if (!('speechSynthesis' in window)) { toast('Trình duyệt này không có chức năng đọc.', 'error'); return; }
    var v = pickVoice();
    if (!v) { toast('Máy chưa có giọng đọc tiếng Việt. Giáo viên đọc mẫu giúp em nhé.', 'error'); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang;
    u.rate = (VV.store.settings.voice.rate || 0.85);
    window.speechSynthesis.speak(u);
  }
  function speakBtn(text, label, cls) {
    return '<button type="button" class="btn-icon ' + (cls || '') + '" data-speak="' + esc(text) + '" aria-label="' + esc(label || ('Nghe: ' + text)) + '" title="' + esc(label || 'Nghe đọc mẫu') + '">' + icon('volume') + '</button>';
  }

  // ---------- Chữ: tô vần, kiểm tra kho ----------
  // Tô màu phần cần chú ý trong tiếng: âm đầu (với bài âm) hoặc vần (với bài vần).
  function vanWord(word, van) {
    var p = VV.viet.parse(word);
    if (!p) return esc(word);
    if (van && VV.data.isConsonantUnit(van)) {
      if (p.initial !== van) return esc(word);
      return '<span class="hl-van">' + esc(word.slice(0, van.length)) + '</span>' + esc(word.slice(van.length));
    }
    if (van && p.van !== van) return esc(word);
    var parts = VV.viet.splitForHighlight(word);
    return esc(parts[0]) + '<span class="hl-van">' + esc(parts[1]) + '</span>';
  }
  // Tô các tiếng mang âm hoặc vần trong danh sách.
  function vanText(text, vans) {
    return VV.viet.tokenize(text).map(function (t) {
      if (!t.isWord) return esc(t.text);
      for (var i = 0; i < vans.length; i++) if (VV.data.matches(t.text, vans[i])) return vanWord(t.text, vans[i]);
      return esc(t.text);
    }).join('');
  }

  // Ô chọn nhóm, chia theo giai đoạn. maxId: chỉ hiện nhóm tới vị trí này (bỏ trống là tất cả).
  function groupSelect(id, name, selected, maxId, label) {
    var D = VV.data;
    var progress = VV.store.state.classInfo.progress;
    return '<select id="' + esc(id) + '" name="' + esc(name) + '"' + (label ? ' aria-label="' + esc(label) + '"' : '') + '>' +
      D.STAGES.map(function (st) {
        var gs = D.GROUPS.filter(function (g) { return g.stage === st.id && (!maxId || g.id <= maxId); });
        if (!gs.length) return '';
        return '<optgroup label="' + esc(st.label) + '">' + gs.map(function (g) {
          return '<option value="' + g.id + '"' + (g.id === selected ? ' selected' : '') + '>Nhóm ' + g.id + ': ' + esc(g.title) +
            (g.id === progress ? ' (đang học)' : g.id > progress ? ' (chưa học)' : '') + '</option>';
        }).join('') + '</optgroup>';
      }).join('') + '</select>';
  }
  // Đánh dấu tiếng ngoài kho.
  function khoText(text) {
    var r = VV.viet.checkText(text, VV.store.kho());
    var html = r.tokens.map(function (t) {
      if (!t.isWord) return esc(t.text);
      if (t.ok) return esc(t.text);
      return '<mark class="ngoai-kho" title="Chưa có trong kho tiếng">' + esc(t.text) + '</mark>';
    }).join('');
    return { html: html, outside: r.outside };
  }

  // ---------- Tiện ích ----------
  var DATE_FMT = new Intl.DateTimeFormat('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
  var SHORT_FMT = new Intl.DateTimeFormat('vi-VN', { day: '2-digit', month: '2-digit' });
  var PCT_FMT = new Intl.NumberFormat('vi-VN', { style: 'percent', maximumFractionDigits: 0 });
  var DEC_FMT = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 1 });
  function fmtDate(ts) { return DATE_FMT.format(new Date(ts)); }
  // Ngày tháng dạng 19/10, lấy từng phần từ Intl để đúng múi giờ và lịch của máy.
  function fmtShort(ts) {
    var parts = SHORT_FMT.formatToParts(new Date(ts));
    var d = '', m = '';
    parts.forEach(function (p) { if (p.type === 'day') d = p.value; if (p.type === 'month') m = p.value; });
    return d + '/' + m;
  }
  function pct(r) { return r == null ? '–' : PCT_FMT.format(r); }
  function dec(n) { return n == null ? '–' : DEC_FMT.format(n); }

  function download(filename, content, mime) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function csv(rows) {
    return '﻿' + rows.map(function (r) {
      return r.map(function (c) {
        var s = String(c == null ? '' : c);
        return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
  }

  function printHTML(html, title) {
    var root = document.getElementById('print-root');
    root.innerHTML = '<div class="print-doc"><header class="print-head"><span class="print-brand">Vần vui AI</span><span>' + esc(title || '') + '</span></header>' + html + '</div>';
    var prevTitle = document.title;
    if (title) document.title = title;
    document.body.classList.add('is-printing');
    setTimeout(function () {
      window.print();
      document.body.classList.remove('is-printing');
      document.title = prevTitle;
    }, 60);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { toast('Đã sao chép.'); }, function () { toast('Không sao chép được. Hãy bôi đen và sao chép thủ công.', 'error'); });
    }
    toast('Không sao chép được. Hãy bôi đen và sao chép thủ công.', 'error');
    return Promise.resolve();
  }

  // Ảnh bài viết: thu nhỏ để không làm đầy bộ nhớ trình duyệt.
  function readImage(file, maxSide) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error('Chỉ nhận tệp ảnh.')); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var s = Math.min(1, (maxSide || 900) / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve({ url: c.toDataURL('image/jpeg', 0.62), w: c.width, h: c.height });
        };
        img.onerror = function () { reject(new Error('Không đọc được ảnh.')); };
        img.src = reader.result;
      };
      reader.onerror = function () { reject(new Error('Không đọc được tệp.')); };
      reader.readAsDataURL(file);
    });
  }

  function reducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  // Thanh lựa chọn dạng nút (radiogroup).
  function segmented(name, options, value, label) {
    return '<div class="segmented" role="radiogroup" aria-label="' + esc(label) + '">' +
      options.map(function (o) {
        var id = name + '-' + o.id;
        return '<input type="radio" id="' + esc(id) + '" name="' + esc(name) + '" value="' + esc(o.id) + '"' + (o.id === value ? ' checked' : '') + '>' +
          '<label for="' + esc(id) + '">' + esc(o.label) + '</label>';
      }).join('') + '</div>';
  }

  function studentOptions(selected, includeNone) {
    var st = VV.store.state.students;
    return (includeNone ? '<option value="">' + esc(includeNone) + '</option>' : '') +
      st.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.code) + (s.note ? ' (' + esc(s.note) + ')' : '') + '</option>'; }).join('');
  }

  function emptyState(title, body, actionHtml) {
    return '<div class="empty"><p class="empty-title">' + esc(title) + '</p>' + (body ? '<p>' + esc(body) + '</p>' : '') + (actionHtml || '') + '</div>';
  }

  // Một lần bấm vào nút nghe ở bất kỳ đâu.
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-speak]');
    if (b) { e.preventDefault(); speak(b.getAttribute('data-speak')); }
  });

  VV.ui = {
    esc: esc, icon: icon, toast: toast, openDialog: openDialog, closeDialog: closeDialog, confirmDialog: confirmDialog,
    speak: speak, speakBtn: speakBtn, canSpeak: canSpeak, viVoices: viVoices,
    vanWord: vanWord, vanText: vanText, khoText: khoText, groupSelect: groupSelect,
    fmtDate: fmtDate, fmtShort: fmtShort, pct: pct, dec: dec, download: download, csv: csv, printHTML: printHTML, copyText: copyText,
    readImage: readImage, reducedMotion: reducedMotion, segmented: segmented, studentOptions: studentOptions, emptyState: emptyState
  };
})(window.VV = window.VV || {});

</script>
<script>
/* js/app.js */
/* Khung ứng dụng: điều hướng, thanh bên, phân phối sự kiện cho từng màn hình. */
(function (VV) {
  'use strict';
  var ui = VV.ui;
  VV.views = VV.views || {};

  var NAV = [
    { route: 'ban-do', label: 'Bản đồ âm vần', icon: 'map' },
    { route: 'bai-hoc', label: 'Bài học số', icon: 'book' },
    { route: 'tro-choi', label: 'Trò chơi', icon: 'puzzle' },
    { route: 'tro-ly', label: 'Trợ lý soạn bài', icon: 'pen' },
    { route: 'danh-gia', label: 'Đánh giá', icon: 'clipboard' },
    { route: 'bao-cao', label: 'Báo cáo tiến bộ', icon: 'chart' },
    { route: 'huong-dan', label: 'Hướng dẫn', icon: 'help' },
    { route: 'cai-dat', label: 'Cài đặt', icon: 'gear' }
  ];

  var current = { route: null, params: [], view: null };
  var main;

  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean).map(decodeURIComponent);
    var route = parts[0] || 'ban-do';
    if (!VV.views[route]) route = 'ban-do';
    return { route: route, params: parts.slice(1) };
  }

  function go(path) {
    var target = '#/' + path;
    if (location.hash === target) render(); else location.hash = target;
  }

  function aiStatusHTML() {
    var ready = VV.ai.isReady();
    var c = VV.ai.cfg();
    var name = VV.ai.PROVIDERS[c.provider] ? VV.ai.PROVIDERS[c.provider].label : c.provider;
    return '<a class="ai-status ' + (ready ? 'is-ready' : '') + '" href="#/cai-dat/ai">' +
      '<span class="ai-dot" aria-hidden="true"></span>' +
      '<span><span class="ai-status-title">' + (ready ? 'AI đã kết nối' : 'AI chưa kết nối') + '</span>' +
      '<span class="ai-status-sub">' + (ready ? ui.esc(name) : 'Nhập API key trong Cài đặt') + '</span></span></a>';
  }

  function renderNav() {
    var nav = document.getElementById('nav');
    var st = VV.store.state;
    nav.innerHTML =
      '<div class="brand"><span class="brand-name" translate="no">Vần vui <span class="brand-ai">AI</span></span>' +
      '<span class="brand-class">' + ui.esc(st.classInfo.name) + '</span></div>' +
      '<nav aria-label="Chức năng chính"><ul class="nav-list">' +
      NAV.map(function (n) {
        var active = current.route === n.route;
        return '<li><a class="nav-link' + (active ? ' is-active' : '') + '" href="#/' + n.route + '"' + (active ? ' aria-current="page"' : '') + '>' +
          ui.icon(n.icon) + '<span>' + ui.esc(n.label) + '</span></a></li>';
      }).join('') +
      '</ul></nav>' +
      '<button type="button" class="btn btn-student" data-global="student">' + ui.icon('play') + '<span>Mở góc luyện tập</span></button>' +
      aiStatusHTML();
  }

  function render() {
    var h = parseHash();
    var view = VV.views[h.route];
    var changedRoute = current.route !== h.route;
    current = { route: h.route, params: h.params, view: view };
    document.body.classList.remove('nav-open');
    renderNav();
    var titles = NAV.filter(function (n) { return n.route === h.route; });
    document.title = (titles[0] ? titles[0].label + ' | ' : '') + 'Vần vui AI';
    main.innerHTML = '';
    view.render(main, h.params);
    if (changedRoute) {
      window.scrollTo(0, 0);
      var h1 = main.querySelector('h1');
      if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
    }
  }

  // Vẽ lại màn hình hiện tại mà vẫn giữ vị trí cuộn.
  function refresh() {
    current.params = parseHash().params;
    var y = window.scrollY;
    var active = document.activeElement && document.activeElement.id;
    renderNav();
    main.innerHTML = '';
    current.view.render(main, current.params);
    window.scrollTo(0, y);
    if (active) { var el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
  }

  function dispatch(type, e) {
    var v = current.view;
    if (!v) return;
    var handlerMap = type === 'click' ? v.act : v['on' + type];
    if (type === 'click') {
      var el = e.target.closest('[data-act]');
      if (el && main.contains(el) && handlerMap && handlerMap[el.getAttribute('data-act')]) {
        handlerMap[el.getAttribute('data-act')](el, e);
      }
    } else if (typeof handlerMap === 'function') {
      handlerMap(e);
    }
  }

  function init() {
    VV.store.load().then(start, function () { start(); });
  }
  function start() {
    main = document.getElementById('main');
    ['click'].forEach(function (t) { main.addEventListener(t, function (e) { dispatch('click', e); }); });
    main.addEventListener('change', function (e) { dispatch('change', e); });
    main.addEventListener('input', function (e) { dispatch('input', e); });
    main.addEventListener('submit', function (e) { dispatch('submit', e); });

    document.addEventListener('click', function (e) {
      var g = e.target.closest('[data-global]');
      if (!g) return;
      var what = g.getAttribute('data-global');
      if (what === 'student') VV.studentMode.open({});
      if (what === 'menu') {
        var open = document.body.classList.toggle('nav-open');
        var mb = document.querySelector('.topbar [data-global="menu"]');
        if (mb) { mb.setAttribute('aria-expanded', open); mb.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu'); }
      }
      if (what === 'close-dialog') ui.closeDialog();
      if (what === 'compose-writing') {
        // Từ hồ sơ bài viết: mở phiếu luyện viết, điền sẵn vần đang học và tiêu chí còn yếu.
        var grp = VV.data.GROUPS[VV.store.state.classInfo.progress - 1];
        var crit = g.getAttribute('data-crit');
        VV.assistant.prefill('writing', { vans: grp.vans.slice(), errors: crit ? [crit + ' chưa đúng'] : [] });
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('nav-open')) document.body.classList.remove('nav-open');
      var v = current.view;
      if (v && v.onkey && !document.getElementById('student-mode').classList.contains('is-open')) v.onkey(e);
    });
    window.addEventListener('hashchange', render);
    // Cảnh báo khi rời trang mà phiếu đang chấm hoặc bản nháp chưa duyệt.
    window.addEventListener('beforeunload', function (e) {
      var dirty = (VV.assess && VV.assess.isDirty()) || (VV.assistant && VV.assistant.isDirty());
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });
    var dlg = document.getElementById('dialog');
    dlg.addEventListener('close', function () { dlg.innerHTML = ''; });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) ui.closeDialog(); });

    if (VV.store.saveFailed) ui.toast('Trình duyệt đang chặn lưu dữ liệu. Kết quả sẽ mất khi đóng trang.', 'error');
    render();
  }

  VV.app = { go: go, render: render, refresh: refresh, renderNav: renderNav, get route() { return current.route; } };
  document.addEventListener('DOMContentLoaded', init);
})(window.VV = window.VV || {});

</script>
<script>
/* js/view-map.js */
/* Màn hình Bản đồ âm vần: hồ sơ từng em, gợi ý bài luyện có lý do, so sánh hai hồ sơ. */
(function (VV) {
  'use strict';
  var ui = VV.ui, D = VV.data, S = VV.store;

  var view = { selected: null, compare: false, second: null, openStages: {} };

  var STATUS_LABEL = { 'can-luyen': 'Cần luyện', 'dang-len': 'Đang lên', 'vung': 'Vững', 'chua-do': 'Chưa đo' };

  function dots(cell) {
    var out = '';
    for (var i = 0; i < 6; i++) {
      var cls = i < cell.read.correct ? 'is-ok' : (i < cell.read.total ? 'is-miss' : '');
      out += '<span class="dot ' + cls + '"></span>';
    }
    return '<span class="dots" aria-hidden="true">' + out + '</span>';
  }

  function tile(cell, learned) {
    var status = S.cellStatus(cell);
    var score = cell.read.total ? cell.read.correct + '/' + cell.read.total : '–';
    var aria = D.unitLabel(cell.van).replace(/^./, function (c) { return c.toUpperCase(); }) + ': ' + (cell.read.total ? cell.read.correct + ' trên ' + cell.read.total + ' tiếng đọc đúng' : 'chưa đo') + (learned ? '' : ', chưa học');
    var game = cell.game.total ? '<span class="van-game">chọn đúng ' + cell.game.correct + '/' + cell.game.total + '</span>' : '';
    return '<button type="button" class="van-tile is-' + status + (learned ? '' : ' is-future') + '" data-act="detail" data-van="' + ui.esc(cell.van) + '" aria-label="' + ui.esc(aria) + '">' +
      '<span class="van-glyph">' + ui.esc(cell.van) + '</span>' +
      '<span class="van-score">' + score + '</span>' + dots(cell) + game + '</button>';
  }

  function profileHTML(studentId) {
    var map = S.vanMap(studentId);
    var progress = S.state.classInfo.progress;
    var sug = S.suggest(studentId);
    var asg = S.assignment(studentId);
    // Chỉ hiện nhóm đã học, gom theo giai đoạn. Giai đoạn đã vững hết thì thu gọn.
    function row(g) {
      return '<div class="map-row">' +
        '<span class="map-row-label">Nhóm ' + g.id + '</span>' +
        '<div class="map-tiles">' + g.vans.map(function (v) { return tile(map[v], true); }).join('') + '</div></div>';
    }
    var groups = D.STAGES.map(function (st) {
      var gs = D.GROUPS.filter(function (g) { return g.stage === st.id && g.id <= progress; });
      if (!gs.length) return '';
      var units = [];
      gs.forEach(function (g) { units = units.concat(g.vans); });
      var count = { 'can-luyen': 0, 'dang-len': 0, 'vung': 0, 'chua-do': 0 };
      units.forEach(function (u) { count[S.cellStatus(map[u])]++; });
      var hasCurrent = gs[gs.length - 1].id === progress;
      var open = hasCurrent || count['can-luyen'] > 0 || view.openStages[st.id];
      var summary = units.length + ' ' + (st.id === 'am' ? 'âm' : 'vần') +
        (count['can-luyen'] ? ', ' + count['can-luyen'] + ' cần luyện' : '') +
        (count['dang-len'] ? ', ' + count['dang-len'] + ' đang lên' : '') +
        (count.vung ? ', ' + count.vung + ' vững' : '') + (count['chua-do'] ? ', ' + count['chua-do'] + ' chưa đo' : '');
      return '<details class="map-stage" data-stage="' + st.id + '"' + (open ? ' open' : '') + '><summary><span class="map-stage-name">' + ui.esc(st.label) + '</span>' +
        '<span class="map-stage-sum">' + summary + '</span></summary>' + gs.map(row).join('') + '</details>';
    }).join('');
    var left = D.GROUPS.length - progress;
    if (left > 0) groups += '<p class="sheet-note">Còn ' + left + ' nhóm lớp chưa học. Đổi bài đang học ở trang Bài học số.</p>';

    var asgHTML = asg
      ? '<p class="assigned">' + ui.icon('check') + '<span>Đang giao: ' + D.unitWord(asg.van) + ' <b class="glyph-inline">' + ui.esc(asg.van) + '</b>, mức ' +
        ui.esc(D.label(D.LEVELS, asg.level).toLowerCase()) + ' (' + (asg.source === 'goi-y' ? 'theo gợi ý' : 'giáo viên chọn') + ', ' + ui.fmtShort(asg.date) + ').</span>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-act="unassign" data-student="' + studentId + '">Bỏ giao</button></p>'
      : '<p class="assigned is-none">Chưa giao bài cho em này.</p>';

    return '<article class="profile" aria-label="Hồ sơ ' + ui.esc(S.studentLabel(studentId)) + '">' +
      '<div class="oli-sheet">' +
      '<div class="sheet-head"><h2 class="sheet-title">Hồ sơ luyện đọc <span class="code-tag">' + ui.esc(S.studentLabel(studentId)) + '</span></h2>' +
      '<ul class="legend" aria-label="Chú thích màu">' +
      ['can-luyen', 'dang-len', 'vung', 'chua-do'].map(function (k) { return '<li><span class="swatch is-' + k + '"></span>' + STATUS_LABEL[k] + '</li>'; }).join('') +
      '</ul></div>' + groups +
      '<p class="sheet-note">Số trên mỗi ô là số tiếng đọc đúng trong tối đa 6 lần đọc gần nhất do giáo viên nghe và ghi. Dòng "chọn đúng" là kết quả trò chơi nhận diện, không thay cho việc nghe em đọc.</p>' +
      '</div>' +
      '<aside class="suggest" aria-label="Gợi ý luyện tiếp">' +
      '<h3 class="suggest-title">Gợi ý luyện tiếp</h3>' +
      '<p class="suggest-pick"><span class="suggest-van">' + ui.esc(sug.van) + '</span><span class="level-tag level-' + sug.level + '">' + ui.esc(D.label(D.LEVELS, sug.level)) + '</span></p>' +
      '<p class="suggest-reason">' + ui.esc(sug.reason) + '</p>' +
      '<div class="btn-row">' +
      '<button type="button" class="btn btn-primary" data-act="assign" data-student="' + studentId + '" data-van="' + ui.esc(sug.van) + '" data-level="' + sug.level + '">Giao bài này</button>' +
      '<button type="button" class="btn" data-act="change" data-student="' + studentId + '">Đổi bài</button>' +
      '<button type="button" class="btn btn-ghost" data-act="preview" data-van="' + ui.esc((asg || sug).van) + '" data-level="' + (asg || sug).level + '">' + ui.icon('eye') + 'Xem bài luyện</button>' +
      '<button type="button" class="btn btn-ghost" data-act="compose" data-van="' + ui.esc(sug.van) + '" data-error="' + ui.esc(sug.topError || '') + '">' + ui.icon('pen') + 'Soạn bài cho em này</button>' +
      '</div>' + asgHTML + '</aside></article>';
  }

  function recentHTML(studentId) {
    var recs = S.state.records.filter(function (r) { return r.studentId === studentId && r.skill === 'doc'; })
      .sort(function (a, b) { return b.date - a.date; }).slice(0, 8);
    if (!recs.length) return '';
    return '<section class="panel"><h2 class="panel-title">Lần đọc gần đây của ' + ui.esc(S.studentLabel(studentId)) + '</h2>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Ngày</th><th scope="col">Tiếng</th><th scope="col">Vần</th><th scope="col">Kết quả</th><th scope="col">Lỗi</th><th scope="col">Nguồn</th></tr></thead><tbody>' +
      recs.map(function (r) {
        return '<tr><td class="tnum">' + ui.fmtShort(r.date) + '</td><td class="reading">' + ui.vanWord(r.tieng, r.van) + '</td><td>' + ui.esc(r.van) + '</td>' +
          '<td>' + (r.correct ? '<span class="pill pill-ok">Đúng</span>' : '<span class="pill pill-miss">Chưa đúng</span>') + '</td>' +
          '<td>' + (r.error ? ui.esc(D.label(D.READ_ERRORS, r.error)) : '') + '</td>' +
          '<td>' + ({ phieu: 'Phiếu đọc nhanh', 'bai-do': 'Bài đo A/B', 'luyen': 'Góc luyện tập' }[r.source] || r.source) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';
  }

  function render(root, params) {
    var st = S.state;
    if (params && params[0] && S.student(params[0])) view.selected = params[0];
    if (!st.students.length) {
      root.innerHTML = '<section class="page"><header class="page-head"><div><h1>Bản đồ âm vần</h1></div></header>' +
        ui.emptyState('Lớp chưa có học sinh', 'Thêm mã học sinh trong Cài đặt để bắt đầu ghi kết quả đọc.', '<a class="btn btn-primary" href="#/cai-dat/lop">Thêm học sinh</a>') + '</section>';
      return;
    }
    if (!view.selected || !S.student(view.selected)) view.selected = st.students[0].id;
    if (!view.second || !S.student(view.second) || view.second === view.selected) {
      view.second = (st.students.filter(function (s) { return s.id !== view.selected; })[0] || {}).id;
    }
    var g = D.GROUPS[st.classInfo.progress - 1];

    var picker = function (name, value, label) {
      return '<div class="student-picker" role="radiogroup" aria-label="' + label + '">' +
        st.students.map(function (s) {
          var id = name + '-' + s.id;
          var hasAsg = !!st.assignments[s.id];
          return '<input type="radio" name="' + name + '" id="' + id + '" value="' + s.id + '"' + (s.id === value ? ' checked' : '') + '>' +
            '<label for="' + id + '">' + ui.esc(s.code) + (hasAsg ? '<span class="asg-dot" title="Đã giao bài"></span>' : '') + '</label>';
        }).join('') + '</div>';
    };

    root.innerHTML = '<section class="page">' +
      '<header class="page-head"><div><h1>Bản đồ âm vần</h1>' +
      '<p class="lede">' + ui.esc(st.classInfo.name) + ' đang học nhóm ' + g.id + ' (' + ui.esc(g.title) + '). Chọn một em để xem âm, vần cần luyện và bài gợi ý.</p></div>' +
      '<label class="switch"><input type="checkbox" data-role="compare"' + (view.compare ? ' checked' : '') + '><span>So sánh hai hồ sơ</span></label></header>' +
      (st.isDemo ? '<div class="banner">Đây là dữ liệu mẫu của 8 học sinh giả lập để xem thử. <a href="#/cai-dat/du-lieu">Xóa dữ liệu mẫu</a> khi bắt đầu dùng với lớp của bạn.</div>' : '') +
      (view.compare
        ? '<div class="compare-grid"><div>' + picker('stuA', view.selected, 'Hồ sơ thứ nhất') + profileHTML(view.selected) + '</div>' +
          '<div>' + picker('stuB', view.second, 'Hồ sơ thứ hai') + profileHTML(view.second) + '</div></div>' +
          '<p class="compare-note">Hai hồ sơ có lỗi khác nhau nên hệ thống gợi ý hai bài khác nhau. Lý do nằm ngay dưới mỗi gợi ý.</p>'
        : picker('stuA', view.selected, 'Chọn học sinh') + profileHTML(view.selected) + recentHTML(view.selected)) +
      '</section>';
  }

  function detail(van) {
    var sid = view.selected;
    var recs = S.state.records.filter(function (r) { return r.studentId === sid && r.van === van; }).sort(function (a, b) { return b.date - a.date; });
    var reads = recs.filter(function (r) { return r.skill === 'doc'; }).slice(0, 10);
    var games = recs.filter(function (r) { return r.skill === 'nhan-dien'; });
    var g = D.groupOfVan(van);
    ui.openDialog(
      '<h2 id="dialog-title" class="dialog-title">' + (D.unitWord(van) === 'âm' ? 'Âm' : 'Vần') + ' <span class="glyph-inline">' + ui.esc(van) + '</span> của ' + ui.esc(S.studentLabel(sid)) + '</h2>' +
      (reads.length
        ? '<div class="table-wrap"><table class="table"><thead><tr><th scope="col">Ngày</th><th scope="col">Tiếng</th><th scope="col">Kết quả</th><th scope="col">Lỗi</th></tr></thead><tbody>' +
          reads.map(function (r) {
            return '<tr><td class="tnum">' + ui.fmtShort(r.date) + '</td><td class="reading">' + ui.vanWord(r.tieng, van) + '</td><td>' +
              (r.correct ? '<span class="pill pill-ok">Đúng</span>' : '<span class="pill pill-miss">Chưa đúng</span>') + '</td><td>' + (r.error ? ui.esc(D.label(D.READ_ERRORS, r.error)) : '') + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p>Chưa có lần đọc nào của vần này.</p>') +
      timelineHTML(recs.filter(function (r) { return r.skill === 'doc'; })) +
      '<p class="muted">Trò chơi nhận diện: ' + (games.length ? games.filter(function (r) { return r.correct; }).length + '/' + games.length + ' lượt chọn đúng.' : 'chưa chơi.') + '</p>' +
      '<div class="dialog-actions"><button type="button" class="btn" data-global="close-dialog">Đóng</button>' +
      '<a class="btn btn-primary" href="#/danh-gia/phieu/' + encodeURIComponent(sid) + '/' + g.id + '/' + encodeURIComponent(van) + '" data-global="close-dialog">Ghi phiếu đọc vần này</a></div>'
    );
  }

  // Đối chiếu: kết quả đọc vần này theo từng buổi, cũ đến mới.
  function timelineHTML(reads) {
    var byDay = {}, order = [];
    reads.slice().sort(function (a, b) { return a.date - b.date; }).forEach(function (r) {
      var key = ui.fmtDate(r.date);
      if (!byDay[key]) { byDay[key] = { c: 0, t: 0, date: r.date }; order.push(key); }
      byDay[key].t++; if (r.correct) byDay[key].c++;
    });
    if (order.length < 1) return '';
    return '<h3 class="sub-title">Đối chiếu theo buổi</h3><ol class="timeline">' + order.map(function (k) {
      var d = byDay[k], r = d.c / d.t;
      return '<li><span class="tnum">' + ui.fmtShort(d.date) + '</span><span class="bar" aria-hidden="true"><span style="width:' + Math.round(r * 100) + '%"></span></span>' +
        '<span class="num">' + d.c + '/' + d.t + '</span></li>';
    }).join('') + '</ol>' +
      (order.length > 1 ? '<p class="muted">' + (byDay[order[order.length - 1]].c / byDay[order[order.length - 1]].t > byDay[order[0]].c / byDay[order[0]].t ? 'Buổi gần nhất tốt hơn buổi đầu.' : 'Buổi gần nhất chưa tốt hơn buổi đầu; cân nhắc đổi cách luyện.') + '</p>' : '');
  }

  function changeDialog(studentId) {
    var learned = D.vansUpTo(S.state.classInfo.progress);
    var cur = S.assignment(studentId) || S.suggest(studentId);
    ui.openDialog(
      '<form data-form="change"><h2 id="dialog-title" class="dialog-title">Đổi bài cho ' + ui.esc(S.studentLabel(studentId)) + '</h2>' +
      '<div class="field"><label for="chg-van">Âm, vần cần luyện</label><select id="chg-van" name="van">' +
      D.GROUPS.filter(function (g) { return g.id <= S.state.classInfo.progress; }).map(function (g) {
        return '<optgroup label="Nhóm ' + g.id + '">' + g.vans.map(function (v) { return '<option value="' + ui.esc(v) + '"' + (v === cur.van ? ' selected' : '') + '>' + ui.esc(D.unitLabel(v)) + '</option>'; }).join('') + '</optgroup>';
      }).join('') + '</select></div>' +
      '<fieldset class="field"><legend>Mức độ</legend>' + ui.segmented('chg-level', D.LEVELS, cur.level, 'Mức độ') + '</fieldset>' +
      '<div class="field"><label for="chg-note">Ghi chú của giáo viên <span class="optional">(không bắt buộc)</span></label><input id="chg-note" name="note" autocomplete="off" placeholder="Ví dụ: em đọc nhầm an và ang…"></div>' +
      '<div class="dialog-actions"><button type="button" class="btn" data-global="close-dialog">Hủy</button><button type="submit" class="btn btn-primary">Giao bài</button></div></form>',
      {
        onMount: function (dlg) {
          dlg.querySelector('form').onsubmit = function (e) {
            e.preventDefault();
            var f = e.target;
            var van = f.van.value;
            var level = f.querySelector('input[name="chg-level"]:checked').value;
            var note = f.note.value.trim();
            S.commit(function (s) {
              s.assignments[studentId] = { van: van, level: level, source: 'giao-vien', date: Date.now(), reason: note || 'Giáo viên chọn bài.' };
            });
            ui.closeDialog();
